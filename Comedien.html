const AI_FORMAT_PROMPT = `Tu es un assistant qui reformate des textes de théâtre ou de scénario pour une appli de répétition de comédien (analyse automatique façon protocole CEAD). Reformate le texte que je te donne en suivant ces règles STRICTES, sans jamais changer les dialogues eux-mêmes, sans rien résumer et sans rien couper :

1. Le nom de chaque personnage doit être écrit en MAJUSCULES, seul sur sa propre ligne, juste avant sa réplique (pas de numéro, pas de tiret devant) — MÊME si le texte d'origine l'écrit autrement (minuscules, Première Lettre En Majuscule, entre crochets, centré, précédé d'un numéro ou d'un tiret, etc.) : tu dois toujours convertir vers ce format unique, quelle que soit la convention (ancienne ou récente, scénario à l'américaine avec "NOM (V.O.)"/"NOM (CONT'D)", texte de théâtre classique, ou simple script tapé à la va-vite).
2. Laisse une ligne complètement vide entre chaque réplique (donc entre chaque personnage).
3. RÈGLE LA PLUS IMPORTANTE — ne mets JAMAIS la didascalie d'entrée et la réplique sur la même ligne. Si une courte indication de jeu précède une réplique (ex. "s'étirant paresseusement"), mets-la juste après le nom, séparée par une virgule, en minuscules, sans parenthèses — mais la réplique elle-même commence TOUJOURS sur la ou les lignes suivantes, jamais collée après sur la même ligne. Exemple correct :
   MARIE, s'étirant paresseusement
   Quelle heure est-il déjà ?
   Exemple INTERDIT (à ne jamais faire) : "MARIE, s'étirant paresseusement Quelle heure est-il déjà ?" tout sur une ligne.
4. Si le personnage parle hors champ, en coulisse, en aparté, ou avec une précision de ce type, mets-la entre parenthèses juste après le nom (avant les deux-points s'il y en a) : "MARCUS (off) : Lâchez-moi !" ou "MARCUS (à part)". C'EST TOUJOURS LE MÊME PERSONNAGE : n'invente jamais un nom différent du type "MARCUS OFF" ou "MARCUS COULISSE" — le nom seul (ici "MARCUS") doit rester rigoureusement identique à ses autres répliques, l'annotation entre parenthèses suffit à indiquer qu'il est hors champ.
5. Si une indication de jeu apparaît au milieu d'une réplique, garde-la entre parenthèses à l'intérieur du texte, sur la même ligne que la réplique.
6. Une didascalie qui ne concerne aucun personnage en particulier (bruit, changement de lumière, entrée/sortie d'un personnage racontée à la 3e personne) doit être seule sur sa propre ligne, entre parenthèses, jamais accolée à la réplique d'un personnage avant ou après.
7. Les titres et repères de structure (ACTE, SCÈNE, chapitre, nom de partie, indication technique de lumière/son, titre de la pièce) ne sont JAMAIS un nom de personnage : mets-les seuls sur leur propre ligne, jamais au début ou à la fin de la ligne d'une réplique, et ne les fais jamais suivre d'une réplique sur la ligne d'après comme s'il s'agissait d'un personnage qui parle.
7bis. Une didascalie qui nomme un personnage mais où ce personnage ne dit rien (ex. "PIERRE se lève et sort." — une action racontée, pas une réplique) n'est PAS une réplique de ce personnage : traite-la comme la didascalie autonome de la règle 6 (seule sur sa ligne, entre parenthèses), jamais comme si "PIERRE" prenait la parole.
8. Si deux personnages différents ont le même prénom ou si un même personnage a plusieurs façons d'être nommé, garde un nom UNIQUE et IDENTIQUE à chaque occurrence (ex. toujours "NADYA", pas tantôt "NADYA" tantôt "LA JEUNE FILLE") — un nom composé du type "NOM1/NOM2" est accepté s'il désigne un seul rôle joué indifféremment par plusieurs interprètes (personnage du public, doublure...).
9. Ne mets jamais de numéros de ligne, de mise en page complexe (tableaux, colonnes, puces).
10. Si un titre ou une didascalie ne rentre dans aucun des cas ci-dessus (ex. formulation en minuscules sans parenthèses), préfixe-la avec une balise entre crochets plutôt que de deviner : [TITRE] pour un titre d'acte/scène, [DIDASCALIE] pour une indication de jeu autonome, [REGIE] pour une note technique. Exemple : "[DIDASCALIE] Un silence pesant s'installe".
11. Renvoie uniquement le texte reformaté, sans commentaire ni explication autour.

Voici le texte à reformater :

[COLLE TON TEXTE ICI]`;

async function extractFileText(file) {
  if (file.name.toLowerCase().endsWith('.txt')) return await file.text();
  if (file.name.toLowerCase().endsWith('.docx') && window.mammoth) return (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  if (file.name.toLowerCase().endsWith('.pdf') && window.pdfjsLib) return await extractPdfText(file);
  return null;
}

function TexteImportForm({ onSave, onSaveMultiple, onCancel }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [titre, setTitre] = useState('');
  const [contenu, setContenu] = useState('');
  const [status, setStatus] = useState('');
  const [promptCopied, setPromptCopied] = useState(false);
  const [showAiTip, setShowAiTip] = useState(false);
  const fileRef = useRef(null);
  const textAreaRef = useRef(null);

  const copyText = async (text) => {
    try { await navigator.clipboard.writeText(text); }
    catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
  };

  const copyAiPrompt = async () => {
    await copyText(AI_FORMAT_PROMPT);
    setPromptCopied(true);
    setTimeout(() => setPromptCopied(false), 2500);
  };

  const pasteFromClipboard = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) setContenu(text);
    } catch (err) {
      setStatus("Impossible de lire le presse-papier automatiquement — colle avec un appui long dans le champ ci-dessous.");
    }
  };

  const insertMarker = (marker) => {
    const el = textAreaRef.current;
    if (!el) { setContenu(c => c + ' ' + marker + ' '); return; }
    const start = el.selectionStart, end = el.selectionEnd;
    const next = contenu.slice(0, start) + ' ' + marker + ' ' + contenu.slice(end);
    setContenu(next);
    requestAnimationFrame(() => { el.focus(); const pos = start + marker.length + 2; el.setSelectionRange(pos, pos); });
  };

  const handleFiles = async (e) => {
    const files = [...e.target.files];
    if (!files.length) return;
    if (files.length === 1) {
      const file = files[0];
      setStatus('Lecture du fichier…');
      try {
        const text = await extractFileText(file);
        if (text === null) { setStatus("Format non reconnu ou bibliothèque indisponible — colle le texte manuellement ci-dessous."); return; }
        setContenu(text);
        setStatus('Texte importé, vérifie-le ci-dessous avant d\'enregistrer.');
        if (!titre) setTitre(file.name.replace(/\.[^.]+$/, ''));
      } catch (err) {
        console.error(err);
        setStatus("Échec de l'import automatique — colle le texte manuellement ci-dessous.");
      }
      return;
    }
    setStatus(`Analyse de ${files.length} fichiers…`);
    const entries = [];
    for (const file of files) {
      try {
        const text = await extractFileText(file);
        if (text !== null) entries.push({ titre: file.name.replace(/\.[^.]+$/, ''), contenu: text });
      } catch (err) { console.error(err); }
    }
    if (entries.length) {
      onSaveMultiple(entries);
    } else {
      setStatus("Aucun des fichiers n'a pu être lu — importe-les un par un ou colle le texte manuellement.");
    }
  };

  return (
    <div className="space-y-3">
      <Field label="Titre"><TextInput value={titre} onChange={(e) => setTitre(e.target.value)} placeholder="Nom du texte / spectacle" /></Field>
      <Field label="Importer un ou plusieurs fichiers (.txt, .docx, .pdf) — optionnel">
        <input ref={fileRef} type="file" accept=".txt,.docx,.pdf" multiple onChange={handleFiles} className="text-xs" />
        <div className={cx('text-xs mt-1', t.textMuted)}>Un seul fichier : tu peux vérifier le texte avant d'enregistrer. Plusieurs fichiers : chacun devient directement un texte séparé.</div>
      </Field>
      {status && <div className="text-xs opacity-70">{status}</div>}
      <div className={cx('rounded-xl p-3 text-xs leading-relaxed', t.soft)}>
        <strong className={t.accent}>Astuce :</strong> nom du personnage en MAJUSCULES sur sa propre ligne (ou "NOM : réplique"). Pas grave si ce n'est pas parfait, tu pourras tout corriger ensuite.
      </div>
      {!showAiTip ? (
        <button onClick={() => setShowAiTip(true)} className={cx('text-xs font-medium', t.accent)}>Texte mal formaté ou compliqué ? →</button>
      ) : (
        <div className={cx('rounded-xl p-3 text-xs leading-relaxed', t.soft)}>
          Copie ce prompt, colle-le dans une IA (ChatGPT, Claude…) avec ton texte à la fin, puis colle sa réponse ici.
          <div className="mt-2">
            <Btn variant="ghost" onClick={copyAiPrompt}><Icon name={promptCopied ? 'check' : 'copy'} size={14} />{promptCopied ? 'Copié !' : 'Copier le prompt de formatage'}</Btn>
          </div>
        </div>
      )}
      <Field label="Texte (colle ou vérifie ici)">
        <div className="flex gap-1.5 mb-1.5 flex-wrap">
          <Btn variant="ghost" onClick={pasteFromClipboard} title="Coller depuis le presse-papier"><Icon name="upload" size={14} />Coller</Btn>
          <Btn variant="ghost" onClick={() => insertMarker('/')} title="Marqueur de respiration courte">/ souffle</Btn>
          <Btn variant="ghost" onClick={() => insertMarker('//')} title="Marqueur de pause plus longue">// pause</Btn>
        </div>
        <TextArea ref={textAreaRef} rows={10} value={contenu} onChange={(e) => setContenu(e.target.value)} placeholder={"NOM PERSONNAGE\nSa réplique ici.\n\nAUTRE PERSONNAGE : sa réplique sur la même ligne."} />
      </Field>
      {contenu.trim() && (() => {
        const preview = parseScript(contenu);
        const perso = Array.from(new Set(preview.map(b => b.personnage))).filter(p => p !== 'Didascalie');
        const repliques = preview.filter(b => b.personnage !== 'Didascalie').length;
        const ok = perso.length > 1 || (perso.length === 1 && perso[0] !== 'Non attribué');
        return (
          <div className={cx('rounded-xl p-3 text-xs', ok ? t.soft : 'bg-amber-500/15 text-amber-600')}>
            {ok
              ? <span>✓ {perso.length} personnage(s) détecté(s) : <strong>{perso.join(', ')}</strong> — {repliques} réplique(s).</span>
              : <span>⚠️ Aucun personnage détecté pour l'instant (tout est regroupé sous "Non attribué"). Vérifie le format du texte ci-dessus avant d'enregistrer.</span>}
          </div>
        );
      })()}
      <div className="flex justify-end gap-2 pt-2">
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
        <Btn disabled={!contenu.trim()} onClick={() => onSave(titre.trim() || 'Sans titre', contenu)}><Icon name="check" size={16} />Analyser &amp; enregistrer</Btn>
      </div>
    </div>
  );
}

function TextesTab({ data, setData, openId, setOpenId }) {
  const { theme } = useTheme();
  const { confirm } = useUIFeedback();
  const t = themeClasses(theme);
  const [modal, setModal] = useState(false);
  const [dossierModal, setDossierModal] = useState(false);
  const [search, setSearch] = useState('');
  const [filterType, setFilterType] = useState('Tous');
  const [filterStatut, setFilterStatut] = useState('Tous');
  const [showMoreFilters, setShowMoreFilters] = useState(false);
  const [filterDossier, setFilterDossier] = useState('Tous');
  const [sortMode, setSortMode] = useState('alpha');

  const dossiers = useMemo(() => {
    const fromTextes = data.textes.map(tx => tx.dossier).filter(Boolean);
    return Array.from(new Set([...data.dossiersTextes, ...fromTextes]));
  }, [data.textes, data.dossiersTextes]);

  const activeDossier = filterDossier !== 'Tous' && filterDossier !== 'Sans dossier' ? filterDossier : '';

  const makeTexte = (titre, contenu) => {
    const blocks = parseScript(contenu);
    return { id: uid(), titre, contenu, original: contenu, blocks, personnages: Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie'), monPersonnage: '', statutMemorisation: 'À apprendre', auteur: '', compagnie: '', registre: 'Neutre', type: 'Scène', dossier: activeDossier, dateModif: new Date().toISOString() };
  };
  const addTexte = (titre, contenu) => {
    const nouveau = makeTexte(titre, contenu);
    setData(d => ({ ...d, textes: [...d.textes, nouveau] }));
    setModal(false);
    setOpenId(nouveau.id);
  };
  const addMultipleTextes = (entries) => {
    const nouveaux = entries.map(({ titre, contenu }) => makeTexte(titre, contenu));
    setData(d => ({ ...d, textes: [...d.textes, ...nouveaux] }));
    setModal(false);
  };
  const updateTexte = (updated) => setData(d => ({
    ...d,
    textes: d.textes.map(tx => tx.id === updated.id ? { ...updated, dateModif: new Date().toISOString() } : tx),
    dossiersTextes: updated.dossier && !d.dossiersTextes.includes(updated.dossier) ? [...d.dossiersTextes, updated.dossier] : d.dossiersTextes,
  }));
  const removeTexte = (id) => setData(d => ({ ...d, textes: d.textes.filter(tx => tx.id !== id) }));
  const duplicateTexte = (original) => {
    const copy = { ...original, id: uid(), titre: original.titre + ' (copie)', dateModif: new Date().toISOString() };
    setData(d => ({ ...d, textes: [...d.textes, copy] }));
  };
  // Réanalyse tous les textes avec le détecteur actuel — utile après une mise à jour
  // de l'appli, pour que les textes déjà importés (analysés avec un ancien moteur)
  // profitent des corrections sans devoir être supprimés puis réimportés un par un.
  const reparseAllTextes = async () => {
    if (!(await confirm(`Relancer l'analyse automatique sur les ${data.textes.length} texte(s) ? Les réattributions manuelles, notes de régie et marquages faits dans l'onglet Corriger seront perdus pour chacun.`, { danger: true }))) return;
    setData(d => ({
      ...d,
      textes: d.textes.map(tx => {
        const blocks = parseScript(tx.original || tx.contenu);
        const personnages = Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
        return { ...tx, blocks, personnages };
      }),
    }));
  };

  const renameDossier = (oldName, newName) => {
    if (!newName || newName === oldName) return;
    setData(d => ({
      ...d,
      dossiersTextes: Array.from(new Set(d.dossiersTextes.map(x => x === oldName ? newName : x))),
      textes: d.textes.map(tx => tx.dossier === oldName ? { ...tx, dossier: newName } : tx),
    }));
    if (filterDossier === oldName) setFilterDossier(newName);
  };
  const deleteDossier = async (name) => {
    const count = data.textes.filter(tx => tx.dossier === name).length;
    const msg = count > 0 ? `${count} texte(s) sont dans "${name}" — ils repasseront en "Sans dossier". Continuer ?` : `Supprimer le dossier "${name}" ?`;
    if (!(await confirm(msg, { danger: true }))) return;
    setData(d => ({
      ...d,
      dossiersTextes: d.dossiersTextes.filter(x => x !== name),
      textes: d.textes.map(tx => tx.dossier === name ? { ...tx, dossier: '' } : tx),
    }));
    if (filterDossier === name) setFilterDossier('Tous');
  };

  const exportRepertoirePdf = () => {
    const el = document.getElementById('print-root');
    el.innerHTML = '';
    const accent = '#0f766e';
    const h2 = `font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:${accent};font-weight:700;border-bottom:1.5px solid ${accent};padding-bottom:4px;margin:22px 0 10px;`;
    const p = data.profile;
    const types = ['Monologue', 'Scène', 'Pièce complète'];
    const grouped = types.map(ty => ({ ty, items: data.textes.filter(tx => (tx.type || 'Scène') === ty) })).filter(g => g.items.length);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family: Helvetica, Arial, sans-serif; color:#1a1a1a; max-width:760px; line-height:1.5;';
    wrap.innerHTML = `
      <div style="border-bottom:3px solid ${accent};padding-bottom:16px;">
        <div style="font-size:26px;font-weight:700;letter-spacing:-0.3px;">${p.prenom || ''} ${p.nom || ''}</div>
        <div style="font-size:14px;color:${accent};font-weight:600;margin-top:2px;">Répertoire — ${data.textes.length} texte(s)</div>
      </div>
      ${grouped.map(g => `
        <h2 style="${h2}">${g.ty}</h2>
        ${g.items.map(tx => {
          const lecture = estimerLecture(tx.blocks);
          const details = [tx.auteur, tx.compagnie, tx.registre && tx.registre !== 'Neutre' ? tx.registre : ''].filter(Boolean).join(' · ');
          return `
            <div style="font-size:13px;margin-bottom:7px;">
              <div style="display:flex;justify-content:space-between;gap:12px;">
                <strong>${tx.titre}</strong>
                <span style="color:#888;white-space:nowrap;">~${lecture.normal} min</span>
              </div>
              ${details ? `<div style="color:#666;font-size:12px;">${details}</div>` : ''}
            </div>
          `;
        }).join('')}
      `).join('')}
    `;
    el.appendChild(wrap);
    setTimeout(() => window.print(), 50);
  };

  const openTexte = data.textes.find(tx => tx.id === openId);
  if (openTexte) {
    return <TexteDetail texte={openTexte} dossiers={dossiers} onUpdate={updateTexte}
      rate={data.settings.rate} volume={data.settings.volume}
      onRateChange={(v) => setData(d => ({ ...d, settings: { ...d.settings, rate: v } }))}
      onVolumeChange={(v) => setData(d => ({ ...d, settings: { ...d.settings, volume: v } }))} />;
  }

  let filtered = data.textes.filter(tx => {
    const matchType = filterType === 'Tous' || (tx.type || 'Scène') === filterType;
    const matchStatut = filterStatut === 'Tous' || tx.statutMemorisation === filterStatut;
    const matchDossier = filterDossier === 'Tous' || (filterDossier === 'Sans dossier' ? !tx.dossier : tx.dossier === filterDossier);
    const matchSearch = !search || (tx.titre + ' ' + (tx.auteur || '') + ' ' + (tx.compagnie || '')).toLowerCase().includes(search.toLowerCase());
    return matchType && matchStatut && matchDossier && matchSearch;
  });
  filtered = [...filtered].sort((a, b) => sortMode === 'alpha' ? a.titre.localeCompare(b.titre) : (b.dateModif || '').localeCompare(a.dateModif || ''));

  return (
    <div className="space-y-3 pb-4">
      <Card>
        <SectionTitle icon="book" right={
          <div className="flex gap-1.5 shrink-0">
            <DropdownMenu items={[
              { icon: 'settings', label: 'Gérer les dossiers', onClick: () => setDossierModal(true), hidden: dossiers.length === 0 },
              { icon: 'undo', label: 'Réanalyser tous les textes', onClick: reparseAllTextes, hidden: data.textes.length === 0 },
              { icon: 'download', label: 'Exporter le répertoire (PDF)', onClick: exportRepertoirePdf, hidden: data.textes.length === 0 },
            ]} />
            <Btn onClick={() => setModal(true)}><Icon name="plus" size={16} />Texte</Btn>
          </div>
        }>Textes</SectionTitle>
        {dossiers.length > 0 && (
          <div className="flex items-center gap-2 mb-2">
            <Icon name="folder" size={15} className={cx('shrink-0', t.textMuted)} />
            <Select value={filterDossier} onChange={(e) => setFilterDossier(e.target.value)}>
              <option value="Tous">Tous les dossiers</option>
              <option value="Sans dossier">Sans dossier</option>
              {dossiers.map(d => <option key={d} value={d}>{d}</option>)}
            </Select>
          </div>
        )}
        {data.textes.length > 3 && (
          <>
            <div className="flex gap-2 mb-2">
              <div className="relative flex-1">
                <Icon name="search" size={16} className={cx('absolute left-2.5 top-2.5', t.textMuted)} />
                <TextInput placeholder="Rechercher un texte, un auteur…" value={search} onChange={(e) => setSearch(e.target.value)} className="pl-8" />
              </div>
              <IconBtn name="filter" title="Trier : alphabétique / dernière modification" onClick={() => setSortMode(m => m === 'alpha' ? 'recent' : 'alpha')} />
              <button onClick={() => setShowMoreFilters(s => !s)}
                className={cx('shrink-0 flex items-center gap-1 text-xs px-3 rounded-2xl font-medium', (filterType !== 'Tous' || filterStatut !== 'Tous') ? t.btnPrimary : cx(t.soft, t.textMuted))}>
                Filtres{(filterType !== 'Tous' || filterStatut !== 'Tous') ? ' (1)' : ''}
                <Icon name={showMoreFilters ? 'chevronUp' : 'chevronDown'} size={13} />
              </button>
            </div>
            {showMoreFilters && (
              <div className={cx('rounded-xl p-2.5 mb-2 grid grid-cols-2 gap-2', t.soft)}>
                <Field label="Type">
                  <Select value={filterType} onChange={(e) => setFilterType(e.target.value)}>
                    {['Tous', 'Monologue', 'Scène', 'Pièce complète'].map(ty => <option key={ty} value={ty}>{ty}</option>)}
                  </Select>
                </Field>
                <Field label="Mémorisation">
                  <Select value={filterStatut} onChange={(e) => setFilterStatut(e.target.value)}>
                    {['Tous', 'À apprendre', 'En cours', 'Su'].map(st => <option key={st} value={st}>{st}</option>)}
                  </Select>
                </Field>
              </div>
            )}
          </>
        )}
        {filtered.length === 0 ? <EmptyState icon="book" text={data.textes.length === 0 ? "Importe ou colle ton premier texte à répéter." : "Aucun texte ne correspond."} /> : (
          <div className="space-y-2">
            {filtered.map((tx, i) => (
              <div key={tx.id} onClick={() => setOpenId(tx.id)} style={{ animationDelay: Math.min(i, 10) * 35 + 'ms' }}
                className={cx('listItemIn rounded-xl p-3 cursor-pointer border-l-4 flex gap-3 transition-transform hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.99]', `border-${currentAccent}-400`, t.soft, t.cardHover)}>
                <div className={cx('w-9 h-9 rounded-full flex items-center justify-center shrink-0', theme === 'sombre' ? `bg-${currentAccent}-500/15 text-${currentAccent}-400` : `bg-${currentAccent}-50 text-${currentAccent}-700`)}>
                  <Icon name={TEXTE_TYPE_ICONS[tx.type] || 'book'} size={16} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-medium truncate">{tx.titre}</div>
                  <div className="flex items-center justify-between gap-2 mt-1">
                    <Pill tone={STATUT_MEMO_TONE[tx.statutMemorisation] || 'accent'}>{tx.statutMemorisation}</Pill>
                    <div className="flex gap-0.5 shrink-0 -mr-1.5">
                      <IconBtn name="copy" title="Dupliquer" onClick={(e) => { e.stopPropagation(); duplicateTexte(tx); }} />
                      <ConfirmDeleteButton onConfirm={() => removeTexte(tx.id)} />
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
      {modal && (
        <Modal title="Nouveau texte" onClose={() => setModal(false)}>
          <TexteImportForm onSave={addTexte} onSaveMultiple={addMultipleTextes} onCancel={() => setModal(false)} />
        </Modal>
      )}
      {dossierModal && <DossiersModal dossiers={dossiers} textes={data.textes} onRename={renameDossier} onDelete={deleteDossier} onClose={() => setDossierModal(false)} />}
    </div>
  );
}

function ExerciceForm({ initial, categories, onSave, onCancel }) {
  const [v, setV] = useState(initial);
  const [newCat, setNewCat] = useState('');
  const set = (k) => (e) => setV({ ...v, [k]: e.target.value });
  return (
    <div className="space-y-3">
      <Field label="Titre"><TextInput value={v.titre} onChange={set('titre')} autoFocus /></Field>
      <Field label="Catégorie">
        <Select value={v.categorie} onChange={set('categorie')}>
          {categories.map(c => <option key={c} value={c}>{c}</option>)}
        </Select>
        <div className="flex gap-2 mt-2">
          <TextInput placeholder="Nouvelle catégorie…" value={newCat} onChange={(e) => setNewCat(e.target.value)} />
          <Btn variant="ghost" onClick={() => { if (newCat.trim()) { setV({ ...v, categorie: newCat.trim() }); setNewCat(''); } }}>+</Btn>
        </div>
      </Field>
      <Field label="Description"><TextArea rows={4} value={v.description} onChange={set('description')} /></Field>
      <div className="flex justify-end gap-2 pt-2">
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
        <Btn disabled={!v.titre.trim() || !v.categorie.trim()} onClick={() => onSave({ ...v, titre: v.titre.trim(), categorie: v.categorie.trim() })}><Icon name="check" size={16} />Enregistrer</Btn>
      </div>
    </div>
  );
}

function ExerciceCategoriesModal({ categories, exercices, onRename, onDelete, onClose }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [editing, setEditing] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  return (
    <Modal title="Gérer les catégories" onClose={onClose}>
      <div className="space-y-2">
        {categories.map(cat => {
          const count = exercices.filter(e => e.categorie === cat).length;
          return (
            <div key={cat} className={cx('flex items-center gap-2 rounded-xl p-2', t.soft)}>
              {editing === cat ? (
                <>
                  <TextInput value={renameValue} onChange={(e) => setRenameValue(e.target.value)} className="flex-1" autoFocus />
                  <IconBtn name="check" onClick={() => { onRename(cat, renameValue.trim()); setEditing(null); }} />
                  <IconBtn name="x" onClick={() => setEditing(null)} />
                </>
              ) : (
                <>
                  <div className="flex-1 text-sm min-w-0 truncate">{cat} <span className={cx('text-xs', t.textMuted)}>({count})</span></div>
                  <IconBtn name="edit" title="Renommer" onClick={() => { setEditing(cat); setRenameValue(cat); }} />
                  <IconBtn name="trash" danger title="Supprimer" onClick={() => onDelete(cat)} />
                </>
              )}
            </div>
          );
        })}
      </div>
    </Modal>
  );
}

function EntrainementTab({ data, setData }) {
  const { theme } = useTheme();
  const { confirm } = useUIFeedback();
  const t = themeClasses(theme);
  const [cat, setCat] = useState('Tous');
  const [modal, setModal] = useState(null); // {editingId} or null
  const [catModal, setCatModal] = useState(false);

  // Catégories gérées (data.exerciceCategories) + toute catégorie déjà utilisée par un
  // exercice (au cas où une sauvegarde importée soit incohérente) — même principe que
  // les catégories de Contacts, pour ne jamais perdre une catégorie existante.
  const exerciceCategories = useMemo(() => {
    const fromExos = data.exercices.map(e => e.categorie).filter(Boolean);
    return Array.from(new Set([...data.exerciceCategories, ...fromExos]));
  }, [data.exercices, data.exerciceCategories]);
  const cats = ['Tous', ...exerciceCategories, 'Diction'];

  const toggleFav = (id) => setData(d => ({ ...d, favorisExercices: d.favorisExercices.includes(id) ? d.favorisExercices.filter(x => x !== id) : [...d.favorisExercices, id] }));

  const upsertExercice = (v) => {
    setData(d => {
      const categories = d.exerciceCategories.includes(v.categorie) ? d.exerciceCategories : [...d.exerciceCategories, v.categorie];
      const exercices = modal.editingId
        ? d.exercices.map(e => e.id === modal.editingId ? { ...e, ...v } : e)
        : [...d.exercices, { id: uid(), ...v }];
      return { ...d, exercices, exerciceCategories: categories };
    });
    setModal(null);
  };
  const removeExercice = (id) => setData(d => ({ ...d, exercices: d.exercices.filter(e => e.id !== id), favorisExercices: d.favorisExercices.filter(x => x !== id) }));

  const renameExoCategory = (oldName, newName) => {
    if (!newName || newName === oldName) return;
    setData(d => ({
      ...d,
      exerciceCategories: Array.from(new Set(d.exerciceCategories.map(c => c === oldName ? newName : c))),
      exercices: d.exercices.map(e => e.categorie === oldName ? { ...e, categorie: newName } : e),
    }));
    if (cat === oldName) setCat(newName);
  };
  const deleteExoCategory = async (name) => {
    const count = data.exercices.filter(e => e.categorie === name).length;
    const msg = count > 0 ? `${count} exercice(s) utilisent "${name}" — ils seront supprimés aussi. Continuer ?` : `Supprimer la catégorie "${name}" ?`;
    if (!(await confirm(msg, { danger: true }))) return;
    setData(d => ({
      ...d,
      exerciceCategories: d.exerciceCategories.filter(c => c !== name),
      exercices: d.exercices.filter(e => e.categorie !== name),
    }));
    if (cat === name) setCat('Tous');
  };

  const exos = cat === 'Tous' || cat === 'Diction' ? [] : data.exercices.filter(e => e.categorie === cat);
  const showAllExos = cat === 'Tous' ? data.exercices : exos;
  const catIcon = { Respiration: 'wind', Corps: 'dumbbell', Voix: 'mic' };
  const badgeCls = theme === 'sombre' ? `bg-${currentAccent}-500/15 text-${currentAccent}-400` : `bg-${currentAccent}-50 text-${currentAccent}-700`;

  return (
    <div className="space-y-3 pb-4">
      <Card hero className={cx('text-white', t.headerGrad)}>
        <div className="font-bold text-lg">Corps, voix &amp; diction</div>
        <div className="text-xs opacity-85 mt-0.5">Échauffe-toi avant de jouer, un exercice à la fois.</div>
      </Card>

      <Select value={cat} onChange={(e) => setCat(e.target.value)}>
        {cats.map(c => <option key={c} value={c}>{c === 'Tous' ? 'Toutes les catégories' : c}</option>)}
      </Select>

      {cat !== 'Diction' && (
        <Card>
          <SectionTitle icon="dumbbell" right={
            <div className="flex gap-1.5 shrink-0">
              <IconBtn name="settings" title="Gérer les catégories" onClick={() => setCatModal(true)} />
              <Btn onClick={() => setModal({ editingId: null })}><Icon name="plus" size={16} />Exercice</Btn>
            </div>
          }>Exercices</SectionTitle>
          {showAllExos.length === 0 ? <EmptyState icon="dumbbell" text="Aucun exercice dans cette catégorie." /> : (
          <div className="space-y-2">
            {showAllExos.map((ex, i) => {
              const isFav = data.favorisExercices.includes(ex.id);
              return (
              <div key={ex.id} style={{ animationDelay: Math.min(i, 10) * 35 + 'ms' }}
                className={cx('listItemIn rounded-xl p-3 flex gap-3 border-l-4', isFav ? `border-${currentAccent}-400` : 'border-transparent', t.soft)}>
                <div className={cx('w-9 h-9 rounded-full flex items-center justify-center shrink-0', badgeCls)}>
                  <Icon name={catIcon[ex.categorie] || 'tag'} size={16} />
                </div>
                <div className="min-w-0 flex-1">
                  <div className="flex items-start justify-between gap-2">
                    <div className="font-semibold">{ex.titre}</div>
                    <div className="flex items-center gap-0.5 shrink-0 -mt-1">
                      <IconBtn name={isFav ? 'starFilled' : 'star'} onClick={() => toggleFav(ex.id)} title="Favori" pop={isFav} className={isFav ? t.accent : ''} />

  );

function readAndCompressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Met en valeur les noms de boutons/onglets entre guillemets (semi-gras, couleur
// d'accent) et les balises [TITRE]/[DIDASCALIE]/[REGIE] (badge façon "code") pour que
// la notice se parcoure d'un coup d'œil au lieu de se lire comme un bloc de texte.
function renderGuideRichText(text, t) {
  return text.split(/("(?:[^"\\]|\\.)*"|\[[A-ZÉÈ]+\])/g).filter(Boolean).map((part, i) => {
    if (part[0] === '"' && part[part.length - 1] === '"') {
      return <strong key={i} className={cx('font-semibold', t.accent)}>{part}</strong>;
    }
    if (/^\[[A-ZÉÈ]+\]$/.test(part)) {
      return <code key={i} className={cx('mx-0.5 px-1.5 py-0.5 rounded-md text-[11px] font-mono font-semibold', t.soft, t.accent)}>{part}</code>;
    }
    return part;
  });
}

function SettingsModal({ data, settings, setData, onClose, onGoToProfil, lastBackupAt, onBackup }) {
  const { theme, toggle } = useTheme();
  const { confirm, notify } = useUIFeedback();
  const t = themeClasses(theme);
  const importRef = useRef(null);
  const mergeRef = useRef(null);
  const [showGuide, setShowGuide] = useState(false);

  const setAccent = (accent) => setData(d => ({ ...d, settings: { ...d.settings, accent } }));
  const setFontScale = (fontScale) => setData(d => ({ ...d, settings: { ...d.settings, fontScale } }));

  const exportJson = () => {
    setData(currentData => {
      const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'comedien-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return currentData;
    });
    onBackup();
  };

  const importJson = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!(await confirm('Restaurer ces données va remplacer toutes les données actuelles. Continuer ?', { danger: true }))) return;
        setData(mergeWithDefaults(parsed));
        onClose();
      } catch (err) { notify('Fichier invalide.', 'error'); }
    };
    reader.readAsText(file);
  };

  const resetAll = async () => {
    if (!(await confirm("Réinitialiser l'appli va supprimer TOUTES tes données (profil, contacts, cachets, textes…). Cette action est irréversible. Continuer ?", { danger: true, confirmLabel: 'Tout supprimer' }))) return;
    setData(defaultData());
    onClose();
  };

  // Contrairement à "Restaurer" (remplace tout), ceci AJOUTE le contenu d'un fichier
  // à ce qui existe déjà — utile pour intégrer un lot préparé (par ex. par une IA)
  // sans perdre les données déjà sur le téléphone. Réutilise les mêmes détections de
  // doublon que le reste de l'app (cachets, contacts, employeurs) pour rester sûr.
  const mergeJson = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let incoming;
      try { incoming = JSON.parse(ev.target.result); } catch (err) { notify('Fichier invalide.', 'error'); return; }
      // Calculé une seule fois, de façon synchrone, contre `data` (pas via l'updater
      // fonctionnel de setData) : sinon le compte-rendu affiché lirait le rapport avant
      // que React n'ait exécuté la fusion, et afficherait toujours des zéros.
      const d = data;
      const report = { cachets: 0, cachetsIgnores: 0, employeurs: 0, contacts: 0, contactsIgnores: 0, castings: 0, textes: 0, profil: false };
      let employeurs = d.employeurs, cachets = d.cachets, contacts = d.contacts, categories = d.categories,
        castings = d.castings, textes = d.textes, dossiersTextes = d.dossiersTextes, profile = d.profile;
      if (incoming.profile) { profile = applyProfilePatch(profile, incoming.profile, false); report.profil = true; }
      (incoming.employeurs || []).forEach(emp => {
        const idx = employeurs.findIndex(e2 => e2.nom.toLowerCase() === (emp.nom || '').toLowerCase());
        if (idx === -1) { employeurs = [...employeurs, { ...emp, id: uid() }]; report.employeurs++; }
      });
      (incoming.cachets || []).forEach(c => {
        if (findDuplicateCachet(c, cachets)) { report.cachetsIgnores++; return; }
        cachets = [...cachets, { ...c, id: uid() }];
        report.cachets++;
        const nom = (c.employeur || '').trim();
        if (nom) {
          const idx = employeurs.findIndex(e2 => e2.nom.toLowerCase() === nom.toLowerCase());
          employeurs = idx === -1 ? [...employeurs, { id: uid(), nom, typeParDefaut: c.type }] : employeurs;
        }
      });
      (incoming.contacts || []).forEach(c => {
        if (findDuplicateContact(c, contacts)) { report.contactsIgnores++; return; }
        contacts = [...contacts, { ...c, id: uid() }];
        if (c.categorie && !categories.includes(c.categorie)) categories = [...categories, c.categorie];
        report.contacts++;
      });
      (incoming.castings || []).forEach(c => { castings = [...castings, { ...c, id: uid() }]; report.castings++; });
      (incoming.textes || []).forEach(tx => {
        const contenu = tx.contenu || '';
        const blocks = tx.blocks || parseScript(contenu);
        const personnages = tx.personnages || Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
        textes = [...textes, {
          monPersonnage: '', statutMemorisation: 'À apprendre', auteur: '', compagnie: '', registre: 'Neutre', type: 'Scène',
          ...tx, id: uid(), contenu, original: tx.original || contenu, blocks, personnages, dateModif: new Date().toISOString(),
        }];
        if (tx.dossier && !dossiersTextes.includes(tx.dossier)) dossiersTextes = [...dossiersTextes, tx.dossier];
        report.textes++;
      });
      setData({ ...d, employeurs, cachets, contacts, categories, castings, textes, dossiersTextes, profile });
      notify(`Ajouté : ${report.cachets} cachet(s), ${report.employeurs} employeur(s), ${report.contacts} contact(s), ${report.castings} casting(s), ${report.textes} texte(s)${report.profil ? ', profil complété' : ''}.` +
        (report.cachetsIgnores || report.contactsIgnores ? `\n${report.cachetsIgnores} cachet(s) et ${report.contactsIgnores} contact(s) déjà présents ont été ignorés (doublons).` : ''), 'success');
      if (mergeRef.current) mergeRef.current.value = '';
    };
    reader.readAsText(file);
  };

  return (
    <Modal title="Réglages" onClose={onClose}>
      <div className="space-y-4">
        <div>
          <div className={cx('text-xs font-semibold mb-2', t.textMuted)}>Aide</div>
          <Btn variant="ghost" className="w-full" onClick={() => setShowGuide(true)}><Icon name="help" size={16} />Comment ça marche ?</Btn>
        </div>
        <div>
          <div className={cx('text-xs font-semibold mb-2', t.textMuted)}>Profil</div>
          <Btn variant="ghost" className="w-full" onClick={onGoToProfil}><Icon name="user" size={16} />Modifier mon profil</Btn>
        </div>
        <div>
          <div className={cx('text-xs font-semibold mb-2', t.textMuted)}>Apparence</div>
          <div className="space-y-3">
            <Btn variant="ghost" className="w-full" onClick={toggle}><Icon name={theme === 'sombre' ? 'sun' : 'moon'} size={16} />{theme === 'sombre' ? 'Passer en mode clair' : 'Passer en mode coulisses'}</Btn>
            <div>
              <div className={cx('text-xs mb-1.5', t.textMuted)}>Couleur d'accent</div>
              <div className="flex items-center gap-3">
                {ACCENT_OPTIONS.map(opt => {
                  const selected = (settings.accent || 'teal') === opt.id;
                  return (
                    <button key={opt.id} onClick={() => setAccent(opt.id)} title={opt.label}
                      className={cx('shrink-0 w-11 h-11 rounded-full flex items-center justify-center ring-offset-2 transition',
                        `bg-gradient-to-br from-${opt.id}-500 to-${opt.to}-700`,
                        selected && 'ring-2', selected && `ring-${opt.id}-600`, theme === 'sombre' && 'ring-offset-[#161616]')}>
                      {selected && <Icon name="check" size={18} className="text-white drop-shadow" />}
                    </button>
                  );
                })}
              </div>
            </div>
            <div>
              <div className={cx('text-xs mb-1.5', t.textMuted)}>Taille du texte</div>
              <div className="flex gap-2">
                {[['petit', 'Petit'], ['normal', 'Normal'], ['grand', 'Grand']].map(([id, label]) => (
                  <button key={id} onClick={() => setFontScale(id)}
                    className={cx('flex-1 whitespace-nowrap text-sm px-3 py-2 rounded-full font-medium', (settings.fontScale || 'normal') === id ? t.btnPrimary : cx(t.soft, t.textMuted))}>
                    {label}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
        <div>

}

function ImportProfilModal({ onClose, onApply }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [extracted, setExtracted] = useState('');
  const [structured, setStructured] = useState('');
  const [status, setStatus] = useState('');
  const [promptCopied, setPromptCopied] = useState(false);
  const [forceOverwrite, setForceOverwrite] = useState(false);

  const copyText = async (text) => {
    try { await navigator.clipboard.writeText(text); }
    catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
  };

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setStatus('Lecture du fichier…');
    try {
      if (file.name.toLowerCase().endsWith('.txt')) setExtracted(await file.text());
      else if (file.name.toLowerCase().endsWith('.docx') && window.mammoth) {
        const res = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
        setExtracted(res.value);
      } else if (file.name.toLowerCase().endsWith('.pdf') && window.pdfjsLib) {
        setExtracted(await extractPdfText(file));
      } else {
        setStatus('Format non reconnu — copie le texte de ton CV manuellement.');
        return;
      }
      setStatus('Texte extrait ci-dessous — copie-le pour le coller dans une IA avec le prompt.');
    } catch (err) {
      console.error(err);
      setStatus("Échec de l'extraction — copie le texte de ton CV manuellement.");
    }
  };

  const copyAiPrompt = async () => {
    await copyText(CV_FORMAT_PROMPT);
    setPromptCopied(true);
    setTimeout(() => setPromptCopied(false), 2500);
  };

  const apply = () => {
    const fields = parseCvCanonicalText(structured);
    const patch = cvFieldsToProfilePatch(fields);
    onApply(patch, forceOverwrite);
    onClose();
  };

  return (
    <Modal title="Importer mon profil / CV" onClose={onClose}>
      <div className="space-y-3">
        <div className={cx('rounded-xl p-3 text-xs leading-relaxed', t.soft)}>
          <strong className={t.accent}>1. Importe ton CV (optionnel)</strong> — extrait le texte d'un PDF/DOCX/TXT existant pour le réutiliser à l'étape suivante.
          <div className="mt-2"><input type="file" accept=".txt,.docx,.pdf" onChange={handleFile} className="text-xs" /></div>
          {status && <div className="mt-1.5 opacity-80">{status}</div>}
          {extracted && (
            <div className="mt-2">
              <TextArea rows={4} value={extracted} onChange={(e) => setExtracted(e.target.value)} />
              <Btn variant="ghost" className="mt-1.5" onClick={() => copyText(extracted)}><Icon name="copy" size={14} />Copier ce texte</Btn>
            </div>
          )}
        </div>
        <div className={cx('rounded-xl p-3 text-xs leading-relaxed', t.soft)}>
          <strong className={t.accent}>2. Copie ce prompt</strong> et colle-le dans une IA (ChatGPT, Claude…) suivi de ton CV ou de tes infos en vrac.
          <div className="mt-2"><Btn variant="ghost" onClick={copyAiPrompt}><Icon name={promptCopied ? 'check' : 'copy'} size={14} />{promptCopied ? 'Copié !' : 'Copier le prompt'}</Btn></div>
        </div>
        <Field label="3. Colle ici la réponse structurée de l'IA">
          <TextArea rows={8} value={structured} onChange={(e) => setStructured(e.target.value)} placeholder={"PRENOM: Thomas\nNOM: Maurin\n..."} />
        </Field>
        <label className="flex items-center gap-2 text-xs">
          <input type="checkbox" checked={forceOverwrite} onChange={(e) => setForceOverwrite(e.target.checked)} />
          Remplacer les informations déjà renseignées (sinon, seuls les champs vides sont complétés)
        </label>
        <div className="flex justify-end gap-2 pt-2">
          <Btn variant="ghost" onClick={onClose}>Annuler</Btn>
          <Btn disabled={!structured.trim()} onClick={apply}><Icon name="check" size={16} />Analyser &amp; remplir mon profil</Btn>
        </div>
      </div>
    </Modal>
  );
}

          </div>
        </Field>
      </Card>

      <Card>
        <SectionTitle icon="tag">Mensurations</SectionTitle>
        <div className="grid grid-cols-3 gap-3">
          {[['taille', 'Taille (cm)'], ['poids', 'Poids (kg)'], ['veste', 'Veste'], ['pantalon', 'Pantalon'], ['pointure', 'Pointure'], ['tete', 'Tête'], ['cou', 'Cou'], ['poitrine', 'Poitrine'], ['tourTaille', 'Tour de taille']].map(([k, label]) => (
            <Field key={k} label={label}><TextInput value={p.mensurations[k]} onChange={(e) => setMens({ [k]: e.target.value })} /></Field>
          ))}
        </div>
        <div className="flex gap-4 mt-3">
          <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={p.logistique.permis} onChange={(e) => setLogi({ permis: e.target.checked })} />Permis B</label>
          <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={p.logistique.tatouage} onChange={(e) => setLogi({ tatouage: e.target.checked })} />Tatouage</label>
        </div>
      </Card>

      <Card>
        <SectionTitle icon="book" right={<Btn onClick={addFormation}><Icon name="plus" size={16} />Formation</Btn>}>Formation</SectionTitle>
        {(!p.cvPro.formation || p.cvPro.formation.length === 0) ? <EmptyState icon="book" text="Aucune formation ajoutée pour l'instant." /> : (
          <div className="space-y-2">
            {sortedFormation.map((f, i) => (
              <div key={f.id} style={{ animationDelay: Math.min(i, 10) * 35 + 'ms' }}
                className={cx('listItemIn rounded-xl p-2.5 flex items-center gap-2 border-l-4', `border-${currentAccent}-400`, t.soft)}>
                <div className="flex-1 min-w-0 grid grid-cols-3 gap-2">
                  <TextInput className="col-span-2" value={f.intitule} onChange={(e) => updateFormation(f.id, { intitule: e.target.value })} placeholder="École, stage…" />
                  <TextInput value={f.annee} onChange={(e) => updateFormation(f.id, { annee: e.target.value })} placeholder="Année" />
                </div>
                <ConfirmDeleteButton onConfirm={() => removeFormation(f.id)} />
              </div>
            ))}
          </div>
        )}
      </Card>

      <Card>
        <SectionTitle icon="globe">Langues &amp; compétences</SectionTitle>
        <div className="space-y-3">
          <Field label="Langues"><TextInput value={p.cvPro.langues} onChange={(e) => setCv({ langues: e.target.value })} /></Field>
          <Field label="Compétences (chant, danse, sport, instrument…)"><TextArea rows={6} value={p.cvPro.competences} onChange={(e) => setCv({ competences: e.target.value })} /></Field>
        </div>
      </Card>

      <Card>
        <SectionTitle icon="film" right={<Btn onClick={() => setExpModal({ editingId: null })}><Icon name="plus" size={16} />Expérience</Btn>}>Filmographie</SectionTitle>
        {(!p.cvPro.experiences || p.cvPro.experiences.length === 0) ? <EmptyState icon="film" text="Aucune expérience ajoutée pour l'instant." /> : !groupExperiences ? (
          <div className="space-y-2">
            {sortedExperiences.map((e, i) => (
              <div key={e.id} style={{ animationDelay: Math.min(i, 10) * 35 + 'ms' }}
                className={cx('listItemIn rounded-xl p-3 flex items-start gap-3 border-l-4', `border-${currentAccent}-400`, t.soft)}>
                <div className={cx('w-9 h-9 rounded-full flex items-center justify-center shrink-0', theme === 'sombre' ? `bg-${currentAccent}-500/15 text-${currentAccent}-400` : `bg-${currentAccent}-50 text-${currentAccent}-700`)}>
                  <Icon name={EXPERIENCE_TYPE_ICONS[e.type] || 'tag'} size={16} />
                </div>
                <div className="min-w-0 flex-1 flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className="font-medium" style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{e.titre}</div>
                    <div className={cx('text-xs', t.textMuted)}>{[e.role, e.structure].filter(Boolean).join(', ')}</div>
                    <div className="flex gap-1.5 mt-1.5 flex-wrap"><Pill>{e.type}</Pill>{e.annee && <Pill>{e.annee}</Pill>}</div>
                  </div>
                  <div className="flex gap-0.5 shrink-0">
                    <IconBtn name="edit" onClick={() => setExpModal({ editingId: e.id })} />
                    <ConfirmDeleteButton onConfirm={() => removeExperience(e.id)} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="space-y-1">
            {experiencesByType.map(g => (
              <div key={g.ty}>
                <button className="w-full flex items-center justify-between py-2" onClick={() => setExpandedTypes(s => ({ ...s, [g.ty]: !s[g.ty] }))}>
                  <span className="text-sm font-medium flex items-center gap-1.5"><Icon name={EXPERIENCE_TYPE_ICONS[g.ty] || 'tag'} size={14} className={t.textMuted} />{g.ty} <span className={cx('font-normal', t.textMuted)}>({g.items.length})</span></span>
                  <Icon name={expandedTypes[g.ty] ? 'chevronUp' : 'chevronDown'} size={16} className={t.textMuted} />
                </button>
                {expandedTypes[g.ty] && (
                  <div className="space-y-2 mb-2">
                    {g.items.map((e, i) => (
                      <div key={e.id} style={{ animationDelay: Math.min(i, 10) * 35 + 'ms' }}
                        className={cx('listItemIn rounded-xl p-3 flex items-start justify-between gap-2 border-l-4', `border-${currentAccent}-400`, t.soft)}>
                        <div className="min-w-0">
                          <div className="font-medium" style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{e.titre}</div>
                          <div className={cx('text-xs', t.textMuted)}>{[e.role, e.structure].filter(Boolean).join(', ')}</div>
                          {e.annee && <div className="flex gap-1.5 mt-1.5 flex-wrap"><Pill>{e.annee}</Pill></div>}
                        </div>
                        <div className="flex gap-0.5 shrink-0">
                          <IconBtn name="edit" onClick={() => setExpModal({ editingId: e.id })} />
                          <ConfirmDeleteButton onConfirm={() => removeExperience(e.id)} />
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </Card>

      {expModal && (
        <Modal title={expModal.editingId ? "Modifier l'expérience" : 'Nouvelle expérience'} onClose={() => setExpModal(null)}>
          <ExperienceForm initial={expModal.editingId ? (p.cvPro.experiences || []).find(e => e.id === expModal.editingId) : null} onSave={upsertExperience} onCancel={() => setExpModal(null)} />
        </Modal>
      )}
      {importModal && (
        <ImportProfilModal onClose={() => setImportModal(false)} onApply={applyImportedProfile} />
      )}
      {ficheModal && (
        <Modal title={ficheModal.editingId ? 'Modifier la fiche' : 'Nouvelle fiche spécialisée'} onClose={() => setFicheModal(null)}>
          <FicheForm initial={ficheModal.editingId ? (p.fiches || []).find(f => f.id === ficheModal.editingId) : null} experiences={p.cvPro.experiences || []} onSave={upsertFiche} onCancel={() => setFicheModal(null)} />
        </Modal>
      )}
    </div>
  );
}

/* ================= App racine ================= */

const TABS = [
  { id: 'textes', label: 'Textes', icon: 'book' },
  { id: 'entrainement', label: 'Entraînement', icon: 'dumbbell' },
  { id: 'intermittent', label: 'Intermittent', icon: 'briefcase' },
  { id: 'castings', label: 'Castings', icon: 'film' },
  { id: 'contacts', label: 'Contacts', icon: 'users' },
];

function SearchResultGroup({ label, icon, items, renderLabel, renderSub, renderExtra, onPick, t }) {
  if (!items.length) return null;
  return (
    <div>
      <div className={cx('text-xs font-semibold mb-1.5', t.textMuted)}>{label}</div>
      <div className="space-y-1.5">
        {items.map(item => (
          <div key={item.id} className={cx('flex items-center gap-2 rounded-xl p-2.5', t.soft)}>
            <button onClick={() => onPick(item)} className="flex-1 min-w-0 flex items-center gap-2.5 text-left">
              <span className={cx('shrink-0 w-8 h-8 rounded-full flex items-center justify-center', t.panel, t.accent)}>
                <Icon name={icon} size={15} />
              </span>
              <span className="min-w-0 flex-1">
                <span className="text-sm truncate block">{renderLabel(item)}</span>
                {renderSub && renderSub(item) && <span className={cx('text-xs truncate block', t.textMuted)}>{renderSub(item)}</span>}
              </span>
            </button>
            {renderExtra && <div className="flex gap-1 shrink-0">{renderExtra(item)}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

function SearchModal({ data, onClose, onOpenTexte, onGoToTab }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [q, setQ] = useState('');
  const query = q.trim().toLowerCase();

  // Recherche aussi dans le contenu du texte (répliques), pas seulement le titre —
  // avec un extrait autour de la première occurrence pour retrouver une réplique
  // précise sans avoir à rouvrir chaque texte un par un.
  const snippetFor = (tx) => {
    if (!query) return '';
    const norm = (tx.contenu || '').replace(/\s+/g, ' ').trim();
    const idx = norm.toLowerCase().indexOf(query);
    if (idx === -1) return [tx.auteur, tx.compagnie].filter(Boolean).join(' · ');
    let start = Math.max(0, idx - 25);
    let end = Math.min(norm.length, idx + query.length + 35);
    // Recale sur des espaces pour ne pas couper un mot en plein milieu (ex. un nom de
    // personnage juste avant le passage trouvé).
    if (start > 0) { const sp = norm.indexOf(' ', start); if (sp !== -1 && sp < idx) start = sp + 1; }
    if (end < norm.length) { const sp = norm.lastIndexOf(' ', end); if (sp > idx + query.length) end = sp; }
    return (start > 0 ? '…' : '') + norm.slice(start, end) + (end < norm.length ? '…' : '');
  };
  const textResults = query ? data.textes.filter(tx => (tx.titre + ' ' + (tx.auteur || '') + ' ' + (tx.compagnie || '') + ' ' + (tx.contenu || '')).toLowerCase().includes(query)) : [];
  const contactResults = query ? data.contacts.filter(c => (c.nom + ' ' + (c.fonction || '')).toLowerCase().includes(query)) : [];
  const employeurResults = query ? data.employeurs.filter(e => e.nom.toLowerCase().includes(query)) : [];
  const castingResults = query ? data.castings.filter(c => (c.projet + ' ' + (c.structure || '')).toLowerCase().includes(query)) : [];
  const exerciceResults = query ? data.exercices.filter(ex => ex.titre.toLowerCase().includes(query)) : [];
  const noResults = query && ![textResults, contactResults, employeurResults, castingResults, exerciceResults].some(a => a.length);

  return (
    <Modal title="Rechercher" onClose={onClose}>
      <div className="relative mb-3">
        <Icon name="search" size={16} className={cx('absolute left-3.5 top-3.5', t.textMuted)} />
        <TextInput autoFocus placeholder="Texte, contact, employeur, casting, exercice…" value={q} onChange={(e) => setQ(e.target.value)} className="pl-9" />
      </div>
      {!query && <EmptyState icon="search" text="Tape pour chercher dans tes textes, contacts, employeurs, castings et exercices." />}
      {noResults && <EmptyState icon="search" text="Aucun résultat." />}
      <div className="space-y-3 max-h-96 overflow-y-auto">
        <SearchResultGroup label="Textes" icon="book" items={textResults} renderLabel={(tx) => tx.titre} renderSub={snippetFor} onPick={(tx) => onOpenTexte(tx.id)} t={t} />
        <SearchResultGroup label="Contacts" icon="users" items={contactResults} renderLabel={(c) => c.nom} onPick={() => onGoToTab('contacts')} t={t}
          renderExtra={(c) => (<>
            {c.telephone && <a href={'tel:' + c.telephone.replace(/\s+/g, '')} title="Appeler" className={cx('w-7 h-7 rounded-full flex items-center justify-center', t.panel, t.accent)}><Icon name="phone" size={13} /></a>}
            {c.site && <a href={normalizeUrl(c.site)} target="_blank" rel="noopener noreferrer" title="Site web" className={cx('w-7 h-7 rounded-full flex items-center justify-center', t.panel, t.accent)}><Icon name="globe" size={13} /></a>}
          </>)} />
        <SearchResultGroup label="Employeurs" icon="briefcase" items={employeurResults} renderLabel={(e) => e.nom} onPick={() => onGoToTab('intermittent')} t={t} />
        <SearchResultGroup label="Castings" icon="film" items={castingResults} renderLabel={(c) => c.projet} onPick={() => onGoToTab('castings')} t={t} />
        <SearchResultGroup label="Exercices" icon="dumbbell" items={exerciceResults} renderLabel={(ex) => ex.titre} onPick={() => onGoToTab('entrainement')} t={t} />
      </div>
    </Modal>
  );
}

const HISTORY_LIMIT = 20;

function App() {
  const [data, setDataRaw] = useState(loadData);
  const [history, setHistory] = useState([]);
  const [tab, setTab] = useState('textes');
  const [tabDirection, setTabDirection] = useState('right');
  // Sens de la transition entre onglets, façon appli native : vers la droite si on
  // avance dans l'ordre des onglets, vers la gauche si on revient en arrière — le
  // Profil (hors de TABS, ouvert depuis l'icône en haut) est traité comme "après" le
  // dernier onglet. changeTab() doit être utilisé partout au lieu de setTab() direct
  // pour que ce sens reste correct quel que soit le point d'entrée (barre du bas,
  // recherche globale, "Modifier mon profil" depuis Réglages...).
  const changeTab = (nextTab) => {
    const order = TABS.map(t => t.id);
    const from = order.indexOf(tab) === -1 ? order.length : order.indexOf(tab);
    const to = order.indexOf(nextTab) === -1 ? order.length : order.indexOf(nextTab);
    setTabDirection(to >= from ? 'right' : 'left');
    setTab(nextTab);
  };
  const [showSettings, setShowSettings] = useState(false);
  const [showSearch, setShowSearch] = useState(false);
  const [openTexteId, setOpenTexteId] = useState(null);
  const [lastBackupAt, setLastBackupAt] = useState(getLastBackup);
  const recordBackup = () => { setLastBackup(); setLastBackupAt(new Date()); };

  useEffect(() => { saveData(data); }, [data]);

  // setData passe par ici partout dans l'app (une seule définition, ~30 composants
  // reçoivent ce setData en prop) : chaque vrai changement de contenu est empilé pour
  // pouvoir être annulé — "sauvegarde automatique à chaque action" côté utilisateur.
  const setData = (updater) => {
    setDataRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (hasDataChange(prev, next)) setHistory(h => [...h, prev].slice(-HISTORY_LIMIT));
      return next;
    });
  };
  const undo = () => {
    if (!history.length) return;
    const last = history[history.length - 1];
    setHistory(h => h.slice(0, -1));
    setDataRaw(last);
  };

  const theme = data.settings.theme;
  currentAccent = data.settings.accent || 'teal';
  currentAccentTo = (ACCENT_OPTIONS.find(a => a.id === currentAccent) || ACCENT_OPTIONS[0]).to;
  useEffect(() => {
    const px = { petit: 14, normal: 16, grand: 19 }[data.settings.fontScale] || 16;
    document.documentElement.style.fontSize = px + 'px';
  }, [data.settings.fontScale]);
  const toggle = () => setData(d => ({ ...d, settings: { ...d.settings, theme: d.settings.theme === 'sombre' ? 'clair' : 'sombre' } }));
  const t = themeClasses(theme);

  const activeScreen = [...TABS, { id: 'profil', label: 'Profil', icon: 'user' }].find(s => s.id === tab) || TABS[0];

  // Rappel de sauvegarde : un simple point sur l'icône Réglages, visible depuis
  // n'importe quel onglet (contrairement à l'ancien bandeau, caché dans Intermittent)
  // mais volontairement minuscule pour ne pas encombrer l'appli — il disparaît dès
  // qu'une sauvegarde est faite, pas besoin de le fermer à la main.
  const hasRealData = data.cachets.length > 0 || data.textes.length > 0;
  const joursDepuisSauvegarde = lastBackupAt ? Math.floor((new Date() - lastBackupAt) / 86400000) : null;
  const shouldRemindBackup = hasRealData && (joursDepuisSauvegarde === null || joursDepuisSauvegarde > 30);

  const headerRef = useRef(null);
  const [headerHeight, setHeaderHeight] = useState(0);
  useEffect(() => {
    const el = headerRef.current;
    if (!el) return;
    const measure = () => setHeaderHeight(el.offsetHeight);
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  return (
    <ThemeContext.Provider value={{ theme, toggle }}>
    <UIFeedbackProvider undo={undo}>
    <HeaderHeightContext.Provider value={headerHeight}>
      <div className={cx('min-h-screen', t.bg, t.text)}>
        <header ref={headerRef} className={cx('sticky top-0 z-30 shadow-md text-white', t.headerGrad)}>
          <div className="px-4 pt-3 pb-2 flex items-center justify-between">
            <div className="font-bold text-lg tracking-tight flex items-center gap-2 truncate min-w-0"><Icon name={activeScreen.icon} size={19} className="shrink-0" />{activeScreen.label}</div>
            <div className="flex items-center gap-1.5 shrink-0">
              {history.length > 0 && (
                <button onClick={undo} title="Annuler la dernière action" className="p-1.5 rounded-full bg-white/15 hover:bg-white/25 transition active:scale-90">
                  <Icon name="undo" size={16} />
                </button>
              )}
              <button onClick={() => setShowSearch(true)} title="Rechercher" className="p-1.5 rounded-full bg-white/15 hover:bg-white/25 transition active:scale-90">
                <Icon name="search" size={16} />
              </button>
              <button onClick={toggle} title="Changer de thème" className="p-1.5 rounded-full bg-white/15 hover:bg-white/25 transition active:scale-90">
                <Icon name={theme === 'sombre' ? 'sun' : 'moon'} size={16} />
              </button>
              <button onClick={() => changeTab('profil')} title="Mon profil" className={cx('p-1.5 rounded-full transition active:scale-90', tab === 'profil' ? 'bg-white text-black' : 'bg-white/15 hover:bg-white/25')}>
                <Icon name="user" size={16} />
              </button>
              <button onClick={() => setShowSettings(true)} title={shouldRemindBackup ? 'Réglages — pense à sauvegarder tes données' : 'Réglages'} className="relative p-1.5 rounded-full bg-white/15 hover:bg-white/25 transition active:scale-90">
                <Icon name="settings" size={16} />
                {shouldRemindBackup && <span className="absolute top-0.5 right-0.5 w-2 h-2 rounded-full bg-amber-400 ring-2 ring-white/90" />}
              </button>
            </div>
          </div>
          <div className="px-2 pb-2">
            <SegmentedTabs
              items={TABS.map(tb => ({ key: tb.id, label: tb.label, icon: tb.icon, iconSize: 17 }))}
              activeKey={tab} onChange={(id) => { if (id === 'textes') setOpenTexteId(null); changeTab(id); }} cols={5}
              indicatorClassName={theme === 'sombre' ? 'bg-[#0a0f0d]' : 'bg-white'}
              activeTextClassName={theme === 'sombre' ? `text-${currentAccent}-300` : `text-${currentAccent}-700`}
              inactiveTextClassName="text-white/75"
              labelClassName="text-[9.5px] leading-[11px] font-semibold text-center px-0.5"
            />
          </div>
        </header>

        <main className="max-w-xl mx-auto px-4 pt-3 pb-8">
          <div key={tab} className={tabDirection === 'left' ? 'tabPane-left' : 'tabPane-right'}>
            {tab === 'intermittent' && <Dashboard data={data} setData={setData} />}
            {tab === 'castings' && <CastingsTab data={data} setData={setData} />}
            {tab === 'contacts' && <ContactsTab data={data} setData={setData} />}
            {tab === 'textes' && <TextesTab data={data} setData={setData} openId={openTexteId} setOpenId={setOpenTexteId} />}
            {tab === 'entrainement' && <EntrainementTab data={data} setData={setData} />}
            {tab === 'profil' && <ProfilTab data={data} setData={setData} />}
          </div>
        </main>

        {showSettings && (
          <SettingsModal data={data} settings={data.settings} setData={setData} onClose={() => setShowSettings(false)} onGoToProfil={() => { changeTab('profil'); setShowSettings(false); }} lastBackupAt={lastBackupAt} onBackup={recordBackup} />
        )}
        {showSearch && (
          <SearchModal data={data} onClose={() => setShowSearch(false)}
            onOpenTexte={(id) => { setOpenTexteId(id); changeTab('textes'); setShowSearch(false); }}
            onGoToTab={(id) => { changeTab(id); setShowSearch(false); }} />
        )}
      </div>
    </HeaderHeightContext.Provider>
    </UIFeedbackProvider>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
