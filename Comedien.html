function ContactsTab({ data, setData }) {
  const { theme } = useTheme();
  const { confirm } = useUIFeedback();
  const t = themeClasses(theme);
  const [modal, setModal] = useState(null);
  const [catModal, setCatModal] = useState(false);
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('Toutes');
  const [sortAlpha, setSortAlpha] = useState(true);
  const [importDrafts, setImportDrafts] = useState(null);
  const toggleImportDraft = (i) => setImportDrafts(prev => prev.map((d, idx) => idx === i ? { ...d, selected: !d.selected } : d));
  const confirmImport = () => {
    setData(d => {
      let contacts = d.contacts;
      let categories = d.categories;
      importDrafts.filter(dr => dr.selected).forEach(({ selected, isDuplicate, ...contactFields }) => {
        contacts = [...contacts, { id: uid(), ...contactFields }];
        if (!categories.includes(contactFields.categorie)) categories = [...categories, contactFields.categorie];
      });
      return { ...d, contacts, categories };
    });
    setImportDrafts(null);
  };

  const vcfInputRef = useRef(null);
  const importVcfFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const parsed = parseVCards(text);
    if (parsed.length) {
      const drafts = parsed.map(p => {
        const candidate = { nom: p.nom, telephone: p.telephone, email: p.email, fonction: '', categorie: 'Perso', site: p.site, adresse: '', notes: p.notes };
        const isDuplicate = !!findDuplicateContact(candidate, data.contacts);
        return { ...candidate, selected: !isDuplicate, isDuplicate };
      });
      setImportDrafts(drafts);
    }
    if (vcfInputRef.current) vcfInputRef.current.value = '';
  };
  const exportContactVcf = (c) => downloadVCard((c.nom || 'contact').replace(/[^\w\-]+/g, '_') + '.vcf', contactToVCard(c));

  const categories = useMemo(() => {
    const fromContacts = data.contacts.map(c => c.categorie).filter(Boolean);
    return Array.from(new Set([...data.categories, ...fromContacts]));
  }, [data.contacts, data.categories]);

  const renameCategory = (oldName, newName) => {
    if (!newName || newName === oldName) return;
    setData(d => ({
      ...d,
      categories: Array.from(new Set(d.categories.map(c => c === oldName ? newName : c))),
      contacts: d.contacts.map(c => c.categorie === oldName ? { ...c, categorie: newName } : c),
    }));
    if (catFilter === oldName) setCatFilter(newName);
  };
  const deleteCategory = async (name) => {
    const count = data.contacts.filter(c => c.categorie === name).length;
    const msg = count > 0 ? `${count} contact(s) utilisent "${name}" — ils repasseront en "Perso". Continuer ?` : `Supprimer la catégorie "${name}" ?`;
    if (!(await confirm(msg, { danger: true }))) return;
    setData(d => ({
      ...d,
      categories: d.categories.filter(c => c !== name),
      contacts: d.contacts.map(c => c.categorie === name ? { ...c, categorie: 'Perso' } : c),
    }));
    if (catFilter === name) setCatFilter('Toutes');
  };

  const upsert = (v) => {
    setData(d => {
      const categories = d.categories.includes(v.categorie) ? d.categories : [...d.categories, v.categorie];
      const contacts = modal.editingId ? d.contacts.map(c => c.id === modal.editingId ? { ...c, ...v } : c) : [...d.contacts, { id: uid(), ...v }];
      return { ...d, contacts, categories };
    });
    setModal(null);
  };
  const remove = (id) => setData(d => ({ ...d, contacts: d.contacts.filter(c => c.id !== id) }));
  const toggleFavori = (id) => setData(d => ({ ...d, contacts: d.contacts.map(c => c.id === id ? { ...c, favori: !c.favori } : c) }));

  let filtered = data.contacts.filter(c => {
    const matchSearch = !search || (c.nom + ' ' + c.fonction + ' ' + c.notes).toLowerCase().includes(search.toLowerCase());
    const matchCat = catFilter === 'Toutes' || c.categorie === catFilter;
    return matchSearch && matchCat;
  });
  filtered = filtered.sort((a, b) => {
    if (!!b.favori !== !!a.favori) return b.favori ? 1 : -1;
    return sortAlpha ? a.nom.localeCompare(b.nom) : (a.categorie || '').localeCompare(b.categorie || '');
  });

  return (
    <div className="space-y-3 pb-4">
      <Card>
        <div className="flex gap-2 mb-3">
          <div className="relative flex-1">
            <Icon name="search" size={16} className={cx('absolute left-2.5 top-2.5', t.textMuted)} />
            <TextInput placeholder="Rechercher…" value={search} onChange={(e) => setSearch(e.target.value)} className="pl-8" />
          </div>
          <IconBtn name="filter" title="Trier alphabétique / par catégorie" onClick={() => setSortAlpha(s => !s)} />
          <IconBtn name="settings" title="Gérer les catégories" onClick={() => setCatModal(true)} />
        </div>
        <Select value={catFilter} onChange={(e) => setCatFilter(e.target.value)}>
          <option value="Toutes">Toutes les catégories</option>
          {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
        </Select>
      </Card>

      <Card>
        <SectionTitle icon="users" right={
          <div className="flex gap-1.5 shrink-0">
            <IconBtn name="upload" title="Importer un contact (fichier .vcf)" onClick={() => vcfInputRef.current && vcfInputRef.current.click()} />
            <input ref={vcfInputRef} type="file" accept=".vcf,text/vcard" onChange={importVcfFile} className="hidden" />
            <Btn onClick={() => setModal({ editingId: null })}><Icon name="plus" size={16} />Contact</Btn>
          </div>
        }>Contacts</SectionTitle>
        {filtered.length === 0 ? <EmptyState icon="users" text="Aucun contact ne correspond." /> : (
          <div className="space-y-2">
            {filtered.map((c, i) => {
              // Sens inverse de la synchro déjà en place côté Employeurs : si ce
              // contact correspond (même nom) à un employeur avec des cachets, ça se
              // voit ici aussi — sans avoir à ressaisir ni recouper les deux listes.
              const nbCachetsEmp = data.employeurs.some(e => e.nom.trim().toLowerCase() === c.nom.trim().toLowerCase())
                ? data.cachets.filter(cc => cc.employeur.trim().toLowerCase() === c.nom.trim().toLowerCase()).reduce((s, cc) => s + (Number(cc.heures) > 0 ? 0 : (Number(cc.nbCachets) || 0)), 0) : 0;
              return (
              <div key={c.id} style={{ animationDelay: Math.min(i, 10) * 35 + 'ms' }}
                className={cx('listItemIn rounded-xl p-3 border-l-4', `border-${currentAccent}-400`, t.soft, t.cardHover)}>
                <div className="flex items-start justify-between gap-2">
                  <div className="flex items-start gap-3 min-w-0">
                    <div className={cx('w-9 h-9 rounded-full flex items-center justify-center shrink-0 font-bold text-sm', theme === 'sombre' ? `bg-${currentAccent}-500/20 text-${currentAccent}-300` : `bg-${currentAccent}-100 text-${currentAccent}-700`)}>
                      {(c.nom || '?').trim().charAt(0).toUpperCase()}
                    </div>
                    <div className="min-w-0">
                    <div className="font-medium truncate">{c.nom}</div>
                    {c.fonction && <div className={cx('text-xs', t.textMuted)}>{c.fonction}</div>}
                    {(c.categorie || nbCachetsEmp > 0) && (
                      <div className="flex gap-1.5 mt-1.5 flex-wrap">
                        {c.categorie && <Pill>{c.categorie}</Pill>}
                        {nbCachetsEmp > 0 && <Pill tone="info">{nbCachetsEmp} cachet{nbCachetsEmp > 1 ? 's' : ''}</Pill>}
                      </div>
                    )}
                    {/* Boutons modulaires, priorisés : téléphone/email/GPS sont les actions
                        du quotidien (appeler, écrire, s'y rendre) et gardent leur bouton
                        rond ; le site web, moins urgent, reste accessible mais en simple
                        lien texte ci-dessous plutôt qu'en bouton de même rang. Chaque
                        bouton n'apparaît que si son champ est rempli — pas de bouton vide,
                        les autres prennent naturellement sa place. */}
                    {(c.telephone || c.email || c.adresse) && (
                      <div className="flex gap-1.5 mt-1.5">
                        {c.telephone && <a href={'tel:' + c.telephone.replace(/\s+/g, '')} onClick={(e) => e.stopPropagation()} title="Appeler" className={cx('w-7 h-7 rounded-full flex items-center justify-center shrink-0', t.panel, t.accent)}><Icon name="phone" size={13} /></a>}
                        {c.email && <a href={'mailto:' + c.email} onClick={(e) => e.stopPropagation()} title="Envoyer un e-mail" className={cx('w-7 h-7 rounded-full flex items-center justify-center shrink-0', t.panel, t.accent)}><Icon name="mail" size={13} /></a>}
                        {c.adresse && <a href={'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.adresse)} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} title="Itinéraire" className={cx('w-7 h-7 rounded-full flex items-center justify-center shrink-0', t.panel, t.accent)}><Icon name="pin" size={13} /></a>}
                      </div>
                    )}
                    {c.site && (
                      <a href={normalizeUrl(c.site)} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()}
                        className={cx('flex items-center gap-1 text-xs mt-1.5 max-w-full underline decoration-dotted underline-offset-2', t.textMuted)}>
                        <Icon name="globe" size={11} className="shrink-0" /><span className="truncate min-w-0">{c.site}</span>
                      </a>
                    )}
                    </div>
                  </div>
                  <div className="flex gap-0.5 shrink-0">
                    <IconBtn name={c.favori ? 'starFilled' : 'star'} active={c.favori} pop={c.favori} title={c.favori ? 'Retirer des favoris' : 'Mettre en favori'} onClick={() => toggleFavori(c.id)} />
                    <IconBtn name="edit" onClick={() => setModal({ editingId: c.id })} />
                    <ConfirmDeleteButton onConfirm={() => remove(c.id)} />
                  </div>
                </div>
              </div>
              );
            })}
          </div>
        )}
      </Card>

      {modal && (
        <Modal title={modal.editingId ? 'Modifier le contact' : 'Nouveau contact'} onClose={() => setModal(null)}>
          <ContactForm initial={modal.editingId ? data.contacts.find(c => c.id === modal.editingId) : null} categories={categories} existingContacts={data.contacts} editingId={modal.editingId} onSave={upsert} onCancel={() => setModal(null)} onExport={modal.editingId ? () => exportContactVcf(data.contacts.find(c => c.id === modal.editingId)) : null} />
        </Modal>
      )}
      {catModal && (
        <CategoriesModal categories={categories} contacts={data.contacts} onRename={renameCategory} onDelete={deleteCategory} onClose={() => setCatModal(false)} />
      )}
      {importDrafts && (
        <ImportContactsModal drafts={importDrafts} onToggle={toggleImportDraft} onConfirm={confirmImport} onClose={() => setImportDrafts(null)} />
      )}
    </div>
  );
}

/* ================= Onglet Textes / Répétition ================= */

function MaskableText({ texte, masked, className = '' }) {
  const { theme } = useTheme();
  const [revealed, setRevealed] = useState({});
  useEffect(() => { setRevealed({}); }, [texte, masked]);
  if (!masked) return <span className={className}>{renderTexteAvecDidascalies(texte)}</span>;
  const words = (texte || '').split(/(\s+)/);
  return (
    <span className={className}>
      {words.map((w, i) => /^\s+$/.test(w) ? w : (
        <span key={i} onClick={() => setRevealed(r => ({ ...r, [i]: !r[i] }))}
          className={cx('cursor-pointer rounded px-0.5', revealed[i] ? '' : (theme === 'sombre' ? 'bg-slate-600 text-slate-600' : 'bg-slate-300 text-slate-300'))}>
          {w}
        </span>
      ))}
    </span>
  );
}

function RehearsalPlayer({ blocks: allBlocks, monPersonnages, rate, volume }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  // Les didascalies (indications de jeu autonomes, titres...) ne sont jamais lues à
  // voix haute ni comptées comme une réplique d'un personnage pendant la répétition.
  const blocks = useMemo(() => allBlocks.filter(b => b.personnage !== 'Didascalie'), [allBlocks]);
  const [index, setIndex] = useState(0);
  const [playing, setPlaying] = useState(false);
  const voiceRef = useRef(null);

  useEffect(() => {
    function pick() {
      const voices = window.speechSynthesis.getVoices();
      voiceRef.current = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) || voices[0] || null;
    }
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
    return () => window.speechSynthesis.cancel();
  }, []);

  const current = blocks[index];
  const isMine = current && monPersonnages.includes(current.personnage);
  const finished = index >= blocks.length;

  useEffect(() => {
    if (!playing || !current) return;
    if (isMine) { setPlaying(false); return; }
    if (!current.texte.trim()) { setIndex(i => i + 1); return; }
    const utt = new SpeechSynthesisUtterance(current.texte);
    utt.lang = 'fr-FR';
    if (voiceRef.current) utt.voice = voiceRef.current;
    utt.rate = rate; utt.volume = volume;
    utt.onend = () => setIndex(i => i + 1);
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utt);
    return () => window.speechSynthesis.cancel();
  }, [playing, index, current, isMine, rate, volume]);

  if (!blocks.length) return <EmptyState text="Aucune réplique détectée. Vérifie l'import du texte." />;

  return (
    <div className="space-y-3">
      <div className={cx('rounded-2xl p-4 min-h-[110px] shadow-sm', isMine ? cx(t.soft, 'ring-2', theme === 'sombre' ? `ring-${currentAccent}-400/40` : `ring-${currentAccent}-300`) : t.panel)}>
        {finished ? <div className="text-center font-medium">Fin du texte 🎬</div> : (
          <>
            <div className={cx('text-xs font-bold mb-1 uppercase tracking-wide', isMine ? t.accent : t.textMuted)}>
              {current.personnage}{isMine && ' (toi)'}
              {current.didascalieEntree && <span className="italic font-normal normal-case">{didascalieSeparator(current.didascalieEntree)}{current.didascalieEntree}</span>}
            </div>
            <div className="font-script text-base leading-[1.7]">{renderTexteAvecDidascalies(current.texte)}</div>
          </>
        )}
      </div>
      <div className="flex items-center justify-center gap-3">
        <IconBtn name="arrowLeft" title="Précédent" onClick={() => { window.speechSynthesis.cancel(); setIndex(i => Math.max(0, i - 1)); }} />
        {isMine && !finished ? (
          <Btn onClick={() => setIndex(i => i + 1)}><Icon name="check" size={16} />C'est dit, suivant</Btn>
        ) : (
          <IconBtn name={playing ? 'pause' : 'play'} title={playing ? 'Pause' : 'Lecture'} onClick={() => { if (playing) window.speechSynthesis.cancel(); setPlaying(p => !p); }} className="scale-125" />
        )}
        <IconBtn name="skip" title="Suivant" onClick={() => { window.speechSynthesis.cancel(); setIndex(i => Math.min(blocks.length, i + 1)); }} />
      </div>
      <div className={cx('text-xs text-center', t.textMuted)}>{Math.min(index + 1, blocks.length)} / {blocks.length}</div>
      {!monPersonnages.length && <div className={cx('text-xs text-center', t.textMuted)}>"Tout le texte" — tout est lu à voix haute, sans pause.</div>}
    </div>
  );
}

function Teleprompter({ blocks, fontSize, onToggleHighlight, surlignagePerso, surlignageCouleurs, focusPerso, masked, monPersonnages, fill }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [speed, setSpeed] = useState(60); // pixels / seconde
  const [running, setRunning] = useState(false);
  const scrollRef = useRef(null);
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const speedRef = useRef(speed);
  speedRef.current = speed;

  // requestAnimationFrame + delta de temps réel plutôt qu'un setInterval à pas fixe
  // de 1px : ça découple la vitesse de défilement de la fréquence du minuteur (qui
  // plafonne vite dans un navigateur), donc on peut aller bien plus vite, sans à-coups.
  useEffect(() => {
    if (!running) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current != null && scrollRef.current) {
        const dt = (ts - lastTsRef.current) / 1000;
        scrollRef.current.scrollTop += speedRef.current * dt;
      }
      lastTsRef.current = ts;
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); lastTsRef.current = null; };
  }, [running]);

  return (
    <div className={fill ? 'flex flex-col gap-3 h-full' : 'space-y-3'}>
      <div className="flex items-center gap-3 shrink-0">
        <Btn onClick={() => setRunning(r => !r)}><Icon name={running ? 'pause' : 'play'} size={16} />{running ? 'Stop' : 'Défiler'}</Btn>
        <Field label={'Vitesse (' + speed + ' px/s)'} className="flex-1">
          <input type="range" min="10" max="500" step="10" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="w-full" />
        </Field>
      </div>
      <div ref={scrollRef} className={cx('rounded-2xl p-4 overflow-y-auto shadow-sm', fill ? 'flex-1 min-h-0' : 'h-[32rem]', t.panel)} style={{ fontSize: fontSize + 'px' }}>
        {blocks.map(b => <ScriptLine key={b.id} b={b} t={t} theme={theme} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePerso} surlignageCouleurs={surlignageCouleurs} focusPerso={focusPerso} masked={masked} monPersonnages={monPersonnages} compact={fill} />)}
      </div>
    </div>
  );
}

// Format "script" classique du théâtre français : nom du personnage centré en
// capitales au-dessus de la réplique, texte en continu (pas de bulle de chat) —
// remplace l'ancien style "carte" par bloc, qui ressemblait à une messagerie.
function ScriptLine({ b, t, theme, showNote, onNoteChange, onToggleHighlight, surlignagePerso, surlignageCouleurs, focusPerso, masked, monPersonnages, compact }) {
  const isDidascalie = b.personnage === 'Didascalie';
  if (isDidascalie) {
    return (
      <div className={cx('flex items-center gap-3', compact ? 'my-2' : 'my-5', t.textMuted)}>
        <div className={cx('flex-1 h-px', t.panelBorder, 'border-t')} />
        <div className="font-script text-xs italic tracking-wide text-center shrink-0 max-w-[80%]">{b.texte}</div>
        <div className={cx('flex-1 h-px', t.panelBorder, 'border-t')} />
      </div>
    );
  }
  const surlignageList = Array.isArray(surlignagePerso) ? surlignagePerso : (surlignagePerso ? [surlignagePerso] : []);
  const isCharHighlighted = surlignageList.includes(b.personnage);
  const focusList = Array.isArray(focusPerso) ? focusPerso : (focusPerso ? [focusPerso] : []);
  const isDimmed = focusList.length > 0 && !focusList.includes(b.personnage) && !isCharHighlighted;
  const wrapStyle = isCharHighlighted ? { backgroundColor: highlightColorBg((surlignageCouleurs || {})[b.personnage]) } : undefined;
  const textStyle = isCharHighlighted ? { color: HIGHLIGHT_TEXT_COLOR } : undefined;
  return (
    <div id={'sl-' + b.id} className={cx(compact ? 'my-2' : 'my-5', 'py-1.5 px-2.5 -mx-2.5 rounded-xl transition-all', b.highlighted && 'border-l-4 border-amber-400 pl-3.5', b.highlighted && !isCharHighlighted && 'bg-amber-400/15', isCharHighlighted && 'shadow-sm', isDimmed && 'opacity-60 hover:opacity-100')} style={wrapStyle}>
      <div className="flex items-center justify-center gap-1.5">
        <div className={cx('text-center font-bold uppercase tracking-wide text-[13px]', !isCharHighlighted && t.text)} style={textStyle}>
          {b.personnage}
          {b.didascalieEntree && <span className="font-script italic font-normal normal-case tracking-normal" style={textStyle}>{didascalieSeparator(b.didascalieEntree)}{b.didascalieEntree}</span>}
        </div>
        {onToggleHighlight && (
          <button onClick={() => onToggleHighlight(b.id)} title="Marquer cette réplique" className={cx('shrink-0', b.highlighted ? 'text-amber-600' : (!isCharHighlighted && t.textMuted))} style={isCharHighlighted && !b.highlighted ? { color: HIGHLIGHT_TEXT_COLOR, opacity: 0.6 } : undefined}>
            <Icon name="tag" size={14} />
          </button>
        )}
      </div>
      <div className={cx('font-script', compact ? 'leading-normal mt-0.5' : 'leading-[1.7] mt-1.5')} style={textStyle}>
        <MaskableText texte={b.texte} masked={masked && !!monPersonnages && monPersonnages.includes(b.personnage)} />
      </div>
      {showNote && (
        <div className="flex justify-center mt-2.5">
          <div className={cx('flex items-center gap-1.5 rounded-full px-3 py-1 max-w-full', b.note ? 'bg-amber-400/15' : cx('border border-dashed', t.panelBorder))}>
            <Icon name="edit" size={11} className={b.note ? 'text-amber-600 shrink-0' : cx(t.textMuted, 'shrink-0')} />
            <input value={b.note || ''} onChange={(e) => onNoteChange(b.id, e.target.value)} placeholder="note de régie"
              size={b.note ? Math.min(b.note.length, 60) : 11}
              className={cx('text-xs italic bg-transparent border-0 outline-none text-center min-w-0', b.note ? 'text-amber-700' : t.textMuted, theme === 'sombre' && b.note && '!text-amber-300')} />
          </div>
        </div>
      )}
    </div>
  );
}

function IsolatedView({ blocks, monPersonnages, fontSize, masked, showNotes, onNoteChange }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  if (!monPersonnages.length) return <EmptyState text={'Choisis un ou plusieurs personnages dans "Mon personnage" ci-dessus pour isoler leurs répliques (avec "Tout le texte", regarde plutôt l\'onglet "Texte").'} />;
  const mine = blocks.filter(b => monPersonnages.includes(b.personnage));
  if (!mine.length) return <EmptyState text="Aucune réplique trouvée pour ce(s) personnage(s) — vérifie l'onglet Corriger." />;
  return (
    <div className="space-y-2" style={{ fontSize: fontSize + 'px' }}>
      <div className={cx('text-xs mb-1', t.textMuted)} style={{ fontSize: 12 }}>{mine.length} réplique(s) isolée(s) pour <strong className={t.accent}>{monPersonnages.join(', ')}</strong>, dans l'ordre du texte.</div>
      {mine.map((b, i) => (
        <div key={b.id} className={cx('rounded-xl p-3', t.soft)}>
          <div className={cx('font-bold mb-1 flex items-center gap-1.5', t.accent)} style={{ fontSize: 11 }}>
            Réplique {i + 1}
            {monPersonnages.length > 1 && <span className={cx('normal-case font-medium', t.textMuted)}>· {b.personnage}</span>}
          </div>
          <div className="font-script leading-[1.7]"><MaskableText texte={b.texte} masked={masked} /></div>
          {showNotes && (
            <input value={b.note || ''} onChange={(e) => onNoteChange(b.id, e.target.value)} placeholder="+ note de régie"
              className={cx('mt-2 w-full italic bg-transparent border-0 border-b outline-none pb-1', t.panelBorder, t.textMuted)} style={{ fontSize: 12 }} />
          )}
        </div>
      ))}
    </div>
  );
}

function TexteCompletView({ blocks, fontSize, showNotes, onNoteChange, onToggleHighlight, surlignagePerso, surlignageCouleurs, focusPerso, masked, monPersonnages }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (
    <div style={{ fontSize: fontSize + 'px' }}>
      {blocks.map(b => <ScriptLine key={b.id} b={b} t={t} theme={theme} showNote={showNotes} onNoteChange={onNoteChange} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePerso} surlignageCouleurs={surlignageCouleurs} focusPerso={focusPerso} masked={masked} monPersonnages={monPersonnages} />)}
    </div>
  );
}

function SceneTimer() {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [ms, setMs] = useState(0);
  const [running, setRunning] = useState(false);
  useEffect(() => {
    if (!running) return;
    const start = Date.now() - ms;
    const id = setInterval(() => setMs(Date.now() - start), 250);
    return () => clearInterval(id);
  }, [running]);
  const totalSec = Math.floor(ms / 1000);
  const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
  const ss = String(totalSec % 60).padStart(2, '0');
  return (
    <div className="flex items-center gap-3">
      <div className={cx('text-2xl font-mono font-bold tabular-nums', t.accent)}>{mm}:{ss}</div>
      <Btn variant={running ? 'danger' : 'primary'} onClick={() => setRunning(r => !r)}>{running ? 'Pause' : 'Démarrer'}</Btn>
      <Btn variant="ghost" onClick={() => { setRunning(false); setMs(0); }}>Reset</Btn>
    </div>
  );
}

// Plein écran en overlay CSS (position fixed) plutôt que l'API Fullscreen native :
// sur mobile (surtout iOS Safari) requestFullscreen() sur un élément quelconque
// ne fonctionne pas ou pas de façon fiable — un overlay maison marche partout et
// garantit un bouton de fermeture toujours visible et accessible d'un tap.
function FullscreenReader({ mode, texte, monPersonnages, fontSize, setFontSize, masked, setMasked, onNoteChange, onToggleHighlight, surlignagePerso, surlignageCouleurs, focusPerso, onClose }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [closing, setClosing] = useState(false);
  const handleClose = () => { setClosing(true); setTimeout(onClose, 180); };
  return (
    <div className={cx('fixed inset-0 z-50 overflow-y-auto !mt-0', closing ? 'overlayOut' : 'overlayIn', t.bg)}>
      <div className={cx('sticky top-0 z-10 flex items-center gap-2 px-3 py-2.5 shadow-sm', t.panel)}>
        <input type="range" min="14" max="32" value={fontSize} onChange={(e) => setFontSize(Number(e.target.value))} className="w-20 shrink-0" />
        {mode !== 'original' && (
          <button onClick={() => setMasked(m => !m)} className={cx('text-xs px-2.5 py-1.5 rounded-full font-medium shrink-0 whitespace-nowrap', masked ? t.btnPrimary : cx(t.soft, t.textMuted))}>Cache-mot</button>
        )}
        <div className="flex-1" />
        <button onClick={handleClose} title="Fermer le plein écran" className={cx('p-2.5 rounded-full shrink-0', t.soft)}><Icon name="x" size={20} /></button>
      </div>
      <div className="max-w-xl mx-auto px-4 py-4">
        {mode === 'isoler' && <IsolatedView blocks={texte.blocks} monPersonnages={monPersonnages} fontSize={fontSize} masked={masked} showNotes={true} onNoteChange={onNoteChange} />}
        {mode === 'complet' && <TexteCompletView blocks={texte.blocks} fontSize={fontSize} showNotes={true} onNoteChange={onNoteChange} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePerso} surlignageCouleurs={surlignageCouleurs} focusPerso={focusPerso} masked={masked} monPersonnages={monPersonnages} />}
        {mode === 'prompteur' && <Teleprompter blocks={texte.blocks} fontSize={fontSize} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePerso} surlignageCouleurs={surlignageCouleurs} focusPerso={focusPerso} masked={masked} monPersonnages={monPersonnages} />}
        {mode === 'original' && <div className="whitespace-pre-wrap leading-relaxed" style={{ fontSize: fontSize + 'px' }}>{texte.original}</div>}
      </div>
    </div>
  );
}

// Sélecteur de personnages réutilisé partout où on en coche un ou plusieurs (Mon
// personnage, Focus, Surligner, dans les deux plein écrans) : chips côte à côte quand
// la distribution est courte, sinon liste verticale compacte et scrollable — au-delà de
// 6 personnages les chips s'enroulaient sur de nombreuses lignes et prenaient beaucoup
// trop de place à l'écran.
function PersonnageChips({ personnages, selected, onToggle, allLabel, onSelectAll, allSelected }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  // Repliée par défaut au-delà de 6 personnages : une longue distribution en liste
  // dépliée prenait toujours une bonne partie de l'écran même en version compacte.
  // Un simple résumé + chevron, comme partout ailleurs dans l'appli, ne montre la
  // liste que quand on en a besoin.
  const [expanded, setExpanded] = useState(false);
  if (personnages.length <= 6) {
    return (
      <div className="flex flex-wrap gap-1.5">
        {allLabel && (
          <button onClick={onSelectAll}
            className={cx('shrink-0 whitespace-nowrap text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1', allSelected ? t.btnPrimary : cx(t.soft, t.textMuted))}>
            <Icon name="book" size={12} />{allLabel}
          </button>
        )}
        {personnages.map(p => {
          const checked = selected.includes(p);
          return (
            <button key={p} onClick={() => onToggle(p)}
              className={cx('flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full font-medium', checked ? t.btnPrimary : cx(t.soft, t.textMuted))}>
              {checked && <Icon name="check" size={12} />}{p}
            </button>
          );
        })}
      </div>
    );
  }
  const summary = allLabel && allSelected ? allLabel
    : selected.length === 0 ? 'Aucun personnage'
    : selected.length === 1 ? selected[0]
    : `${selected.length} personnages`;
  const divideColor = t.panelBorder.replace('border-', 'divide-');
  const Row = ({ checked, onClick, label, icon }) => (
    <button onClick={onClick}
      className={cx('w-full flex items-center gap-2 text-xs px-3 py-2 font-medium text-left border-l-4', checked ? cx(t.soft, t.accent, `border-${currentAccent}-400`) : cx('border-transparent', t.textMuted))}>
      {icon}<span className="truncate flex-1 min-w-0">{label}</span>{checked && <Icon name="check" size={12} className="shrink-0" />}
    </button>
  );
  return (
    <div className={cx('rounded-xl border', t.panelBorder)}>
      <button onClick={() => setExpanded(e => !e)} className="w-full flex items-center gap-2 px-3 py-2">
        <span className={cx('text-xs font-medium truncate flex-1 min-w-0 text-left', t.text)}>{summary}</span>
        <Icon name={expanded ? 'chevronUp' : 'chevronDown'} size={14} className={cx('shrink-0', t.textMuted)} />
      </button>
      {expanded && (
        <div className={cx('overflow-y-auto max-h-56 divide-y border-t', t.panelBorder, divideColor)}>
          {allLabel && <Row checked={!!allSelected} onClick={onSelectAll} label={allLabel} icon={<Icon name="book" size={12} className="shrink-0" />} />}
          {personnages.map(p => <Row key={p} checked={selected.includes(p)} onClick={() => onToggle(p)} label={p} />)}
        </div>
      )}
    </div>
  );
}

// Deuxième mode plein écran, distinct du premier (qui ne fait qu'agrandir le texte) :
// tente le vrai plein écran système du navigateur (masque barre d'adresse / barre de
// statut du tel) en plus de l'overlay CSS — et une barre du haut réduite à des icônes
// seules (fermer, prompteur, focus, surligner), toujours visible, pensée pour jouer une
// scène sans être distrait par du texte de bouton. Sur les navigateurs qui bloquent
// requestFullscreen (iOS Safari, webview...), l'overlay reste utilisable tel quel.
function TrueFullscreenReader({ texte, monPersonnages, focusPersonnages, onToggleFocusPersonnage, surlignagePersonnages, onToggleSurlignagePersonnage, surlignageCouleurs, onChangeSurlignageCouleur, onToggleHighlight, personnages, onClose }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [innerMode, setInnerMode] = useState('complet');
  const [showFocusPanel, setShowFocusPanel] = useState(false);
  const [showHighlightPanel, setShowHighlightPanel] = useState(false);
  const [closing, setClosing] = useState(false);
  const handleClose = () => { setClosing(true); setTimeout(onClose, 180); };
  const rootRef = useRef(null);

  useEffect(() => {
    const el = rootRef.current;
    const req = el && (el.requestFullscreen || el.webkitRequestFullscreen);
    // La promesse peut être rejetée de façon asynchrone (permission refusée par le
    // navigateur/contexte, ex. iframe sans "allow=fullscreen") — le .catch() est
    // nécessaire en plus du try/catch, sinon ça reste une erreur non gérée. Dans tous
    // les cas l'overlay CSS ci-dessous couvre déjà tout l'écran, donc rien ne bloque.
    if (req) { try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    return () => {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if ((document.fullscreenElement || document.webkitFullscreenElement) && exit) { try { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    };
  }, []);

  return (
    <div ref={rootRef} className={cx('fixed inset-0 z-50 overflow-y-auto !mt-0', closing ? 'overlayOut' : 'overlayIn', t.bg)}>
      <div className={cx('sticky top-0 z-10 flex items-center justify-center gap-2 px-3 py-2.5 shadow-sm', t.panel)}>
        <IconBtn name="x" title="Fermer le plein écran" onClick={handleClose} />
        <div className="w-px h-6 shrink-0 opacity-20 bg-current" />
        <IconBtn name="film" title={innerMode === 'prompteur' ? 'Arrêter le défilement auto' : 'Prompteur (défilement auto)'} active={innerMode === 'prompteur'} onClick={() => setInnerMode(m => m === 'prompteur' ? 'complet' : 'prompteur')} />
        <IconBtn name="eye" title="Focus (adoucir les autres personnages)" active={showFocusPanel} onClick={() => { setShowHighlightPanel(false); setShowFocusPanel(s => !s); }} />
        <IconBtn name="highlighter" title="Surligner un ou plusieurs personnages" active={showHighlightPanel} onClick={() => { setShowFocusPanel(false); setShowHighlightPanel(s => !s); }} />
      </div>
      {showFocusPanel && (
        <div className={cx('mx-3 mt-2 p-3 rounded-2xl shadow-sm', t.panel)}>
          <PersonnageChips personnages={personnages} selected={focusPersonnages} onToggle={onToggleFocusPersonnage} />
        </div>
      )}
      {showHighlightPanel && (
        <div className={cx('mx-3 mt-2 p-3 rounded-2xl shadow-sm', t.panel)}>
          <PersonnageChips personnages={personnages} selected={surlignagePersonnages} onToggle={onToggleSurlignagePersonnage} />
          {surlignagePersonnages.length > 0 && (
            <div className="space-y-1.5 mt-2">
              {surlignagePersonnages.map(p => {
                const couleur = (surlignageCouleurs || {})[p] || 'jaune';
                return (
                  <div key={p} className="flex items-center gap-2 flex-wrap">
                    <span className={cx('text-xs font-medium truncate shrink-0 max-w-[30%]', t.textMuted)}>{p}</span>
                    {HIGHLIGHT_COLORS.map(c => (
                      <button key={c.key} title={c.label} onClick={() => onChangeSurlignageCouleur(p, c.key)}
                        className={cx('w-6 h-6 rounded-full shrink-0 flex items-center justify-center', couleur === c.key && 'ring-2 ring-offset-1', theme === 'sombre' && 'ring-offset-slate-900')}
                        style={{ backgroundColor: c.bg }}>
                        {couleur === c.key && <Icon name="check" size={11} className="text-slate-800" />}
                      </button>
                    ))}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
      <div className="max-w-xl mx-auto px-4 py-4">
        {innerMode === 'complet' && <TexteCompletView blocks={texte.blocks} fontSize={22} showNotes={false} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePersonnages} surlignageCouleurs={surlignageCouleurs} focusPerso={focusPersonnages} monPersonnages={monPersonnages} />}
        {innerMode === 'prompteur' && <Teleprompter blocks={texte.blocks} fontSize={22} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePersonnages} surlignageCouleurs={surlignageCouleurs} focusPerso={focusPersonnages} monPersonnages={monPersonnages} />}
      </div>
    </div>
  );
}

// Self-tape : caméra + prompteur superposés, pour s'enregistrer en castings sans un
// deuxième appareil ni jongler entre deux applis. Le flux caméra tourne en direct dans
// un <video>, le prompteur (défilement auto réutilisé tel quel) flotte par-dessus dans
// un bandeau redimensionnable (normal/grand/très grand) pour voir plus ou moins de soi à
// l'écran pendant l'enregistrement. MediaRecorder produit un fichier vidéo téléchargeable
// directement, sans jamais quitter la page ni rien envoyer nulle part (tout reste local).
function SelfTapeReader({ texte, monPersonnages, focusPersonnages, surlignagePersonnages, surlignageCouleurs, masked, onClose }) {
  // Fermeture avec un court fondu (voir la classe .overlayOut) au lieu de démonter
  // l'écran d'un coup sec — le vrai onClose n'arrive qu'une fois le fondu terminé.
  const [closing, setClosing] = useState(false);
  const handleClose = () => { setClosing(true); setTimeout(onClose, 180); };
  const [facingMode, setFacingMode] = useState('user');
  const [cameraError, setCameraError] = useState('');
  const [recording, setRecording] = useState(false);
  const [recordedUrl, setRecordedUrl] = useState(null);
  const [recordedMime, setRecordedMime] = useState('');
  const [elapsed, setElapsed] = useState(0);
  const [promptSize, setPromptSize] = useState('normal');
  const [fontSize, setFontSize] = useState(20);
  // Décompte 3-2-1 avant que l'enregistrement démarre vraiment : le temps de se mettre
  // en place et de composer son regard, comme sur les vraies applis de self-tape.
  const [countdown, setCountdown] = useState(null);
  const countdownTimerRef = useRef(null);
  const liveVideoRef = useRef(null);
  const streamRef = useRef(null);
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const timerRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    setCameraError('');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setCameraError("Ton navigateur ne permet pas d'accéder à la caméra ici.");
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facingMode } }, audio: true }).then(stream => {
      if (cancelled) { stream.getTracks().forEach(tr => tr.stop()); return; }
      streamRef.current = stream;
      if (liveVideoRef.current) { liveVideoRef.current.srcObject = stream; liveVideoRef.current.play().catch(() => {}); }
    }).catch(() => {
      setCameraError("Impossible d'accéder à la caméra — vérifie que tu as autorisé l'accès dans ton navigateur ou ton téléphone.");
    });
    return () => {
      cancelled = true;
      if (streamRef.current) { streamRef.current.getTracks().forEach(tr => tr.stop()); streamRef.current = null; }
    };
  }, [facingMode]);

  // Le flux caméra tourne déjà en arrière-plan pendant l'aperçu de la vidéo enregistrée
  // (pas besoin de le redemander) — on le rattache au <video> live au retour sur "Refaire".
  useEffect(() => {
    if (!recordedUrl && liveVideoRef.current && streamRef.current) {
      liveVideoRef.current.srcObject = streamRef.current;
      liveVideoRef.current.play().catch(() => {});
    }
  }, [recordedUrl]);

  useEffect(() => () => {
    if (timerRef.current) clearInterval(timerRef.current);
    if (countdownTimerRef.current) clearTimeout(countdownTimerRef.current);
    if (recordedUrl) URL.revokeObjectURL(recordedUrl);
  }, []);

  // Le décompte s'auto-enchaîne via un setTimeout par palier plutôt qu'un setInterval :
  // plus simple à annuler proprement (un seul timer à la fois) si l'utilisateur revient
  // en arrière avant la fin.
  useEffect(() => {
    if (countdown === null) return;
    if (countdown === 0) { setCountdown(null); startRecording(); return; }
    countdownTimerRef.current = setTimeout(() => setCountdown(c => c - 1), 1000);
    return () => clearTimeout(countdownTimerRef.current);
  }, [countdown]);

  const beginCountdown = () => { if (streamRef.current && !cameraError) setCountdown(3); };
  const cancelCountdown = () => setCountdown(null);

  const startRecording = () => {
    if (!streamRef.current) return;
    if (!window.MediaRecorder) {
      setCameraError("L'enregistrement vidéo n'est pas pris en charge par ce navigateur — utilise l'appareil photo natif de ton téléphone en gardant ce prompteur affiché à côté.");
      return;
    }
    // mp4 en premier : format le plus universellement accepté par les castings — géré
    // nativement par Safari/iOS. Android/Chrome ne sait de toute façon enregistrer qu'en
    // webm, donc l'ordre ne change rien pour eux, seulement pour les navigateurs qui
    // savent faire les deux.
    const candidates = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const mime = candidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || 'video/webm';
    try {
      const rec = new MediaRecorder(streamRef.current, { mimeType: mime });
      setRecordedMime(mime);
      chunksRef.current = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunksRef.current.push(e.data); };
      rec.onstop = () => setRecordedUrl(URL.createObjectURL(new Blob(chunksRef.current, { type: mime })));
      rec.start();
      mediaRecorderRef.current = rec;
      setRecording(true);
      setElapsed(0);
      timerRef.current = setInterval(() => setElapsed(e => e + 1), 1000);
    } catch (e) {
      setCameraError("Impossible de démarrer l'enregistrement.");
    }
  };
  const stopRecording = () => {
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') mediaRecorderRef.current.stop();
    setRecording(false);
    if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
  };
  const retake = () => {
    if (recordedUrl) URL.revokeObjectURL(recordedUrl);
    setRecordedUrl(null);
    setElapsed(0);
  };

  const fmtElapsed = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  // "Normal" reste modeste pour garder le plus de place possible à la caméra (l'idée du
  // self-tape reste de bien voir sa tête) ; "Grand" et "Très grand" pour les répliques
  // longues. L'ancien "Réduit" (à peine une ligne visible) ne servait à rien — retiré
  // au profit d'un palier plus grand plutôt que plus petit.
  const promptHeightClass = promptSize === 'xlarge' ? 'h-96' : promptSize === 'large' ? 'h-64' : 'h-36';

  return (
    <div className={cx('fixed inset-0 z-50 bg-black flex flex-col !mt-0', closing ? 'overlayOut' : 'overlayIn')}>
      {/* Barre du haut TOUJOURS visible, indépendante de la taille du prompteur et de la
          caméra en dessous — sinon un prompteur en "Grand"/"Très grand" pouvait repousser
          le bouton fermer hors de portée sur un petit écran. */}
      <div className="shrink-0 flex items-center justify-between px-3 py-2 bg-black">
        <button onClick={handleClose} title="Fermer" className="w-9 h-9 rounded-full bg-white/15 text-white flex items-center justify-center"><Icon name="x" size={18} /></button>
        <div className="flex items-center gap-2">
          {recording && (
            <span className="flex items-center gap-1.5 text-xs font-semibold text-white bg-red-600/90 rounded-full px-2.5 py-1">
              <span className="w-2 h-2 rounded-full bg-white animate-pulse" />{fmtElapsed(elapsed)}
            </span>
          )}
          {!recordedUrl && (
            <button onClick={() => setFacingMode(m => m === 'user' ? 'environment' : 'user')} title="Changer de caméra" className="w-9 h-9 rounded-full bg-white/15 text-white flex items-center justify-center"><Icon name="camera" size={16} /></button>
          )}
        </div>
      </div>

      {/* Prompteur juste sous la barre du haut (caméra frontale en haut de l'appareil
          sur la plupart des téléphones/laptops) : le regard reste proche de l'objectif
          au lieu de plonger vers le bas de l'écran pour lire, comme sur un vrai prompteur. */}
      <div className="shrink-0 bg-black px-3 pb-2">
        <div className="flex items-center gap-1.5 mb-2 flex-wrap">
          {[['normal', 'Normal'], ['large', 'Grand'], ['xlarge', 'Très grand']].map(([key, label]) => (
            <button key={key} onClick={() => setPromptSize(key)}
              className={cx('text-xs px-2.5 py-1 rounded-full font-semibold', promptSize === key ? `bg-${currentAccent}-400 text-black` : 'bg-white/15 text-white')}>{label}</button>
          ))}
          <button onClick={() => setFontSize(f => Math.max(14, f - 2))} className="w-6 h-6 rounded-full bg-white/15 text-white text-xs font-bold flex items-center justify-center shrink-0">A-</button>
          <button onClick={() => setFontSize(f => Math.min(32, f + 2))} className="w-6 h-6 rounded-full bg-white/15 text-white text-xs font-bold flex items-center justify-center shrink-0">A+</button>
        </div>
        <div className={cx('rounded-xl overflow-hidden bg-white transition-all', promptHeightClass)}>
          <Teleprompter blocks={texte.blocks} fontSize={fontSize} surlignagePerso={surlignagePersonnages} surlignageCouleurs={surlignageCouleurs} focusPerso={focusPersonnages} masked={masked} monPersonnages={monPersonnages} fill />
        </div>
      </div>

      <div className="relative flex-1 min-h-0 bg-black border-y border-white/10">
        <video ref={liveVideoRef} muted playsInline autoPlay className={cx('w-full h-full object-cover', recordedUrl && 'hidden')} />
        {recordedUrl && <video src={recordedUrl} controls playsInline className="w-full h-full object-contain bg-black" />}
        {countdown > 0 && (
          <div className="absolute inset-0 flex items-center justify-center bg-black/30">
            <span key={countdown} className="text-white font-bold text-8xl drop-shadow-lg countdownPulse">{countdown}</span>
          </div>
        )}
        {cameraError && (
          <div className="absolute inset-0 flex items-center justify-center p-6">
            <div className="bg-black/80 text-white text-sm rounded-2xl p-4 max-w-xs text-center leading-relaxed">{cameraError}</div>
          </div>
        )}
      </div>

      <div className="shrink-0 bg-black px-3 py-3">
        <div className="flex items-center justify-center">
          {countdown > 0 ? (
            <button onClick={cancelCountdown} className="flex items-center gap-2 text-sm font-semibold px-5 py-2.5 rounded-full bg-white/15 text-white">
              <Icon name="x" size={16} />Annuler
            </button>
          ) : !recordedUrl ? (
            <button onClick={recording ? stopRecording : beginCountdown} disabled={!!cameraError}
              className={cx('flex items-center gap-2 text-sm font-semibold px-5 py-2.5 rounded-full', recording ? 'bg-white text-red-600' : 'bg-red-600 text-white', cameraError && 'opacity-40 pointer-events-none')}>
              <span className={cx('w-3 h-3', recording ? 'bg-red-600 rounded-sm' : 'bg-white rounded-full')} />{recording ? 'Arrêter' : 'Enregistrer'}
            </button>
          ) : (
            <div className="flex items-center gap-2">
              <button onClick={retake} className="text-xs font-medium px-3 py-2.5 rounded-full bg-white/15 text-white flex items-center gap-1"><Icon name="undo" size={13} />Refaire</button>
              <a href={recordedUrl} download={(texte.titre || 'self-tape').replace(/[^\w\-]+/g, '_') + (recordedMime.includes('mp4') ? '.mp4' : '.webm')} className="text-xs font-semibold px-3 py-2.5 rounded-full bg-white text-black flex items-center gap-1"><Icon name="download" size={13} />Télécharger</a>
            </div>
          )}
        </div>
        {/* Note discrète, seulement quand le format n'est pas déjà le plus universel :
            Android/Chrome ne sait enregistrer qu'en .webm, que certains sites de casting
            n'acceptent pas — autant prévenir plutôt que laisser découvrir le refus après coup. */}
        {recordedUrl && !recordedMime.includes('mp4') && (
          <div className="text-center text-[11px] text-white/50 mt-2">Format .webm — si un casting demande du .mp4, une conversion peut être nécessaire.</div>
        )}
      </div>
    </div>
  );
}

function TexteDetail({ texte, dossiers, onUpdate, rate, volume, onRateChange, onVolumeChange }) {
  const { theme } = useTheme();
  const { confirm } = useUIFeedback();
  const t = themeClasses(theme);
  const [mode, setMode] = useState('isoler');
  const [fontSize, setFontSize] = useState(18);
  const [masked, setMasked] = useState(false);
  const [showTimer, setShowTimer] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const [showCast, setShowCast] = useState(false);
  const [showHighlightPanel, setShowHighlightPanel] = useState(false);
  const [showFocusPanel, setShowFocusPanel] = useState(false);
  const [newDossier, setNewDossier] = useState('');
  const [mergeFrom, setMergeFrom] = useState('');
  const [mergeTo, setMergeTo] = useState('');
  const [fullscreen, setFullscreen] = useState(false);
  const [trueFullscreen, setTrueFullscreen] = useState(false);
  const [selfTape, setSelfTape] = useState(false);
  const headerHeight = useContext(HeaderHeightContext);
  const personnages = useMemo(() => Array.from(new Set(texte.blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie'), [texte.blocks]);
  const lecture = useMemo(() => estimerLecture(texte.blocks), [texte.blocks]);
  // Tableaux (pas une seule chaîne) : permettent de suivre plusieurs personnages à la
  // fois, ex. quand la même personne joue deux rôles ("Le Père" et "Le Messager").
  // Fallback sur l'ancien champ au singulier pour les textes sauvegardés avant ce
  // changement, sans avoir besoin d'une migration séparée.
  const monPersonnages = texte.monPersonnages || (texte.monPersonnage ? [texte.monPersonnage] : []);
  const toggleMonPersonnage = (p) => {
    const set = new Set(monPersonnages);
    if (set.has(p)) set.delete(p); else set.add(p);
    onUpdate({ ...texte, monPersonnages: Array.from(set) });
  };
  const focusPersonnages = texte.focusPersonnages || [];
  const toggleFocusPersonnage = (p) => {
    const set = new Set(focusPersonnages);
    if (set.has(p)) set.delete(p); else set.add(p);
    onUpdate({ ...texte, focusPersonnages: Array.from(set) });
  };
  const surlignagePersonnages = texte.surlignagePersonnages || (texte.surlignagePerso ? [texte.surlignagePerso] : []);
  // Une couleur par personnage (pas une seule couleur partagée) — attribuée toute
  // seule à la première coche parmi les couleurs pas encore prises, pour qu'une scène
  // à plusieurs voix reste lisible d'un coup d'œil sans configuration manuelle.
  const surlignageCouleurs = texte.surlignageCouleurs || (texte.surlignagePerso && texte.surlignageCouleur ? { [texte.surlignagePerso]: texte.surlignageCouleur } : {});
  const toggleSurlignagePersonnage = (p) => {
    const set = new Set(surlignagePersonnages);
    const couleurs = { ...surlignageCouleurs };
    if (set.has(p)) {
      set.delete(p);
    } else {
      set.add(p);
      if (!couleurs[p]) {
        const used = new Set(Object.values(couleurs));
        const next = HIGHLIGHT_COLORS.find(c => !used.has(c.key)) || HIGHLIGHT_COLORS[set.size % HIGHLIGHT_COLORS.length];
        couleurs[p] = next.key;
      }
    }
    onUpdate({ ...texte, surlignagePersonnages: Array.from(set), surlignageCouleurs: couleurs });
  };
  const changeSurlignageCouleur = (p, colorKey) => onUpdate({ ...texte, surlignageCouleurs: { ...surlignageCouleurs, [p]: colorKey } });

  const reassign = (blockId, newChar) => {
    const blocks = texte.blocks.map(b => b.id === blockId ? { ...b, personnage: newChar } : b);
    const personnages = Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
    onUpdate({ ...texte, blocks, personnages });
  };
  // Filet de sécurité si le tri automatique (titre/off/acte) a quand même raté un cas :
  // réattribue en masse toutes les répliques de "from" vers "to", au lieu de les
  // corriger une par une, et met à jour les sélections (Mon personnage, Focus,
  // Surligner) pour qu'elles pointent vers le nom fusionné plutôt que de le perdre.
  const mergePersonnages = async (from, to) => {
    if (!from || !to || from === to) return;
    const ok = await confirm(`Fusionner "${from}" dans "${to}" ? Toutes les répliques de "${from}" deviendront "${to}".`, { danger: true });
    if (!ok) return;
    const blocks = texte.blocks.map(b => b.personnage === from ? { ...b, personnage: to } : b);
    const personnages = Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
    const swap = (arr) => Array.from(new Set((arr || []).map(p => p === from ? to : p)));
    const couleurs = { ...surlignageCouleurs };
    if (couleurs[from] && !couleurs[to]) couleurs[to] = couleurs[from];
    delete couleurs[from];
    onUpdate({
      ...texte, blocks, personnages,
      monPersonnages: swap(monPersonnages),
      focusPersonnages: swap(focusPersonnages),
      surlignagePersonnages: swap(surlignagePersonnages),
      surlignageCouleurs: couleurs,
    });
    setMergeFrom(''); setMergeTo('');
  };
  const setNote = (blockId, note) => {
    onUpdate({ ...texte, blocks: texte.blocks.map(b => b.id === blockId ? { ...b, note } : b) });
  };
  const toggleHighlight = (blockId) => {
    onUpdate({ ...texte, blocks: texte.blocks.map(b => b.id === blockId ? { ...b, highlighted: !b.highlighted } : b) });
  };
  // Signets = répliques marquées (icône étiquette) : repères rapides vers une entrée,
  // une réplique clé... Cliquer y saute directement dans le Texte complet.
  const signets = useMemo(() => texte.blocks.filter(b => b.highlighted), [texte.blocks]);
  const jumpToSignet = (blockId) => {
    if (mode !== 'complet' && mode !== 'prompteur') setMode('complet');
    setTimeout(() => {
      const el = document.getElementById('sl-' + blockId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
  };
  // Le texte a été analysé une fois à l'import ; les améliorations du détecteur ne
  // s'appliquent pas rétroactivement aux textes déjà importés tant qu'on ne relance
  // pas l'analyse explicitement (sinon on écraserait en silence des corrections
  // manuelles faites depuis dans l'onglet Corriger).
  const reparse = async () => {
    const source = texte.original || texte.contenu;
    if (!(await confirm("Relancer l'analyse automatique avec le moteur actuel ? Les réattributions manuelles, notes de régie et marquages faits dans l'onglet Corriger seront perdus (le surlignage par personnage et \"Mon personnage\" seront réappliqués si le nom existe encore).", { danger: true }))) return;
    const blocks = parseScript(source);
    const personnages = Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
    const keep = (list) => (list || []).filter(p => personnages.includes(p));
    onUpdate({ ...texte, blocks, personnages, monPersonnages: keep(monPersonnages), focusPersonnages: keep(focusPersonnages), surlignagePersonnages: keep(surlignagePersonnages) });
  };

  // Export papier : même distinction visuelle nom / réplique / didascalie qu'à
  // l'écran, mais en noir sur blanc, sans les contrôles interactifs.
  const exportTextePdf = () => {
    const el = document.getElementById('print-root');
    el.innerHTML = '';
    const accent = '#0f766e';
    const meta = [texte.auteur, texte.compagnie].filter(Boolean).join(' · ');
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family: Georgia, "Source Serif 4", serif; color:#1a1a1a; max-width:700px; line-height:1.6; font-size:13.5px;';
    wrap.innerHTML = `
      <div style="text-align:center;border-bottom:2px solid ${accent};padding-bottom:14px;margin-bottom:22px;">
        <div style="font-family:Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;">${texte.titre}</div>
        ${meta ? `<div style="font-family:Helvetica,Arial,sans-serif;font-size:13px;color:${accent};font-weight:600;margin-top:4px;">${meta}</div>` : ''}
        <div style="font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#888;margin-top:6px;">${personnages.join(', ')} — ${lecture.mots} mots</div>
      </div>
      ${texte.blocks.map(b => {
        if (b.personnage === 'Didascalie') {
          return `<div style="text-align:center;font-style:italic;color:#777;font-size:12.5px;margin:20px 0;letter-spacing:0.3px;">${b.texte}</div>`;
        }
        const didascHtml = b.didascalieEntree ? ` <span style="font-style:italic;font-weight:normal;text-transform:none;letter-spacing:0;">${b.didascalieEntree.startsWith('(') ? b.didascalieEntree : ', ' + b.didascalieEntree}</span>` : '';
        return `
          <div style="margin:16px 0;page-break-inside:avoid;">
            <div style="text-align:center;font-family:Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;font-size:12.5px;">${b.personnage}${didascHtml}</div>
            <div style="margin-top:4px;">${b.texte}</div>
          </div>
        `;
      }).join('')}
    `;
    el.appendChild(wrap);
    setTimeout(() => window.print(), 50);
  };

  const readingModes = mode === 'isoler' || mode === 'complet' || mode === 'prompteur' || mode === 'original';

  return (
    <div className="space-y-3 pb-4">
      <div className="flex items-center justify-end gap-2">
        <IconBtn name="download" title="Exporter ce texte (PDF, pour la lecture papier)" onClick={exportTextePdf} />
      </div>
      <Card>
        <div className="flex items-center justify-between mb-3 gap-2">
          <TextInput value={texte.titre} onChange={(e) => onUpdate({ ...texte, titre: e.target.value })}
            className="!border-0 !bg-transparent !px-1 !py-1 -mx-1 text-xl font-bold rounded-lg flex-1 min-w-0" />
          <Select value={texte.statutMemorisation} onChange={(e) => onUpdate({ ...texte, statutMemorisation: e.target.value })} className="w-auto shrink-0">
            <option>À apprendre</option><option>En cours</option><option>Su</option>
          </Select>
        </div>
        <div className={cx('text-xs mb-3', t.textMuted)}>
          <button onClick={() => setShowCast(s => !s)} className="underline decoration-dotted underline-offset-2">{personnages.length} personnage(s)</button>
          {' '}· {lecture.mots} mots · ~{lecture.normal} min à voix normale
          {showCast && <div className="mt-1">{personnages.join(', ')}</div>}
        </div>
        <Field label="Mon personnage" className="mb-3">
          <PersonnageChips personnages={personnages} selected={monPersonnages} onToggle={toggleMonPersonnage}
            allLabel="Tout le texte" allSelected={!monPersonnages.length} onSelectAll={() => onUpdate({ ...texte, monPersonnages: [] })} />
          {monPersonnages.length > 1 && <div className={cx('text-xs mt-1.5', t.textMuted)}>Plusieurs rôles choisis — utile si tu les joues tous les deux.</div>}
        </Field>

        <button className={cx('w-full flex items-center justify-between pt-2 border-t', t.panelBorder)} onClick={() => setShowDetails(s => !s)}>
          <span className={cx('text-sm font-semibold', t.textMuted)}>Détails (dossier, auteur, type…)</span>
          <Icon name={showDetails ? 'chevronUp' : 'chevronDown'} size={16} className={t.textMuted} />
        </button>
        {showDetails && (
          <div className="mt-3">
            <Field label="Dossier" className="mb-3">
              <div className="flex gap-2">
                <Select value={texte.dossier || ''} onChange={(e) => onUpdate({ ...texte, dossier: e.target.value })} className="flex-1">
