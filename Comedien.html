// Formule officielle de l'allocation journalière, Annexe X (artistes) au règlement
// général annexé à la convention d'assurance chômage du 15/11/2024, Article 14 :
// AJ = A + B + C, avec A lié au salaire de référence (SR), B au nombre d'heures
// travaillées (NHT), C une partie fixe — chacune plafonnée par palier. Vérifié sur
// le texte réglementaire Unédic (unedic.org) et recoupé avec plusieurs sources
// spécialisées indépendantes en septembre 2026. Ces paramètres sont réévalués
// périodiquement par l'Unédic — à recaler si un texte plus récent les modifie.
const AJ_MINIMALE = 31.96; // paramètre de base de la formule (pas le plancher payé)
const AJ_PART_A_SEUIL = 13700; // € de SR
const AJ_PART_A_TAUX_BAS = 0.36;
const AJ_PART_A_TAUX_HAUT = 0.05;
const AJ_PART_A_DIVISEUR = 5000;
const AJ_PART_B_SEUIL = 690; // heures de NHT
const AJ_PART_B_TAUX_BAS = 0.26;
const AJ_PART_B_TAUX_HAUT = 0.08;
const AJ_PART_B_DIVISEUR = 507;
const AJ_PART_C_TAUX = 0.70;
const AJ_PLANCHER = 44; // montant minimal réellement versé (Annexe 10)
const AJ_PLAFOND = 174.80; // plafond en vigueur depuis le 01/01/2024
const AJ_TAUX_PRELEVEMENTS = 0.075; // CSG/CRDS (~6,7% net d'abattement) + participation retraite (0,93%) — ordre de grandeur, dépend du revenu fiscal de référence

function computeAllocationAnnexe10(sr, nh) {
  const partA = (AJ_MINIMALE * (AJ_PART_A_TAUX_BAS * Math.min(sr, AJ_PART_A_SEUIL) + AJ_PART_A_TAUX_HAUT * Math.max(0, sr - AJ_PART_A_SEUIL))) / AJ_PART_A_DIVISEUR;
  const partB = (AJ_MINIMALE * (AJ_PART_B_TAUX_BAS * Math.min(nh, AJ_PART_B_SEUIL) + AJ_PART_B_TAUX_HAUT * Math.max(0, nh - AJ_PART_B_SEUIL))) / AJ_PART_B_DIVISEUR;
  const partC = AJ_MINIMALE * AJ_PART_C_TAUX;
  const ajBrute = partA + partB + partC;
  const ajApresPlancher = Math.max(ajBrute, AJ_PLANCHER);
  const ajFinale = Math.min(ajApresPlancher, AJ_PLAFOND);
  const ajNetteEstimee = ajFinale * (1 - AJ_TAUX_PRELEVEMENTS);
  return { partA, partB, partC, ajBrute, ajFinale, ajNetteEstimee, plancherApplique: ajBrute < AJ_PLANCHER, plafondApplique: ajApresPlancher > AJ_PLAFOND };
}

// Fusion en profondeur avec les valeurs par défaut : un JSON restauré (ou une ancienne
// sauvegarde) peut ne pas avoir tous les champs actuels — sans ça, un champ manquant
// (ex. profile.cvPro) devient undefined et fait planter l'appli à l'affichage.
function mergeWithDefaults(parsed) {
  const base = defaultData();
  const p = parsed || {};
  const oldProfile = p.profile || {};
  const oldCvPro = oldProfile.cvPro || {};
  // Migration : une ancienne sauvegarde avait "filmographie" (texte libre) au lieu
  // d'"experiences" (liste structurée) — on la convertit plutôt que de la perdre.
  const migratedExperiences = Array.isArray(oldCvPro.experiences) ? oldCvPro.experiences
    : (oldCvPro.filmographie && oldCvPro.filmographie.trim() ? [{ id: uid(), titre: oldCvPro.filmographie.trim(), role: '', annee: '', type: 'Autre' }] : base.profile.cvPro.experiences);
  // Migration : "formation" était un unique bloc de texte libre, remplacé par une liste
  // structurée (une entrée par formation/stage) pour éviter un pavé de texte illisible.
  const migratedFormation = Array.isArray(oldCvPro.formation) ? oldCvPro.formation
    : (typeof oldCvPro.formation === 'string' && oldCvPro.formation.trim() ? [{ id: uid(), intitule: oldCvPro.formation.trim(), annee: '' }] : base.profile.cvPro.formation);
  // Migration : "demoLink" (un seul lien) remplacé par "liens" (plusieurs, avec libellé).
  const migratedLiens = Array.isArray(oldProfile.liens) ? oldProfile.liens
    : (oldProfile.demoLink && oldProfile.demoLink.trim() ? [{ id: uid(), label: 'Démo', url: oldProfile.demoLink.trim() }] : base.profile.liens);
  return {
    ...base, ...p,
    profile: {
      ...base.profile, ...oldProfile,
      liens: migratedLiens,
      mensurations: { ...base.profile.mensurations, ...(oldProfile.mensurations || {}) },
      logistique: { ...base.profile.logistique, ...(oldProfile.logistique || {}) },
      cvPro: { ...base.profile.cvPro, ...oldCvPro, experiences: migratedExperiences, formation: migratedFormation },
    },
    settings: { ...base.settings, ...(p.settings || {}) },
    contacts: Array.isArray(p.contacts) ? p.contacts : base.contacts,
    categories: Array.isArray(p.categories) ? p.categories : base.categories,
    employeurs: Array.isArray(p.employeurs) ? p.employeurs : base.employeurs,
    cachets: Array.isArray(p.cachets) ? p.cachets : base.cachets,
    castings: Array.isArray(p.castings) ? p.castings : base.castings,
    representations: Array.isArray(p.representations) ? p.representations : base.representations,
    textes: Array.isArray(p.textes) ? p.textes : base.textes,
    dossiersTextes: Array.isArray(p.dossiersTextes) ? p.dossiersTextes : base.dossiersTextes,
    favorisExercices: Array.isArray(p.favorisExercices) ? p.favorisExercices : base.favorisExercices,
    exercices: Array.isArray(p.exercices) ? p.exercices : base.exercices,
    exerciceCategories: Array.isArray(p.exerciceCategories) ? p.exerciceCategories : base.exerciceCategories,
    reexamHistory: Array.isArray(p.reexamHistory) ? p.reexamHistory : base.reexamHistory,
    dateFinDroits: p.dateFinDroits || base.dateFinDroits,
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    return mergeWithDefaults(JSON.parse(raw));
  } catch (e) { return defaultData(); }
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.warn('Sauvegarde impossible', e); }
}

// Stocké hors de `data` (clé séparée) : la date du dernier export JSON manuel n'est pas

// de sauvegarder — un reset ou une restauration ne doit pas y toucher.
const BACKUP_KEY = 'comedien-last-backup-v1';
function getLastBackup() {
  try { const raw = localStorage.getItem(BACKUP_KEY); return raw ? new Date(raw) : null; } catch (e) { return null; }
}
function setLastBackup() {
  try { localStorage.setItem(BACKUP_KEY, new Date().toISOString()); } catch (e) {}
}

// N'ajoute à l'historique d'annulation que les vrais changements de contenu (cachets,
// contacts, textes, profil…), pas les réglages d'apparence — un curseur de volume/vitesse
// déclenche un setData à chaque tick de glissement et inonderait l'historique pour rien.
function hasDataChange(prev, next) {
  return Object.keys(next).some(k => k !== 'settings' && prev[k] !== next[k]);
}

function cx(...parts) { return parts.filter(Boolean).join(' '); }


function fmtEuros(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}

function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('fr-FR'); } catch (e) { return d; }
}

function fmtMoisAnnee(ym) {
  const [y, m] = ym.split('-').map(Number);
  const label = new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

function computeAge(dateNaissance) {
  if (!dateNaissance) return null;
  const birth = new Date(dateNaissance);
  if (isNaN(birth.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const hadBirthdayThisYear = now.getMonth() > birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
  if (!hadBirthdayThisYear) age--;
  return age;
}

function normalizeUrl(url) {
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : 'https://' + url;
}

// Extrait le texte d'un PDF en reconstruisant les lignes par position verticale
// (sans ça pdf.js renvoie un seul bloc de texte illisible et non analysable).
async function extractPdfText(file) {
  if (!window.pdfjsLib) throw new Error('pdfjsLib indisponible');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let lastY = null, line = '';
    content.items.forEach(item => {
      const y = item.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) { text += line.trim() + '\n'; line = ''; }
      line += item.str + ' ';
      lastY = y;
    });
    text += line.trim() + '\n\n';
  }
  return text;
}

// Heuristiques best-effort pour pré-remplir un cachet à partir du texte d'un bulletin
// (uniquement les PDF avec une vraie couche de texte — pas les scans/photos, pas d'OCR).
// Ne jamais faire confiance aveuglément : sert uniquement à pré-remplir un brouillon
// que l'utilisateur doit vérifier avant d'enregistrer.
// Libellés officiels d'une AEM (Attestation Employeur Mensuelle, modèle Unédic DAJ 110) :
// "SALAIRES BRUTS", "Nombre de CACHETS", "Date d'embauche", "Raison Sociale". Une vraie
// AEM (GUSO ou logiciel de paie) respecte ce gabarit, donc ces libellés sont prioritaires
// sur des motifs génériques de bulletin de paie classique.
// Détection de doublon de cachet : même employeur + même date de début + même montant.
// Volontairement strict sur les 3 critères à la fois pour éviter les faux positifs
// (deux cachets distincts chez le même employeur le même jour, à des tarifs différents,
// ne seront pas signalés) tout en bloquant le cas réel à risque : réimporter deux fois
// la même AEM. Un mauvais comptage de cachets fausse directement le suivi des 507h.
function findDuplicateCachet(candidate, existingCachets, excludeId) {
  const norm = (s) => (s || '').trim().toLowerCase();
  const empN = norm(candidate.employeur);
  if (!empN || !candidate.dateDebut) return null;
  return existingCachets.find(c =>
    c.id !== excludeId &&
    norm(c.employeur) === empN &&
    c.dateDebut === candidate.dateDebut &&
    Number(c.montantBrut || 0) === Number(candidate.montantBrut || 0)
  ) || null;
}

function findDuplicateContact(candidate, existingContacts, excludeId) {
  const norm = (s) => (s || '').replace(/\s+/g, '').toLowerCase();
  return (existingContacts || []).find(c => c.id !== excludeId && (
    (candidate.nom && candidate.nom.trim() && norm(c.nom) === norm(candidate.nom)) ||
    (candidate.telephone && candidate.telephone.trim() && norm(c.telephone) === norm(candidate.telephone)) ||
    (candidate.email && candidate.email.trim() && norm(c.email) === norm(candidate.email))
  )) || null;
}

// vCard (.vcf) : format universel reconnu par Contacts sur iPhone, Android, Mac et
// Windows — ouvrir le fichier propose directement "Ajouter aux contacts", sans passer
// par une API spécifique à une plateforme (l'API Contact Picker native, utilisée plus
// bas, ne fonctionne que sur Chrome Android).
function contactToVCard(c) {
  const esc = (s) => (s || '').replace(/([,;\\])/g, '\\$1').replace(/\r?\n/g, '\\n');
  const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${esc(c.nom)};;;;`, `FN:${esc(c.nom)}`];
  if (c.fonction) lines.push(`TITLE:${esc(c.fonction)}`);
  if (c.telephone) lines.push(`TEL;TYPE=CELL:${esc(c.telephone)}`);
  if (c.email) lines.push(`EMAIL:${esc(c.email)}`);
  if (c.site) lines.push(`URL:${esc(normalizeUrl(c.site))}`);
  if (c.adresse) lines.push(`ADR;TYPE=WORK:;;${esc(c.adresse)};;;;`);
  if (c.notes) lines.push(`NOTE:${esc(c.notes)}`);
  lines.push('END:VCARD');
  return lines.join('\r\n');
}

function downloadVCard(filename, vcardText) {
  const blob = new Blob([vcardText], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Parseur volontairement simple (FN/N, TEL, EMAIL, URL, NOTE) : couvre les vCards
// exportées par les carnets d'adresses courants sans reproduire toute la RFC 6350.
function parseVCards(text) {
  const unfolded = text.replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '');
  const blocks = unfolded.split(/BEGIN:VCARD/i).slice(1);
  const getValue = (lines, key) => {
    const line = lines.find(l => l.toUpperCase().startsWith(key));
    if (!line) return '';
    const idx = line.indexOf(':');
    return idx === -1 ? '' : line.slice(idx + 1).trim();
  };
  return blocks.map(block => {
    const lines = block.split(/\r\n|\r|\n/).filter(Boolean);
    const fn = getValue(lines, 'FN:') || getValue(lines, 'FN;');
    const n = getValue(lines, 'N:') || getValue(lines, 'N;');
    const nom = fn || n.split(';').filter(Boolean).reverse().join(' ');
    return {
      nom: nom.trim(),
      telephone: getValue(lines, 'TEL'),
      email: getValue(lines, 'EMAIL'),
      site: getValue(lines, 'URL'),
      notes: getValue(lines, 'NOTE').replace(/\\n/g, '\n').replace(/\\,/g, ',').replace(/\\;/g, ';'),
    };
  }).filter(c => c.nom);
}

function findDuplicateLien(candidate, existingLiens) {
  const norm = (s) => (s || '').trim().toLowerCase().replace(/\/+$/, '');
  return (existingLiens || []).find(l => norm(l.url) === norm(candidate.url)) || null;
}

function findDuplicateExperience(candidate, existingExperiences) {
  const norm = (s) => (s || '').trim().toLowerCase();
  return (existingExperiences || []).find(e => norm(e.titre) === norm(candidate.titre) && norm(e.annee) === norm(candidate.annee)) || null;
}

function findDuplicateFormation(candidate, existingFormation) {
  const norm = (s) => (s || '').trim().toLowerCase();
  return (existingFormation || []).find(f => norm(f.intitule) === norm(candidate.intitule) && norm(f.annee) === norm(candidate.annee)) || null;
}

function parseYearForSort(str) {
  const m = (str || '').match(/\d{4}/);
  return m ? parseInt(m[0], 10) : -1;
}

function sortByYearDesc(list, key) {
  return (list || []).slice().sort((a, b) => parseYearForSort(b[key]) - parseYearForSort(a[key]));
}

function scanBulletinText(text, employeursConnus) {
  const draft = { type: 'Tournage', projet: '', employeur: '', dateDebut: '', nbCachets: 1, montantBrut: '', statut: 'Déclaré', aem: 'Reçue', notes: '' };

  const montantMatch = text.match(/salaires?\s+bruts?[^0-9]{0,20}(\d{1,6}[.,]\d{2})/i) || text.match(/(?:brut|total brut)[^0-9]{0,15}(\d{1,6}[.,]\d{2})/i);
  if (montantMatch) draft.montantBrut = montantMatch[1].replace(',', '.');

  const cachetMatch = text.match(/nombre\s+de\s+cachets?[^0-9]{0,15}(\d{1,3}(?:[.,]\d+)?)/i) || text.match(/(\d{1,3}(?:[.,]\d+)?)\s*cachets?/i) || text.match(/cachets?[^0-9]{0,15}(\d{1,3}(?:[.,]\d+)?)/i);
  if (cachetMatch) draft.nbCachets = cachetMatch[1].replace(',', '.');

  const dateEmbaucheMatch = text.match(/date\s+d['’]embauche[^0-9]{0,20}(\d{2})[\/.](\d{2})[\/.](\d{4})/i);
  const dateMatch = dateEmbaucheMatch || text.match(/(\d{2})[\/.](\d{2})[\/.](\d{4})/);
  if (dateMatch) draft.dateDebut = `${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`;

  const found = (employeursConnus || []).find(emp => text.toLowerCase().includes(emp.nom.toLowerCase()));
  if (found) {
    draft.employeur = found.nom;
    draft.type = found.typeParDefaut || draft.type;
  } else {
    const raisonMatch = text.match(/raison\s+sociale\s*:?\s*\n?\s*([A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜŸÇ][^\n]{1,60})/i);
    if (raisonMatch) draft.employeur = raisonMatch[1].trim();
  }

  return draft;
}

const CV_FIELD_LIST = ['PRENOM', 'NOM', 'DATE_NAISSANCE', 'METIER', 'EMAIL', 'TELEPHONE', 'DEMO', 'TAILLE', 'POIDS', 'VESTE', 'PANTALON', 'POINTURE', 'TETE', 'COU', 'POITRINE', 'TOUR_DE_TAILLE', 'PERMIS', 'TATOUAGE', 'FORMATION', 'LANGUES', 'COMPETENCES', 'FILMOGRAPHIE'];

const CV_FORMAT_PROMPT = `Tu es un assistant qui aide un comédien à structurer les informations de son profil professionnel (CV / fiche technique) dans un format précis, à partir de n'importe quelle source (CV existant, texte libre, notes en vrac).

Règles impératives :
- N'invente JAMAIS une information absente (mensurations, expériences, dates…) : laisse le champ vide après les deux-points s'il n'est pas présent dans ce que je te donne.
- Ne modifie ni n'invente aucune expérience professionnelle : reprends uniquement celles présentes dans le texte fourni.
- Réponds UNIQUEMENT avec le bloc structuré ci-dessous rempli, sans aucun commentaire ni explication autour.

Format exact à respecter (garde les libellés en MAJUSCULES tels quels, un champ par ligne — FORMATION, LANGUES et COMPETENCES peuvent tenir sur plusieurs lignes jusqu'au champ suivant) :

PRENOM:
NOM:
DATE_NAISSANCE: (format JJ/MM/AAAA)
METIER:
EMAIL:
TELEPHONE:
DEMO: (lien vers une vidéo de démo si mentionné)
TAILLE: (en cm, chiffre seul)
POIDS: (en kg, chiffre seul)
VESTE:
PANTALON:
POINTURE:
TETE:
COU:
POITRINE:
TOUR_DE_TAILLE:
PERMIS: (oui ou non)
TATOUAGE: (oui ou non)
FORMATION: (une ligne par formation/stage, exactement au format : Intitulé | Année)
LANGUES:
COMPETENCES:
FILMOGRAPHIE: (une ligne par expérience, exactement au format : Titre | Rôle | Année | Type — où Type est l'un de Long-métrage / Court-métrage / Série / Théâtre / Publicité / Voix off / Autre)

Voici les informations à partir desquelles remplir ce format (CV, texte libre, etc.) :

[COLLE TON CV OU TES INFOS ICI]`;

function parseCvCanonicalText(text) {
  const fieldRegex = new RegExp('^(' + CV_FIELD_LIST.join('|') + ')\\s*:\\s*(.*)$');
  const result = {};
  let currentField = null;
  for (const rawLine of (text || '').split(/\r?\n/)) {
    const line = rawLine.trim();
    const m = line.match(fieldRegex);
    if (m) { currentField = m[1]; result[currentField] = m[2] || ''; }
    else if (currentField && line) { result[currentField] = (result[currentField] ? result[currentField] + '\n' : '') + line; }
  }
  Object.keys(result).forEach(k => { result[k] = result[k].trim(); });
  return result;
}

function cvFieldsToProfilePatch(result) {
  const patch = { mensurations: {}, logistique: {}, cvPro: {} };
  if (result.PRENOM) patch.prenom = result.PRENOM;
  if (result.NOM) patch.nom = result.NOM;
  if (result.DATE_NAISSANCE) {
    const m = result.DATE_NAISSANCE.match(/(\d{2})[\/.](\d{2})[\/.](\d{4})/);
    if (m) patch.dateNaissance = `${m[3]}-${m[2]}-${m[1]}`;
  }
  if (result.METIER) patch.metier = result.METIER;
  if (result.EMAIL) patch.email = result.EMAIL;
  if (result.TELEPHONE) patch.telephone = result.TELEPHONE;
  if (result.DEMO) patch.liens = [{ id: uid(), label: 'Démo', url: result.DEMO }];
  [['TAILLE', 'taille'], ['POIDS', 'poids'], ['VESTE', 'veste'], ['PANTALON', 'pantalon'], ['POINTURE', 'pointure'], ['TETE', 'tete'], ['COU', 'cou'], ['POITRINE', 'poitrine'], ['TOUR_DE_TAILLE', 'tourTaille']].forEach(([key, field]) => {
    if (result[key]) patch.mensurations[field] = result[key];
  });
  if (result.PERMIS) patch.logistique.permis = /oui/i.test(result.PERMIS);
  if (result.TATOUAGE) patch.logistique.tatouage = /oui/i.test(result.TATOUAGE);
  if (result.FORMATION) {
    patch.cvPro.formation = result.FORMATION.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const parts = line.replace(/^[-•]\s*/, '').split('|').map(s => s.trim());
      return { id: uid(), intitule: parts[0] || '', annee: parts[1] || '' };
    });
  }
  if (result.LANGUES) patch.cvPro.langues = result.LANGUES;
  if (result.COMPETENCES) patch.cvPro.competences = result.COMPETENCES;
  if (result.FILMOGRAPHIE) {
    patch.cvPro.experiences = result.FILMOGRAPHIE.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const parts = line.replace(/^[-•]\s*/, '').split('|').map(s => s.trim());
      return { id: uid(), titre: parts[0] || '', role: parts[1] || '', annee: parts[2] || '', type: parts[3] || 'Autre' };
    });
  }
  return patch;
}

function applyProfilePatch(profile, patch, forceOverwrite) {
  const next = { ...profile, mensurations: { ...profile.mensurations }, logistique: { ...profile.logistique }, cvPro: { ...profile.cvPro } };
  ['prenom', 'nom', 'dateNaissance', 'metier', 'email', 'telephone'].forEach(k => {
    if (patch[k] !== undefined && patch[k] !== '' && (forceOverwrite || !next[k])) next[k] = patch[k];
  });
  if (patch.liens && patch.liens.length) {
    if (forceOverwrite) next.liens = patch.liens;
    else {
      const nouveaux = patch.liens.filter(l => !findDuplicateLien(l, next.liens));
      next.liens = [...(next.liens || []), ...nouveaux];
    }
  }
  Object.keys(patch.mensurations || {}).forEach(k => {
    if (forceOverwrite || !next.mensurations[k]) next.mensurations[k] = patch.mensurations[k];
  });
  ['permis', 'tatouage'].forEach(k => {
    if (patch.logistique && patch.logistique[k] !== undefined && (forceOverwrite || !next.logistique[k])) next.logistique[k] = patch.logistique[k];
  });
  if (patch.logistique && patch.logistique.notes && (forceOverwrite || !next.logistique.notes)) next.logistique.notes = patch.logistique.notes;
  ['langues', 'competences'].forEach(k => {
    if (patch.cvPro && patch.cvPro[k] && (forceOverwrite || !next.cvPro[k])) next.cvPro[k] = patch.cvPro[k];
  });
  if (patch.cvPro && patch.cvPro.formation && patch.cvPro.formation.length) {
    if (forceOverwrite) next.cvPro.formation = patch.cvPro.formation;
    else {
      const nouvelles = patch.cvPro.formation.filter(f => !findDuplicateFormation(f, next.cvPro.formation));
      next.cvPro.formation = [...(next.cvPro.formation || []), ...nouvelles];
    }
  }
  if (patch.cvPro && patch.cvPro.experiences && patch.cvPro.experiences.length) {
    if (forceOverwrite) next.cvPro.experiences = patch.cvPro.experiences;
    else {
      const nouvelles = patch.cvPro.experiences.filter(exp => !findDuplicateExperience(exp, next.cvPro.experiences));
      next.cvPro.experiences = [...(next.cvPro.experiences || []), ...nouvelles];
    }
  }
  return next;
}

    case 'highlighter': return <svg {...c}><path d="M9.5 17.5L4 20l2.5-5.5L15.5 5.5a2.1 2.1 0 013 3L9.5 17.5z" /><path d="M13 6l3.5 3.5" /><path d="M4 20h5" /></svg>;
    case 'eye': return <svg {...c}><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></svg>;
    case 'maximize': return <svg {...c}><path d="M8 3H5a2 2 0 00-2 2v3" /><path d="M16 3h3a2 2 0 012 2v3" /><path d="M8 21H5a2 2 0 01-2-2v-3" /><path d="M16 21h3a2 2 0 002-2v-3" /></svg>;

    case 'help': return <svg {...c}><circle cx="12" cy="12" r="9" /><path d="M9.5 9a2.5 2.5 0 014.9.8c0 1.7-2.4 1.7-2.4 3.5" /><path d="M12 17.5v.01" /></svg>;
    case 'info': return <svg {...c}><circle cx="12" cy="12" r="9" /><path d="M12 11v5.5" /><path d="M12 7.5v.01" /></svg>;
    case 'coins': return <svg {...c}><ellipse cx="9" cy="7" rx="6" ry="3.5" /><path d="M3 7v5c0 1.9 2.7 3.5 6 3.5s6-1.6 6-3.5V7" /><path d="M15 10.3c2.8.3 6 1.6 6 3.2 0 1.9-3.6 3.5-8 3.5-3 0-5.6-.8-7-1.9" /></svg>;

    default: return null;
  }
}

/* ================= Contexte thème ================= */

const ThemeContext = createContext({ theme: 'clair', toggle: () => {} });
function useTheme() { return useContext(ThemeContext); }

// Hauteur réelle de l'en-tête sticky (mesurée, pas devinée) : la taille du texte
// (petit/normal/grand) change la taille de root, donc la hauteur du header en px —
// un décalage codé en dur casserait la barre d'outils sticky de lecture en "Grand".
const HeaderHeightContext = createContext(0);

// "to" = 2e teinte utilisée uniquement pour les dégradés (en-tête, cartes vedettes,
// boutons principaux) — le nom de couleur choisi par l'utilisateur (`id`) continue
// seul d'alimenter tous les usages ponctuels ailleurs dans le code (textes, bordures,
// focus...) pour ne rien casser : le dégradé est un raffinement visuel, pas un
// changement de système de couleur.
// Chaque paire vise un "style" reconnaissable et distinct des 4 autres (pas
// seulement une teinte différente) : océan / cosmique / électrique / coucher de
// soleil / printemps — pour que les 5 pastilles ne se ressemblent jamais entre
// elles, même en un coup d'œil rapide sur les petites pastilles de Réglages.
const ACCENT_OPTIONS = [
  { id: 'teal', label: 'Teal', to: 'sky' },       // océan
  { id: 'violet', label: 'Violet', to: 'pink' },  // cosmique
  { id: 'blue', label: 'Bleu', to: 'cyan' },      // électrique
  { id: 'amber', label: 'Ambre', to: 'rose' },    // coucher de soleil
  { id: 'emerald', label: 'Émeraude', to: 'lime' }, // printemps
];

// Variable de module plutôt qu'un paramètre : themeClasses(theme) est appelé à ~30
// endroits dans le fichier, refaire passer un accent partout serait risqué. App()
// met à jour cette variable en tout début de rendu, avant que le moindre enfant
// n'appelle themeClasses — React rendant toujours le parent avant ses enfants dans
// une même passe synchrone, la valeur est garantie à jour partout où elle est lue.
let currentAccent = 'teal';
let currentAccentTo = 'emerald';

function themeClasses(theme) {
  const c = currentAccent;
  const c2 = currentAccentTo;
  if (theme === 'sombre') {
    return {
      bg: 'bg-[#0a0a0a]', panel: 'bg-[#161616]', panelBorder: 'border-[#2a2a2a]',
      text: 'text-[#f0efec]', textMuted: 'text-[#9a9894]', accent: `text-${c}-400`,
      input: 'bg-[#161616] border-[#2a2a2a] text-[#f0efec] placeholder-[#666]',
      btnPrimary: `bg-gradient-to-br from-${c}-400 to-${c2}-600 hover:brightness-110 text-[#0a0a0a] font-semibold shadow-[0_2px_10px_-2px] shadow-${c}-500/40 transition`,
      btnGhost: `hover:bg-[#1e1e1e] text-[#e2e0dc]`,
      cardHover: `hover:bg-[#1a1a1a]`,
      soft: `!bg-[#1a1a1a]`,
      headerGrad: `!bg-gradient-to-br from-${c}-600 to-${c2}-900`,
      ring: `focus:ring-${c}-400/50`,
    };
  }
  return {
    bg: 'bg-[#FAF9F5]', panel: 'bg-white', panelBorder: `border-${c}-100`,
    text: 'text-stone-900', textMuted: 'text-stone-500', accent: `text-${c}-700`,
    input: 'bg-white border-stone-200 text-stone-900 placeholder-stone-400',
    btnPrimary: `bg-gradient-to-br from-${c}-600 to-${c2}-800 hover:brightness-110 text-white font-semibold shadow-[0_2px_10px_-2px] shadow-${c}-700/40 transition`,
    btnGhost: `hover:bg-${c}-50 text-stone-700`,
    cardHover: `hover:bg-${c}-50/60`,
    soft: `!bg-${c}-50/70`,
    headerGrad: `!bg-gradient-to-br from-${c}-500 to-${c2}-800`,
    ring: `focus:ring-${c}-400/50`,
  };
}

/* ================= Composants UI génériques ================= */

function Btn({ variant = 'primary', onClick, children, className = '', type = 'button', title, disabled }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const base = 'inline-flex items-center justify-center gap-1.5 rounded-full px-4 py-2.5 text-sm font-medium transition active:scale-95';
  const styles = variant === 'primary' ? t.btnPrimary : variant === 'danger' ? 'bg-red-600 hover:bg-red-500 text-white' : t.btnGhost;
  return <button type={type} title={title} onClick={onClick} disabled={disabled} className={cx(base, styles, disabled ? 'opacity-40 pointer-events-none' : '', className)}>{children}</button>;
}

// pop = petit rebond quand l'icône passe à son état "actif" (favori coché...) : un
// simple changement de couleur passe inaperçu, un rebond se remarque et se ressent.
// Indépendant de `active` (qui ne gère que la couleur) pour ne pas perturber les
// boutons qui personnalisent déjà leur propre couleur via `className`.
function IconBtn({ name, onClick, title, className = '', danger, active, pop }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (
    <button type="button" title={title} onClick={onClick}
      className={cx('p-2.5 rounded-full transition active:scale-90', active ? 'text-amber-500 hover:bg-amber-500/10' : danger ? 'text-red-500 hover:bg-red-500/10' : t.btnGhost, className)}>
      <Icon key={pop ? name : undefined} name={name} size={18} className={pop ? 'star-pop' : ''} />
    </button>
  );
}

// Menu "..." pour regrouper des actions secondaires (peu utilisées) sans
// encombrer l'en-tête d'un onglet — se ferme au clic en dehors.
function DropdownMenu({ items, title = 'Plus d\'options' }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('touchstart', onDoc);
    return () => { document.removeEventListener('mousedown', onDoc); document.removeEventListener('touchstart', onDoc); };
  }, [open]);
  const visible = items.filter(it => !it.hidden);
  if (!visible.length) return null;
  return (
    <div className="relative shrink-0" ref={ref}>
      <IconBtn name="more" title={title} onClick={() => setOpen(o => !o)} />
      {open && (
        <div className={cx('absolute right-0 top-full mt-1 z-20 rounded-2xl shadow-lg border py-1.5 min-w-[230px]', t.panel, t.panelBorder)}>
          {visible.map((it, i) => (
            <button key={i} onClick={() => { setOpen(false); it.onClick(); }}
              className={cx('w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-left whitespace-nowrap', t.cardHover)}>
              <Icon name={it.icon} size={16} className={t.textMuted} />{it.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function ConfirmDeleteButton({ onConfirm, title = 'Supprimer' }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const { notifyUndo } = useUIFeedback();
  const [confirming, setConfirming] = useState(false);
  useEffect(() => {
    if (!confirming) return;
    const timer = setTimeout(() => setConfirming(false), 6000);
    return () => clearTimeout(timer);
  }, [confirming]);
  if (confirming) {
    return (
      <div className="flex items-center gap-1">
        <button type="button" title="Confirmer la suppression" onClick={(e) => { e.stopPropagation(); onConfirm(); setConfirming(false); notifyUndo('Supprimé'); }}
          className="p-2.5 rounded-full bg-red-600 hover:bg-red-500 text-white transition active:scale-90">
          <Icon name="check" size={16} />
        </button>
        <button type="button" title="Annuler" onClick={(e) => { e.stopPropagation(); setConfirming(false); }}
          className={cx('p-2.5 rounded-full transition active:scale-90', t.btnGhost)}>
          <Icon name="x" size={16} />
        </button>
      </div>
    );
  }
  return <IconBtn name="trash" danger title={title} onClick={(e) => { e.stopPropagation(); setConfirming(true); }} />;
}

function Field({ label, children, className = '' }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (
    <label className={cx('block', className)}>
      {label && <span className={cx('block text-xs font-medium mb-1', t.textMuted)}>{label}</span>}
      {children}
    </label>
  );
}

function TextInput(props) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const { className, ...rest } = props;
  return <input {...rest} className={cx('w-full rounded-2xl border px-3.5 py-2.5 text-sm outline-none focus:ring-2', t.ring, t.input, className)} />;
}

const TextArea = React.forwardRef((props, ref) => {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const { className, ...rest } = props;
  return <textarea ref={ref} {...rest} className={cx('w-full rounded-2xl border px-3.5 py-2.5 text-sm outline-none focus:ring-2', t.ring, t.input, className)} />;
});

function Select(props) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const { className, children, ...rest } = props;
  return <select {...rest} className={cx('w-full rounded-2xl border px-3.5 py-2.5 text-sm outline-none focus:ring-2', t.ring, t.input, className)}>{children}</select>;
}

// hero = cartes "vedettes" à fond dégradé (en-tête d'onglet, allocation...) : une
// ombre colorée plus marquée que les cartes standard crée une hiérarchie visuelle
// claire (ce qui compte le plus flotte plus haut) sans toucher au reste des cartes.
function Card({ children, className = '', hero = false }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const heroShadow = hero && cx('!shadow-[0_10px_24px_-14px]', theme === 'sombre' ? `shadow-${currentAccent}-500/20` : `shadow-${currentAccent}-600/20`);
  return (
    <div className={cx('rounded-3xl p-4 shadow-[0_1px_3px_rgba(0,0,0,0.05),0_8px_24px_-6px_rgba(0,0,0,0.08)]', t.panel, heroShadow, hero && 'relative overflow-hidden', className)}>
      {/* Halo lumineux très discret : juste assez pour casser la platitude d'un fond
          dégradé uni, sans devenir un effet visible en soi (retour utilisateur : le
          halo précédent était trop marqué). */}
      {hero && <div className="pointer-events-none absolute -top-10 -right-10 w-28 h-28 rounded-full bg-white/10 blur-3xl" />}
      <div className="relative">{children}</div>
    </div>
  );
}

// icon = petit badge dégradé devant le titre — même repère visuel que la notice et
// les listes (icône = catégorie reconnaissable au coup d'œil), optionnel pour ne pas
// changer les nombreux appels de SectionTitle qui n'en ont pas besoin.
function SectionTitle({ children, right, icon }) {
  const { theme } = useTheme();
  return (
    <div className="flex items-center justify-between mb-3 gap-2">
      <h2 className="text-xl font-bold tracking-tight flex items-center gap-2.5 min-w-0">
        {icon && (
          <span className={cx('shrink-0 w-9 h-9 rounded-2xl flex items-center justify-center', theme === 'sombre' ? `bg-${currentAccent}-500/15 text-${currentAccent}-400` : `bg-${currentAccent}-50 text-${currentAccent}-700`)}>
            <Icon name={icon} size={17} />
          </span>
        )}
        <span className="truncate">{children}</span>
      </h2>
      {right}
    </div>
  );
}

function Modal({ title, onClose, children }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4 modal-backdrop !mt-0" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className={cx('modal-panel w-full sm:max-w-lg max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5', t.bg, 'border', t.panelBorder)}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold">{title}</h3>
          <IconBtn name="x" onClick={onClose} title="Fermer" />
        </div>
        {children}
      </div>
    </div>

// Remplace window.confirm/alert (non stylables, bloquants, moches sur mobile)
// par une modale et des toasts maison. confirm() renvoie une Promise<boolean>
// pour rester utilisable avec `await` dans les gestionnaires existants.
const UIFeedbackContext = createContext({ confirm: async () => true, notify: () => {}, notifyUndo: () => {} });
function useUIFeedback() { return useContext(UIFeedbackContext); }

// `undo` est fourni par App() (revient au dernier état de `history`) — le fait
// transiter ici permet à n'importe quel composant (ex. ConfirmDeleteButton, utilisé
// dans ~10 endroits) de proposer un "Annuler" juste après une suppression, sans avoir
// à faire remonter cette info via des props sur toute la chaîne des composants.
function UIFeedbackProvider({ children, undo }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [confirmState, setConfirmState] = useState(null);
  const [toasts, setToasts] = useState([]);

  const confirm = useCallback((message, opts = {}) => new Promise((resolve) => {
    setConfirmState({ message, resolve, danger: !!opts.danger, confirmLabel: opts.confirmLabel || 'Confirmer', cancelLabel: opts.cancelLabel || 'Annuler' });
  }), []);

  const closeConfirm = (result) => {
    setConfirmState(cs => { if (cs) cs.resolve(result); return null; });
  };

  const notify = useCallback((message, type = 'info') => {
    const id = uid();
    setToasts(ts => [...ts, { id, message, type }]);
    setTimeout(() => setToasts(ts => ts.filter(x => x.id !== id)), type === 'error' ? 5500 : 3500);
  }, []);

  // Une seule bulle "Annuler" à la fois : si une nouvelle suppression arrive avant que
  // l'utilisateur ait réagi, elle remplace la précédente plutôt que de s'empiler — le
  // bouton "Annuler" annule toujours la dernière action, donc au plus une bulle a du sens.
  const notifyUndo = useCallback((message) => {
    const id = uid();
    setToasts(ts => [...ts.filter(x => x.type !== 'undo'), { id, message, type: 'undo' }]);
    setTimeout(() => setToasts(ts => ts.filter(x => x.id !== id)), 5000);
  }, []);

  const handleUndo = (id) => {
    undo();
    setToasts(ts => ts.filter(x => x.id !== id));
  };

  return (
    <UIFeedbackContext.Provider value={{ confirm, notify, notifyUndo }}>
      {children}
      {confirmState && (
        <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center bg-black/50 p-4" onClick={() => closeConfirm(false)}>
          <div onClick={(e) => e.stopPropagation()} className={cx('w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl p-5 border', t.bg, t.text, t.panelBorder)}>
            <div className="text-sm leading-relaxed whitespace-pre-line mb-5">{confirmState.message}</div>
            <div className="flex items-center gap-2 justify-end">
              <Btn variant="ghost" onClick={() => closeConfirm(false)}>{confirmState.cancelLabel}</Btn>
              <Btn variant={confirmState.danger ? 'danger' : 'primary'} onClick={() => closeConfirm(true)}>{confirmState.confirmLabel}</Btn>
            </div>
          </div>
        </div>
      )}
      {/* Bulles centrées, dimensionnées à leur contenu (jamais étirées pleine largeur) et
          plafonnées à max-w-sm : le message reste sur une seule ligne (ellipse au-delà),
          pour un rendu propre et uniforme quel que soit le texte. */}
      <div className="fixed bottom-4 inset-x-0 z-[80] flex flex-col items-center gap-2 px-4 pointer-events-none">
        {toasts.map(toast => (
          toast.type === 'undo' ? (
            <div key={toast.id} className={cx('pointer-events-auto max-w-[calc(100%-2rem)] sm:max-w-sm rounded-2xl pl-4 pr-2 py-2 text-sm shadow-lg flex items-center gap-3', t.panel, t.text, 'border', t.panelBorder)}>
              <span className="truncate">{toast.message}</span>
              <button onClick={() => handleUndo(toast.id)} className={cx('shrink-0 rounded-full px-3 py-1.5 text-sm font-semibold whitespace-nowrap', t.accent, t.soft)}>Annuler</button>
            </div>
          ) : (
            <div key={toast.id} className={cx('pointer-events-auto max-w-[calc(100%-2rem)] sm:max-w-sm rounded-2xl px-4 py-3 text-sm shadow-lg whitespace-pre-line',
              toast.type === 'error' ? 'bg-red-600 text-white' : toast.type === 'success' ? t.btnPrimary : cx(t.panel, t.text, 'border', t.panelBorder))}>
              {toast.message}
            </div>
          )
        ))}
      </div>
    </UIFeedbackContext.Provider>
  );
}

function EmptyState({ text, icon }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (
    <div className="text-center py-8">
      {icon && (
        <div className={cx('w-12 h-12 rounded-full mx-auto mb-3 flex items-center justify-center', t.soft)}>
          <Icon name={icon} size={22} className={t.textMuted} />
        </div>
      )}
      <div className={cx('text-sm', t.textMuted)}>{text}</div>
    </div>
  );
}

// tone permet de coder une pill de statut par couleur universelle (warning/info/success)
// plutôt que toujours la couleur d'accent — utile quand la valeur affichée EST une
// progression (à faire / en cours / fait) et pas juste une catégorie neutre.
function Pill({ children, tone = 'accent' }) {
  const { theme } = useTheme();
  const c = currentAccent;
  const toneCls = {
    accent: theme === 'sombre' ? `bg-${c}-500/15 text-${c}-300` : `bg-${c}-50 text-${c}-700`,
    warning: theme === 'sombre' ? 'bg-amber-500/15 text-amber-400' : 'bg-amber-50 text-amber-700',
    info: theme === 'sombre' ? 'bg-blue-500/15 text-blue-300' : 'bg-blue-50 text-blue-700',
    success: theme === 'sombre' ? 'bg-emerald-500/15 text-emerald-400' : 'bg-emerald-50 text-emerald-700',
    danger: theme === 'sombre' ? 'bg-red-500/15 text-red-400' : 'bg-red-50 text-red-700',
  }[tone];
  return <span className={cx('text-xs px-2 py-0.5 rounded-full font-medium whitespace-nowrap', toneCls)}>{children}</span>;
}

/* ================= Calculs intermittence ================= */

// asOfDate permet de projeter le même calcul à une date autre qu'aujourd'hui (ex. la
// date de réexamen des droits) — la fenêtre de 12 mois glissants s'ancre alors sur
// cette date plutôt que sur "maintenant", sans changer la formule elle-même.
function computeStats(cachets, asOfDate) {
  const now = asOfDate ? new Date(asOfDate) : new Date();
  const yearAgo = new Date(now); yearAgo.setDate(yearAgo.getDate() - 365);
  const recent = cachets.filter(cc => cc.dateDebut && new Date(cc.dateDebut) >= yearAgo && new Date(cc.dateDebut) <= now);

  const byMonth = {};
  recent.forEach(cc => {
    // Un contrat est SOIT en cachets SOIT en heures directes, jamais les deux à la
    // fois : le champ "Heures" du formulaire est réservé aux contrats sans cachet
    // ("si pas de cachets"). "Nombre de cachets" démarre à 1 par défaut sur chaque
    // nouveau cachet — sans cette exclusivité, une ligne en heures où ce 1 par défaut
    // n'aurait pas été effacé compterait deux fois (12h du cachet fantôme + les heures
    // saisies), faussant tout le calcul des 507h.
    if (Number(cc.heures) > 0) return;
    const key = cc.dateDebut.slice(0, 7);
    byMonth[key] = (byMonth[key] || 0) + (Number(cc.nbCachets) || 0);
  });
  // Plafond de 28 cachets/mois (Annexe X, art. 3§1) : quand le mois n'est que
  // partiellement compris dans la fenêtre glissante de 12 mois (le plus ancien et le
  // mois en cours), le plafond est proratisé au nombre de jours réellement compris,
  // au prorata de 28/20,8 — sinon on plafonnerait un mois partiel comme un mois plein.
  let cachetsComptes = 0;
  Object.entries(byMonth).forEach(([key, n]) => {
    const [y, m] = key.split('-').map(Number);
    const monthStart = new Date(y, m - 1, 1);
    const monthEnd = new Date(y, m, 0);
    const totalJoursMois = monthEnd.getDate();
    const debutFenetre = monthStart < yearAgo ? yearAgo : monthStart;
    const finFenetre = monthEnd > now ? now : monthEnd;
    const joursInclus = Math.max(0, Math.round((finFenetre - debutFenetre) / 86400000) + 1);
    const plafond = joursInclus >= totalJoursMois ? MAX_CACHETS_MOIS : Math.floor((MAX_CACHETS_MOIS / 20.8) * joursInclus);
    cachetsComptes += Math.min(n, plafond);
  });

  // Certains contrats sont déclarés en heures directes plutôt qu'en cachets (ex.
  // technicien, ou AEM qui ne renseigne que les heures) — elles comptent aussi
  // pour les 507h, sans passer par la conversion cachet -> 12h ni le plafond mensuel.
  const heuresDirectes = recent.reduce((s, cc) => s + (Number(cc.heures) || 0), 0);
  const heures = cachetsComptes * CACHET_HOURS + heuresDirectes;
  const cumulBrut = recent.reduce((s, cc) => s + (Number(cc.montantBrut) || 0), 0);
  const tauxHoraire = heures > 0 ? cumulBrut / heures : 0;
  const cachetsManquants = Math.max(0, Math.ceil((SEUIL_HEURES - heures) / CACHET_HOURS));
  const sjrEstime = cumulBrut / 365;

  const moisCourant = now.toISOString().slice(0, 7);
  const cachetsMoisCourant = byMonth[moisCourant] || 0;
  return { heures, heuresDirectes, cachetsComptes, cumulBrut, tauxHoraire, cachetsManquants, sjrEstime, cachetsMoisCourant };
}

// Récap par année civile (déclaration/impôts) — indépendant des 12 mois glissants
// utilisés pour les 507h, qui ne couvrent qu'une fenêtre récente.
function computeRecapAnnuel(cachets) {
  const byYear = {};
  cachets.forEach(cc => {
    if (!cc.dateDebut) return;
    const year = cc.dateDebut.slice(0, 4);
    if (!byYear[year]) byYear[year] = { nbCachets: 0, brut: 0 };
    // Une ligne en heures directes (voir computeStats) n'est pas un cachet.
    if (!(Number(cc.heures) > 0)) byYear[year].nbCachets += Number(cc.nbCachets) || 0;
    byYear[year].brut += Number(cc.montantBrut) || 0;
  });
  return Object.entries(byYear).map(([year, v]) => ({ year, ...v })).sort((a, b) => b.year.localeCompare(a.year));
}

// Découpe l'historique par "année d'intermittence" (d'une date de réexamen à la
// suivante) plutôt que par année civile — pour se retrouver dans son propre
// historique, PAS pour redéfinir l'éligibilité aux 507h : cette dernière reste
// toujours une fenêtre glissante de 12 mois évaluée à la date de réexamen
// (computeStats), qui est la règle officielle. Ceci est un tableau de référence.
function computeRecapParPeriode(cachets, reexamHistory) {
  const bounds = [...(reexamHistory || [])].filter(Boolean).sort();
  const periods = [];
  let prevBound = null;
  bounds.forEach((b, i) => {
    periods.push({ label: `Année d'intermittence ${i + 1}`, start: prevBound, end: b });
    prevBound = b;
  });
  periods.push({ label: 'Période en cours', start: prevBound, end: null });
  return periods.map(p => {
    const items = cachets.filter(cc => {
      if (!cc.dateDebut) return false;
      if (p.start && cc.dateDebut <= p.start) return false;
      if (p.end && cc.dateDebut > p.end) return false;
      return true;
    });
    // Même exclusivité cachets/heures directes que dans computeStats (voir plus haut) :
    // une ligne en heures ne doit pas aussi compter son "Nombre de cachets" par défaut.
    const heures = items.reduce((s, cc) => s + (Number(cc.heures) > 0 ? Number(cc.heures) : (Number(cc.nbCachets) || 0) * CACHET_HOURS), 0);
    const brut = items.reduce((s, cc) => s + (Number(cc.montantBrut) || 0), 0);
    // Somme réelle des cachets (une fiche peut en représenter plusieurs, ex. une AEM
    // groupée) — pas le nombre de fiches, sinon le total ne correspond pas à celui
    // affiché ailleurs (récap annuel, "Cachets (12 mois)").
    const nbCachets = items.reduce((s, cc) => s + (Number(cc.heures) > 0 ? 0 : (Number(cc.nbCachets) || 0)), 0);
    const tauxHoraire = heures > 0 ? brut / heures : 0;
    return { ...p, nbCachets, heures, brut, tauxHoraire };
  }).reverse();
}

/* ================= Parsing de texte théâtral ================= */

// Parsing inspiré du protocole CEAD (noms de personnages en capitales, didascalies
// attachées après une virgule ou entre parenthèses). Traite le texte paragraphe par
// paragraphe (séparés par une ligne vide) : un paragraphe qui commence par un nom
// détecté ouvre une nouvelle réplique, sinon il prolonge le personnage courant.
function parseScript(raw) {
  const NAME = "A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜŸÇ";
  const LOWER = "a-zàâäéèêëîïôöùûüÿç";
  // Nom de personnage : capitales, chiffres, apostrophe, tiret, espaces, et "/" pour
  // les libellés combinés type "NADYA/SPECTATRICE" (personnages du public, doublons...).
  const NAMECHARS = `[${NAME}][${NAME}0-9'’\\-\\/\\s]{0,40}?`;
  // Annotation parenthésée optionnelle juste après le nom : (off), (voix off), (à part)...
  const ANNOT = `(?:\\s*\\(([^()]{1,30})\\))?`;
  const cueOwnLine = new RegExp(`^(${NAMECHARS})${ANNOT}\\s*[:.]?\\s*$`);
  const cueWithDidascalie = new RegExp(`^(${NAMECHARS}),\\s*([${LOWER}][^${NAME}]*)(?:\\s+([${NAME}].*))?$`);
  const inlineColonRegex = new RegExp(`^(${NAMECHARS})${ANNOT}\\s*:\\s*(.+)$`);
  const inlineDashRegex = new RegExp(`^(${NAMECHARS})${ANNOT}\\s+[-–]\\s+(.+)$`);
  const spacedRegex = new RegExp(`^(${NAMECHARS})${ANNOT}\\s{2,}(\\S.*)$`);
  // Certains scripts (notamment plus récents ou traduits) n'écrivent pas le nom du
  // personnage tout en capitales : juste une majuscule initiale ("Indy :", "Léo -").
  // On l'accepte UNIQUEMENT devant ":" ou "-" explicite (jamais en ligne seule ni pour
  // une didascalie type virgule) pour ne jamais confondre une phrase ordinaire qui
  // commence par une majuscule avec un nom de personnage.
  const TITLECASE_WORD = `[${NAME}][${LOWER}'’\\-]{1,24}`;
  const TITLECASE_NAMECHARS = `${TITLECASE_WORD}(?:\\s${TITLECASE_WORD}){0,2}`;
  const inlineColonRegexTitle = new RegExp(`^(${TITLECASE_NAMECHARS})${ANNOT}\\s*:\\s*(.+)$`);
  const inlineDashRegexTitle = new RegExp(`^(${TITLECASE_NAMECHARS})${ANNOT}\\s+[-–]\\s+(.+)$`);

  // Une ligne entièrement entre parenthèses, ou entièrement en capitales (sans
  // minuscule), qui n'a pas matché de réplique : c'est une didascalie autonome ou un
  // titre/en-tête (ACTE, SCÈNE, "Lancer T1"...), pas la suite de la réplique en cours.
  const isFullyParenLine = (line) => /^\([^()]*\)$/.test(line);
  const isHeadingLine = (line) => {
    if (new RegExp(`[${LOWER}]`).test(line)) return false;
    if (!new RegExp(`[${NAME}]`).test(line)) return false;
    return line.length <= 70;
  };
  // Indications techniques courtes qui ne sont ni en capitales ni entre parenthèses
  // (repères de lumière, sections d'un même script) : "Lancer T1", "Présentation"...
  const STAGE_MARKERS = /^(présentation|distribution|note de mise en scène|lancer\s+t\d+|baisser\s+t\d+|remonter\s+(puis\s+)?baisser\s+t\d+|noir\.?|fin\.?)$/i;
  // Aucun personnage ne s'appelle "Acte", "Scène"... — un nom qui commence par un de
  // ces mots est toujours un repère de structure ("ACTE I - OUVERTURE", "Scène 3"),
  // même court, jamais une réplique — quel que soit le motif qui a matché la ligne.
  const STRUCTURE_WORD = /^(acte|scène|scene|chapitre|partie|prologue|épilogue|epilogue|tableau|entracte)\b/i;
  // Un script collé avec un en-tête façon fiche ("Titre : ...", "Auteur : ...") ne doit
  // jamais créer un personnage "Titre" ou "Auteur" — ce sont des métadonnées, jamais
  // une réplique, même quand la ligne a la forme d'une réplique ("NOM : texte").
  const METADATA_WORD = /^(titre|auteur|autrice|compagnie|metteur en scène|mise en scène|distribution|personnages?|résumé|synopsis)$/i;
  // Une voix depuis les coulisses reste le même personnage, juste depuis un autre
  // endroit de la scène : "LE PÈRE (VOIX OFF)", "LE PÈRE OFF", "LE PÈRE, EN COULISSE"...
  // ne doivent jamais créer un second personnage distinct de "LE PÈRE". Quand
  // l'indication est déjà entre parenthèses juste après le nom, ANNOT (ci-dessus) la
  // détache déjà — ceci couvre le cas où elle est écrite à la suite, sans parenthèses.
  const OFF_SUFFIX = /[\s,]+[\(\[]?\s*(voix\s+off|off|en\s+coulisses?|coulisses?|hors[\s-]?champ)\s*[\)\]]?\s*$/i;
  const stripOffSuffix = (nom) => {
    const m = nom.match(OFF_SUFFIX);
    if (!m) return { nom, off: '' };
    const rest = nom.slice(0, m.index).trim();
    return rest ? { nom: rest, off: m[1] } : { nom, off: '' };
  };
  // Balises explicites facultatives : quand les heuristiques ne suffisent pas (ex. une
  // didascalie en minuscules, sans parenthèses), l'utilisateur peut forcer le résultat
  // en préfixant la ligne. Prioritaire sur tout le reste, casse indifférente.
  const BRACKET_TAG = /^\[(titre|régie|regie|didascalie|note)\]\s*(.*)$/i;

  // Détecte si une ligne est une "réplique" (nom de personnage + éventuellement le
  // début de son texte). Appelé sur CHAQUE ligne (pas juste la 1re d'un paragraphe) :
  // beaucoup de scripts collent "NOM : réplique" ligne par ligne sans ligne vide entre
  // deux personnages, et s'arrêter à la 1re ligne fusionnait la 2e réplique dans la 1re.
  const matchCue = (line) => {
    const r = matchCueRaw(line);
    if (!r) return null;
    if (STRUCTURE_WORD.test(r.personnage) || METADATA_WORD.test(r.personnage)) return null;
    const { nom, off } = stripOffSuffix(r.personnage);
    if (off) {
      r.personnage = nom;
      if (r.didascalieEntree) r.didascalieEntree = off + ', ' + r.didascalieEntree;
      else r.annotation = r.annotation || off;
    }
    return r;
  };
  const matchCueRaw = (line) => {
    let m = line.match(inlineColonRegex);
    if (m) return { personnage: m[1].trim(), annotation: m[2] || '', reste: m[3].trim() };
    m = line.match(inlineDashRegex);
    // La suite doit contenir au moins une minuscule (vraie réplique), sinon on risque de
    // confondre un titre du style "ACTE I - LA FABRIQUE DES FANTÔMES" avec une réplique.
    if (m && new RegExp(`[${LOWER}]`).test(m[3])) return { personnage: m[1].trim(), annotation: m[2] || '', reste: m[3].trim() };
    m = line.match(cueWithDidascalie);
    if (m) {
      let didasc = m[2].trim();
      let reste = m[3] ? m[3].trim() : '';
      // Un seul mot court après la didascalie (ex. un nom propre cité dedans, "regardant
      // Léna.") ressemble plus à la fin de la didascalie qu'à une réplique : on ne le
      // détache pas. On ne coupe que quand la suite a plusieurs mots (vraie phrase).
      if (reste && !/\s/.test(reste) && reste.length <= 15) {
        didasc = (didasc + ' ' + reste).trim();
        reste = '';
      }
      return { personnage: m[1].trim(), annotation: '', didascalieEntree: didasc, reste };
    }
    m = line.match(cueOwnLine);
    // Un nom de personnage tient en peu de mots ; au-delà, une ligne toute en capitales
    // est bien plus probablement un titre/en-tête ("ACTE I - LA FABRIQUE DES FANTÔMES")
    // qu'un nom de personnage — on la laisse retomber sur la détection de titre.
    if (m && m[1].trim().split(/\s+/).length <= 5) return { personnage: m[1].trim(), annotation: m[2] || '', reste: '' };
    m = line.match(spacedRegex);
    if (m) return { personnage: m[1].trim(), annotation: m[2] || '', reste: m[3].trim() };
    m = line.match(inlineColonRegexTitle);
    if (m) return { personnage: m[1].trim(), annotation: m[2] || '', reste: m[3].trim() };
    m = line.match(inlineDashRegexTitle);
    if (m && new RegExp(`[${LOWER}]`).test(m[3])) return { personnage: m[1].trim(), annotation: m[2] || '', reste: m[3].trim() };
    return null;
  };

  const paragraphs = (raw || '').split(/\n\s*\n/);
  const blocks = [];
  let currentChar = null;

  for (const para of paragraphs) {
    const lines = para.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;

    let pending = null;
    const flush = () => {
      if (!pending) return;
      blocks.push({ id: uid(), personnage: pending.personnage, didascalieEntree: pending.didascalieEntree, texte: pending.texteParts.filter(Boolean).join(' ').trim(), note: '' });
      currentChar = pending.personnage;
      pending = null;
    };

    for (const line of lines) {
      const tagged = line.match(BRACKET_TAG);
      if (tagged) {
        flush();
        if (tagged[2]) blocks.push({ id: uid(), personnage: 'Didascalie', didascalieEntree: '', texte: tagged[2], note: '' });
        continue;
      }
      const cue = matchCue(line);
      if (cue) {
        flush();
        const didascalieEntree = cue.annotation ? `(${cue.annotation})` : (cue.didascalieEntree || '');
        pending = { personnage: cue.personnage, didascalieEntree, texteParts: cue.reste ? [cue.reste] : [] };
      } else if (isFullyParenLine(line) || isHeadingLine(line) || STAGE_MARKERS.test(line) || (STRUCTURE_WORD.test(line) && line.length <= 70) || (METADATA_WORD.test((line.split(/\s*[:\-–]\s*/)[0] || '').trim()) && line.length <= 120)) {
        flush();
        blocks.push({ id: uid(), personnage: 'Didascalie', didascalieEntree: '', texte: line, note: '' });
      } else if (pending) {
        pending.texteParts.push(line);
      } else {
        pending = { personnage: currentChar || 'Non attribué', didascalieEntree: '', texteParts: [line] };
      }
    }
    flush();
  }
  return blocks;
}

// Découpe un texte en segments pour l'affichage : les passages entre parenthèses
// (didascalies CEAD dans la réplique) ressortent en italique.
function renderTexteAvecDidascalies(texte) {
  const parts = (texte || '').split(/(\([^)]*\))/g);
  return parts.map((part, i) => /^\(.*\)$/.test(part) ? <em key={i}>{part}</em> : <React.Fragment key={i}>{part}</React.Fragment>);
}

// "(off)" vient d'une annotation entre parenthèses : on l'affiche telle quelle.
// "entrant" vient d'une didascalie CEAD après virgule : on rétablit la virgule.
function didascalieSeparator(text) {
  return text.startsWith('(') ? ' ' : ' , ';
}

// Icône représentative par type de cachet/contrat — reprise telle quelle partout où
// un type de contrat est affiché (fiche employeur, récap annuel, liste des cachets)

const TYPE_ICONS = { Tournage: 'film', 'Théâtre': 'book', 'Voix off': 'mic' };

const EXPERIENCE_TYPE_ICONS = { 'Long-métrage': 'film', 'Court-métrage': 'film', 'Série': 'play', 'Théâtre': 'book', 'Publicité': 'star', 'Voix off': 'mic', 'Autre': 'tag' };

// Couleurs de surlignage auto des répliques d'un personnage : fonds pastel clairs
// + texte forcé en gris très foncé, pour rester lisible quel que soit le thème
// (clair ou sombre) de l'appli — jamais de texte clair sur fond clair.
const HIGHLIGHT_COLORS = [
  { key: 'jaune', label: 'Jaune', bg: '#fde68a' },
  { key: 'vert', label: 'Vert', bg: '#bbf7d0' },

];
function highlightColorBg(key) {
  return (HIGHLIGHT_COLORS.find(c => c.key === key) || HIGHLIGHT_COLORS[0]).bg;
}
const HIGHLIGHT_TEXT_COLOR = '#1e293b';

// Onglets de lecture d'un texte : largeur égale pour tous (grid 4 colonnes), quel que
// soit la longueur du libellé — évite l'effet "tailles au hasard" de boutons empilés.
const READING_MODE_TABS = [
  { key: 'isoler', label: 'Isoler', icon: 'tag' },
  { key: 'lecture', label: 'Répéter', icon: 'mic' },
  { key: 'complet', label: 'Texte', icon: 'book' },
  { key: 'prompteur', label: 'Prompteur', icon: 'film' },
];

// Groupe de boutons façon "segmented control" avec un fond qui glisse d'un
// onglet à l'autre au lieu de changer de couleur d'un coup — mesure la position
// réelle du bouton actif (largeurs de colonnes non uniformes selon le libellé
// n'est plus un problème) et anime la transition avec CSS.
function SegmentedTabs({ items, activeKey, onChange, cols, indicatorClassName, activeTextClassName, inactiveTextClassName, labelClassName, gap = 'gap-1' }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const containerRef = useRef(null);
  const [rect, setRect] = useState(null);
  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const measure = () => {
      const activeIndex = items.findIndex(it => it.key === activeKey);
      const btn = el.querySelectorAll(':scope > button')[activeIndex];
      if (btn) setRect({ left: btn.offsetLeft, width: btn.offsetWidth });
    };
    measure();
    // Le Tailwind CDN génère ses classes (dont grid-cols-N) de façon asynchrone après
    // le premier rendu React : sans ce ResizeObserver, la mesure initiale peut avoir
    // lieu avant que la grille ne soit vraiment appliquée, et rester fausse ensuite
    // (indicateur trop large, tampon voisin caché derrière un fond blanc).
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, [activeKey, items]);
  const activeTextCls = activeTextClassName || (theme === 'sombre' ? 'text-[#0a0a0a]' : 'text-white');
  return (
    <div ref={containerRef} className={cx('relative grid', gap, `grid-cols-${cols}`)}>
      {rect && <div className={cx('absolute top-0 bottom-0 rounded-2xl transition-all duration-300 ease-out', indicatorClassName || t.btnPrimary)} style={{ left: rect.left, width: rect.width }} />}
      {items.map(it => (
        <button key={it.key} onClick={() => onChange(it.key)}
          className={cx('relative z-10 flex flex-col items-center justify-center gap-0.5 py-2.5 rounded-2xl text-center transition-colors active:scale-95 min-w-0', it.key === activeKey ? activeTextCls : (inactiveTextClassName || t.textMuted))}>
          <Icon name={it.icon} size={it.iconSize || 18} />
          <span className={labelClassName || 'text-[11px] font-semibold leading-none'}>{it.label}</span>
        </button>
      ))}
    </div>
  );
}

function estimerLecture(blocks) {
  const texteComplet = blocks.filter(b => b.personnage !== 'Didascalie').map(b => b.texte).join(' ');
  const mots = texteComplet.trim() ? texteComplet.trim().split(/\s+/).length : 0;
  return { mots, lent: Math.ceil(mots / 110), normal: Math.ceil(mots / 140), rapide: Math.ceil(mots / 170) };
}

// Anime un nombre de sa valeur précédente vers sa nouvelle valeur (au lieu d'un
// changement instantané) : les chiffres clés du tableau de bord semblent "vivants"
// à chaque mise à jour plutôt que de simplement sauter. easeOutCubic pour un
// ralenti naturel en fin de course.
function useCountUp(target, duration = 700) {
  const [value, setValue] = useState(target);
  const fromRef = useRef(target);
  useEffect(() => {
    const from = fromRef.current;
    const to = target;
    if (from === to) { setValue(to); return; }
    let raf;
    const start = performance.now();
    const ease = (p) => 1 - Math.pow(1 - p, 3);
    const tick = (now) => {
      const p = Math.min(1, (now - start) / duration);
      setValue(from + (to - from) * ease(p));
      if (p < 1) raf = requestAnimationFrame(tick);
      else fromRef.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return value;
}

function CountUpEuros({ value, className }) {
  const animated = useCountUp(value);
  return <span className={className}>{fmtEuros(animated)}</span>;
}

function CountUpInt({ value, className }) {
  const animated = useCountUp(value);
  return <span className={className}>{Math.round(animated)}</span>;
}

          return (
          <div className="mt-3">
            <div className="grid grid-cols-2 gap-3 text-center mb-3">
              <div className={cx('rounded-xl p-3', t.soft)}>
                <div className={cx('text-xs', t.textMuted)}>Estimée brute</div>
                <div className="text-2xl font-bold"><CountUpEuros value={alloc.ajFinale} /></div>
                <div className={cx('text-xs', t.textMuted)}>par jour</div>
              </div>

            {showAllocDetail && (

                  Formule officielle Annexe 10 (art. 14) : AJ = A + B + C, avec A = [31,96 × (0,36 × SR≤13 700 € + 0,05 × SR&gt;13 700 €)] ÷ 5 000, B = [31,96 × (0,26 × NH≤690 h + 0,08 × NH&gt;690 h)] ÷ 507, C = 31,96 × 0,70. Le net déduit ~7,5 % (CSG/CRDS + participation retraite) — variable selon ton revenu fiscal de référence, peut être réduit ou nul. Ces paramètres évoluent : vérifie avec le simulateur officiel France Travail si un doute.
                </div>

                Tu as <strong className={t.text}>{age} ans</strong> — à partir de 53 ans, la durée d'indemnisation peut être allongée (dispositif senior). Les seuils d'âge et la durée exacte de l'allongement dépendent de ta situation et changent régulièrement : vérifie les modalités précises avec France Travail plutôt que de te fier à un chiffre ici.
              </div>
            ) : null}
          </div>
          );
        })()}

      {recapAnnuel.length > 0 && (

          <>
            {sorted.length > 0 && (

                <IconBtn name="download" title="Exporter la liste des cachets (PDF)" onClick={exportCachetsPdf} />

              <input ref={scanRef} type="file" accept=".pdf" multiple onChange={scanBulletins} className="hidden" />

            {scanStatus && <div className={cx('text-xs mb-2', t.textMuted)}>{scanStatus}</div>}
            {sorted.length > 3 && (
              <>
                <div className="relative mb-2">
                  <Icon name="search" size={16} className={cx('absolute left-2.5 top-2.5', t.textMuted)} />
                  <TextInput placeholder="Rechercher un employeur, un projet…" value={searchCachet} onChange={(e) => setSearchCachet(e.target.value)} className="pl-8" />

                {moisDisponibles.length > 1 && (
                  <Select value={filterMois} onChange={(e) => setFilterMois(e.target.value)} className="mb-2">

                        <div className={cx('text-xs', t.textMuted)}>{[cc.employeur, fmtDate(cc.dateDebut)].filter(Boolean).join(' — ')}</div>
                        <div className="flex gap-1.5 mt-1.5 flex-wrap">

                          <ConfirmDeleteButton onConfirm={() => removeCachet(cc.id)} />

      </Card>

      {(data.dateFinDroits || data.reexamHistory.length > 0) && recapParPeriode.length > 0 && (
        <Card>
          <button className="w-full flex items-center justify-between gap-2" onClick={() => setShowRecapPeriode(s => !s)}>

                <Icon name="calendar" size={17} />
              </span>
              <span className="text-sm font-semibold truncate">Historique par année</span>
            </span>
            <Icon name={showRecapPeriode ? 'chevronUp' : 'chevronDown'} size={16} className={cx('shrink-0', t.textMuted)} />
          </button>
          {showRecapPeriode && (
            <div className="mt-3 space-y-2">
              {recapParPeriode.map((p, i) => {
                const isCurrent = p.label === 'Période en cours';
                return (
                <div key={i} className={cx('flex items-center justify-between rounded-lg p-2.5', isCurrent ? cx('border-l-4', `border-${currentAccent}-400`) : '', t.soft)}>
                  <div className="min-w-0">
                    <div className={cx('text-sm truncate', isCurrent ? 'font-semibold' : t.textMuted)}>{p.label}</div>
                    <div className={cx('text-xs', t.textMuted)}>{p.start ? `depuis le ${fmtDate(p.start)}` : 'depuis le début'}{p.end ? ` jusqu'au ${fmtDate(p.end)}` : ''}</div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className={cx('text-sm', isCurrent ? 'font-semibold' : t.textMuted)}>{p.heures}h</div>
                    <div className={cx('text-xs', t.textMuted)}>{p.nbCachets} cachet(s){p.tauxHoraire > 0 ? ` · ${fmtEuros(p.tauxHoraire)}/h` : ''}</div>

                </div>
                );
              })}
              <div className={cx('text-xs rounded-lg p-2.5', t.soft, t.textMuted)}>Historique pour t'y retrouver d'une année d'intermittence à l'autre — l'éligibilité aux 507h reste toujours calculée sur les 12 derniers mois glissants (ci-dessus), qui est la règle officielle.</div>
            </div>
          )}
        </Card>
      )}

      {modal && (
        <Modal title={modal.editingId ? 'Modifier le cachet' : 'Nouveau cachet'} onClose={() => setModal(null)}>
          {modal.isDraft && <div className={cx('rounded-lg p-2 text-xs mb-3', t.soft, t.accent)}>⚠️ Champs pré-remplis à partir du PDF — vérifie chaque valeur avant d'enregistrer.</div>}
          <CachetForm initial={modal.draft || (modal.editingId ? data.cachets.find(c => c.id === modal.editingId) : null)} employeurs={data.employeurs} onSave={upsertCachet} onCancel={() => setModal(null)} />
        </Modal>
      )}
      {empModal && (
        <Modal title={empModal.editingId ? "Modifier l'employeur" : 'Nouvel employeur'} onClose={() => setEmpModal(null)}>
          <EmployeurForm initial={empModal.editingId ? data.employeurs.find(e => e.id === empModal.editingId) : null} onSave={upsertEmployeur} onCancel={() => setEmpModal(null)} />
        </Modal>
      )}
      {bulkDrafts && (
        <BulkAemImportModal drafts={bulkDrafts} onToggle={toggleBulkDraft} onConfirm={confirmBulkImport} onClose={() => setBulkDrafts(null)} />
      )}
    </div>
  );
}

function CastingsTab({ data, setData }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [modal, setModal] = useState(null);
  const [repModal, setRepModal] = useState(null);
  const [showReps, setShowReps] = useState(false);
  const structures = useMemo(() => Array.from(new Set([...data.castings.map(c => c.structure), ...data.employeurs.map(e => e.nom)].filter(Boolean))), [data.castings, data.employeurs]);

  const upsert = (v) => {
    const prev = modal.editingId ? data.castings.find(c => c.id === modal.editingId) : null;
    const becameObtenu = v.statut === 'Obtenu' && (!prev || prev.statut !== 'Obtenu');
    setData(d => ({ ...d, castings: modal.editingId ? d.castings.map(c => c.id === modal.editingId ? { ...c, ...v } : c) : [...d.castings, { id: uid(), ...v }] }));
    setModal(null);
    if (becameObtenu) setRepModal({ editingId: null, draft: { titre: v.projet, lieu: v.structure || '', date: '', heure: '' } });
  };
  const remove = (id) => setData(d => ({ ...d, castings: d.castings.filter(c => c.id !== id) }));

  const upsertRep = (v) => {
    setData(d => ({ ...d, representations: repModal.editingId ? d.representations.map(r => r.id === repModal.editingId ? { ...r, ...v } : r) : [...d.representations, { id: uid(), ...v }] }));
    setRepModal(null);
  };
  const removeRep = (id) => setData(d => ({ ...d, representations: d.representations.filter(r => r.id !== id) }));

  const today = new Date().toISOString().slice(0, 10);
  const sorted = [...data.castings].sort((a, b) => (b.dateEnvoi || '').localeCompare(a.dateEnvoi || ''));
  const upcomingReps = [...data.representations].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  return (
    <div className="space-y-3 pb-4">
      <Card>
        <button className="w-full flex items-center justify-between gap-2" onClick={() => setShowReps(s => !s)}>
          <span className="flex items-center gap-2.5 min-w-0">
            <span className={cx('shrink-0 w-9 h-9 rounded-2xl flex items-center justify-center', theme === 'sombre' ? `bg-${currentAccent}-500/15 text-${currentAccent}-400` : `bg-${currentAccent}-50 text-${currentAccent}-700`)}>
              <Icon name="calendar" size={17} />
            </span>
            <span className="text-sm font-semibold truncate">Prochaines dates{upcomingReps.length > 0 ? ` (${upcomingReps.length})` : ''}</span>
          </span>
          <Icon name={showReps ? 'chevronUp' : 'chevronDown'} size={16} className={cx('shrink-0', t.textMuted)} />

                  <Icon name="film" size={16} />

                <div className="flex items-start justify-between gap-2 flex-1 min-w-0">
                  <div className="min-w-0">
                    <div className="font-medium truncate">{c.projet}</div>

                    <div className="flex gap-1.5 mt-1.5 flex-wrap items-center">

                      <span className={cx('text-xs', t.textMuted)}>{fmtDate(c.dateEnvoi)}</span>
                      {c.dateRelance && c.dateRelance <= today && <Pill>🔔 Relancer</Pill>}

                  </div>
                  <div className="flex gap-0.5 shrink-0">
                    <IconBtn name="edit" onClick={() => setModal({ editingId: c.id })} />

      {modal && (
        <Modal title={modal.editingId ? 'Modifier le casting' : 'Nouveau casting'} onClose={() => setModal(null)}>
          <CastingForm initial={modal.editingId ? data.castings.find(c => c.id === modal.editingId) : null} structures={structures} onSave={upsert} onCancel={() => setModal(null)} />
        </Modal>
      )}
      {repModal && (
        <Modal title={repModal.editingId ? 'Modifier la date' : 'Nouvelle date'} onClose={() => setRepModal(null)}>
          {repModal.draft && <div className={cx('rounded-lg p-2 text-xs mb-3', t.soft, t.accent)}>🎉 Casting obtenu — ajoute une première date de représentation (tu pourras en ajouter d'autres ensuite).</div>}
          <RepresentationForm initial={repModal.draft || (repModal.editingId ? data.representations.find(r => r.id === repModal.editingId) : null)} onSave={upsertRep} onCancel={() => setRepModal(null)} />
        </Modal>
      )}
    </div>
  );
}

function ContactForm({ initial, categories, existingContacts, editingId, onSave, onCancel, onExport }) {
  const [v, setV] = useState(initial || { nom: '', fonction: '', categorie: categories[0] || 'Perso', telephone: '', email: '', site: '', adresse: '', notes: '' });
  const [newCat, setNewCat] = useState('');
  const set = (k) => (e) => setV({ ...v, [k]: e.target.value });

  const dup = findDuplicateContact(v, existingContacts, editingId);

  return (
    <div className="space-y-3">
      <Field label="Nom"><TextInput value={v.nom} onChange={set('nom')} /></Field>
      {dup && <div className={cx('rounded-lg p-2 text-xs', 'bg-amber-500/15 text-amber-600')}>⚠️ Un contact similaire existe déjà : <strong>{dup.nom}</strong> (même nom, téléphone ou email). Vérifie qu'il ne s'agit pas d'un doublon.</div>}
      <Field label="Fonction"><TextInput value={v.fonction} onChange={set('fonction')} /></Field>
      <Field label="Catégorie">
        <div className="flex gap-2">
          <Select value={v.categorie} onChange={set('categorie')} className="flex-1">
            {categories.map(c => <option key={c} value={c}>{c}</option>)}
          </Select>
        </div>
        <div className="flex gap-2 mt-2">
          <TextInput placeholder="Nouvelle catégorie…" value={newCat} onChange={(e) => setNewCat(e.target.value)} />
          <Btn variant="ghost" onClick={() => { if (newCat.trim()) { setV({ ...v, categorie: newCat.trim() }); setNewCat(''); } }}>+</Btn>
        </div>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Téléphone"><TextInput type="tel" value={v.telephone} onChange={set('telephone')} /></Field>
        <Field label="Email"><TextInput type="email" value={v.email} onChange={set('email')} /></Field>
      </div>
      <Field label="Site web"><TextInput value={v.site} onChange={set('site')} /></Field>
      <Field label="Adresse"><TextInput value={v.adresse} onChange={set('adresse')} placeholder="Pour ouvrir l'itinéraire depuis la fiche" /></Field>
      <Field label="Notes"><TextArea rows={2} value={v.notes} onChange={set('notes')} /></Field>
      {onExport && <Btn variant="ghost" className="w-full" onClick={onExport}><Icon name="download" size={16} />Exporter vers les contacts du téléphone (.vcf)</Btn>}
      <div className="flex justify-end gap-2 pt-2">
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
        <Btn disabled={!v.nom.trim()} onClick={() => onSave({ ...v, nom: v.nom.trim() })}><Icon name="check" size={16} />Enregistrer</Btn>
      </div>
    </div>
  );
}
