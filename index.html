/* ================= Onglet Textes / Répétition ================= */

function MaskableText({ texte, masked, className = '' }) {
  const { theme } = useTheme();
  const [revealed, setRevealed] = useState({});
  useEffect(() => { setRevealed({}); }, [texte, masked]);
  if (!masked) return <span className={className}>{renderTexteAvecDidascalies(texte)}</span>;
  const words = (texte || '').split(/(\s+)/);
  return (
    <span className={className}>
      {words.map((w, i) => /^\s+$/.test(w) ? w : (
        <span key={i} onClick={() => setRevealed(r => ({ ...r, [i]: !r[i] }))}
          className={cx('cursor-pointer rounded px-0.5', revealed[i] ? '' : (theme === 'sombre' ? 'bg-slate-600 text-slate-600' : 'bg-slate-300 text-slate-300'))}>
          {w}
        </span>
      ))}
    </span>
  );
}

function RehearsalPlayer({ blocks: allBlocks, monPersonnage, rate, volume }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  // Les didascalies (indications de jeu autonomes, titres...) ne sont jamais lues à
  // voix haute ni comptées comme une réplique d'un personnage pendant la répétition.
  const blocks = useMemo(() => allBlocks.filter(b => b.personnage !== 'Didascalie'), [allBlocks]);
  const [index, setIndex] = useState(0);
  const [playing, setPlaying] = useState(false);
  const voiceRef = useRef(null);

  useEffect(() => {
    function pick() {
      const voices = window.speechSynthesis.getVoices();
      voiceRef.current = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) || voices[0] || null;
    }
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
    return () => window.speechSynthesis.cancel();
  }, []);

  const current = blocks[index];
  const isMine = current && current.personnage === monPersonnage;
  const finished = index >= blocks.length;

  useEffect(() => {
    if (!playing || !current) return;
    if (isMine) { setPlaying(false); return; }
    if (!current.texte.trim()) { setIndex(i => i + 1); return; }
    const utt = new SpeechSynthesisUtterance(current.texte);
    utt.lang = 'fr-FR';
    if (voiceRef.current) utt.voice = voiceRef.current;
    utt.rate = rate; utt.volume = volume;
    utt.onend = () => setIndex(i => i + 1);
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utt);
    return () => window.speechSynthesis.cancel();
  }, [playing, index, current, isMine, rate, volume]);

  if (!blocks.length) return <EmptyState text="Aucune réplique détectée. Vérifie l'import du texte." />;

  return (
    <div className="space-y-3">
      <div className={cx('rounded-2xl p-4 min-h-[110px] shadow-sm', isMine ? cx(t.soft, 'ring-2', theme === 'sombre' ? `ring-${currentAccent}-400/40` : `ring-${currentAccent}-300`) : t.panel)}>
        {finished ? <div className="text-center font-medium">Fin du texte 🎬</div> : (
          <>
            <div className={cx('text-xs font-bold mb-1 uppercase tracking-wide', isMine ? t.accent : t.textMuted)}>
              {current.personnage}{isMine && ' (toi)'}
              {current.didascalieEntree && <span className="italic font-normal normal-case">{didascalieSeparator(current.didascalieEntree)}{current.didascalieEntree}</span>}
            </div>
            <div className="font-script text-base leading-[1.7]">{renderTexteAvecDidascalies(current.texte)}</div>
          </>
        )}
      </div>
      <div className="flex items-center justify-center gap-3">
        <IconBtn name="arrowLeft" title="Précédent" onClick={() => { window.speechSynthesis.cancel(); setIndex(i => Math.max(0, i - 1)); }} />
        {isMine && !finished ? (
          <Btn onClick={() => setIndex(i => i + 1)}><Icon name="check" size={16} />C'est dit, suivant</Btn>
        ) : (
          <IconBtn name={playing ? 'pause' : 'play'} title={playing ? 'Pause' : 'Lecture'} onClick={() => { if (playing) window.speechSynthesis.cancel(); setPlaying(p => !p); }} className="scale-125" />
        )}
        <IconBtn name="skip" title="Suivant" onClick={() => { window.speechSynthesis.cancel(); setIndex(i => Math.min(blocks.length, i + 1)); }} />
      </div>
      <div className={cx('text-xs text-center', t.textMuted)}>{Math.min(index + 1, blocks.length)} / {blocks.length}</div>
    </div>
  );
}

function Teleprompter({ blocks, fontSize, onToggleHighlight, surlignagePerso, surlignageCouleur, focusPerso }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [speed, setSpeed] = useState(60); // pixels / seconde
  const [running, setRunning] = useState(false);
  const scrollRef = useRef(null);
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);
  const speedRef = useRef(speed);
  speedRef.current = speed;

  // requestAnimationFrame + delta de temps réel plutôt qu'un setInterval à pas fixe
  // de 1px : ça découple la vitesse de défilement de la fréquence du minuteur (qui
  // plafonne vite dans un navigateur), donc on peut aller bien plus vite, sans à-coups.
  useEffect(() => {
    if (!running) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current != null && scrollRef.current) {
        const dt = (ts - lastTsRef.current) / 1000;
        scrollRef.current.scrollTop += speedRef.current * dt;
      }
      lastTsRef.current = ts;
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); lastTsRef.current = null; };
  }, [running]);

  return (
    <div className="space-y-3">
      <div className="flex items-center gap-3">
        <Btn onClick={() => setRunning(r => !r)}><Icon name={running ? 'pause' : 'play'} size={16} />{running ? 'Stop' : 'Défiler'}</Btn>
        <Field label={'Vitesse (' + speed + ' px/s)'} className="flex-1">
          <input type="range" min="10" max="500" step="10" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="w-full" />
        </Field>
      </div>
      <div ref={scrollRef} className={cx('rounded-2xl p-4 h-[32rem] overflow-y-auto shadow-sm', t.panel)} style={{ fontSize: fontSize + 'px' }}>
        {blocks.map(b => <ScriptLine key={b.id} b={b} t={t} theme={theme} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePerso} surlignageCouleur={surlignageCouleur} focusPerso={focusPerso} />)}
      </div>
    </div>
  );
}

// Format "script" classique du théâtre français : nom du personnage centré en
// capitales au-dessus de la réplique, texte en continu (pas de bulle de chat) —
// remplace l'ancien style "carte" par bloc, qui ressemblait à une messagerie.
function ScriptLine({ b, t, theme, showNote, onNoteChange, onToggleHighlight, surlignagePerso, surlignageCouleur, focusPerso }) {
  const isDidascalie = b.personnage === 'Didascalie';
  if (isDidascalie) {
    return (
      <div className={cx('flex items-center gap-3 my-5', t.textMuted)}>
        <div className={cx('flex-1 h-px', t.panelBorder, 'border-t')} />
        <div className="font-script text-xs italic tracking-wide text-center shrink-0 max-w-[80%]">{b.texte}</div>
        <div className={cx('flex-1 h-px', t.panelBorder, 'border-t')} />
      </div>
    );
  }
  const isCharHighlighted = !!surlignagePerso && b.personnage === surlignagePerso;
  const isDimmed = !!focusPerso && b.personnage !== focusPerso && !isCharHighlighted;
  const wrapStyle = isCharHighlighted ? { backgroundColor: highlightColorBg(surlignageCouleur) } : undefined;
  const textStyle = isCharHighlighted ? { color: HIGHLIGHT_TEXT_COLOR } : undefined;
  return (
    <div id={'sl-' + b.id} className={cx('my-5 py-1.5 px-2.5 -mx-2.5 rounded-xl transition-all', b.highlighted && 'border-l-4 border-amber-400 pl-3.5', b.highlighted && !isCharHighlighted && 'bg-amber-400/15', isCharHighlighted && 'shadow-sm', isDimmed && 'opacity-35 hover:opacity-100')} style={wrapStyle}>
      <div className="flex items-center justify-center gap-1.5">
        <div className={cx('text-center font-bold uppercase tracking-wide text-[13px]', !isCharHighlighted && t.text)} style={textStyle}>
          {b.personnage}
          {b.didascalieEntree && <span className="font-script italic font-normal normal-case tracking-normal" style={textStyle}>{didascalieSeparator(b.didascalieEntree)}{b.didascalieEntree}</span>}
        </div>
        {onToggleHighlight && (
          <button onClick={() => onToggleHighlight(b.id)} title="Marquer cette réplique" className={cx('shrink-0', b.highlighted ? 'text-amber-600' : (!isCharHighlighted && t.textMuted))} style={isCharHighlighted && !b.highlighted ? { color: HIGHLIGHT_TEXT_COLOR, opacity: 0.6 } : undefined}>
            <Icon name="tag" size={14} />
          </button>
        )}
      </div>
      <div className="font-script leading-[1.7] mt-1.5" style={textStyle}>{renderTexteAvecDidascalies(b.texte)}</div>
      {showNote && (
        <div className="flex justify-center mt-2.5">
          <div className={cx('flex items-center gap-1.5 rounded-full px-3 py-1 max-w-full', b.note ? 'bg-amber-400/15' : cx('border border-dashed', t.panelBorder))}>
            <Icon name="edit" size={11} className={b.note ? 'text-amber-600 shrink-0' : cx(t.textMuted, 'shrink-0')} />
            <input value={b.note || ''} onChange={(e) => onNoteChange(b.id, e.target.value)} placeholder="note de régie"
              size={b.note ? Math.min(b.note.length, 60) : 11}
              className={cx('text-xs italic bg-transparent border-0 outline-none text-center min-w-0', b.note ? 'text-amber-700' : t.textMuted, theme === 'sombre' && b.note && '!text-amber-300')} />
          </div>
        </div>
      )}
    </div>
  );
}

function IsolatedView({ blocks, monPersonnage, personnages, onChangePersonnage, fontSize, masked, showNotes, onNoteChange }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const switcher = personnages && personnages.length > 0 && (
    <div className="flex flex-wrap gap-1.5 mb-3">
      <button onClick={() => onChangePersonnage('')}
        className={cx('shrink-0 whitespace-nowrap text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1', !monPersonnage ? t.btnPrimary : cx(t.soft, t.textMuted))}>
        <Icon name="x" size={12} />Tous les personnages
      </button>
      {personnages.map(p => (
        <button key={p} onClick={() => onChangePersonnage(p)}
          className={cx('shrink-0 whitespace-nowrap text-xs px-3 py-1.5 rounded-full font-medium', p === monPersonnage ? t.btnPrimary : cx(t.soft, t.textMuted))}>
          {p}
        </button>
      ))}
    </div>
  );
  if (!monPersonnage) return <div>{switcher}<EmptyState text="Choisis d'abord ton personnage ci-dessus pour isoler ses répliques." /></div>;
  const mine = blocks.filter(b => b.personnage === monPersonnage);
  if (!mine.length) return <div>{switcher}<EmptyState text="Aucune réplique trouvée pour ce personnage — vérifie l'onglet Corriger." /></div>;
  return (
    <div className="space-y-2" style={{ fontSize: fontSize + 'px' }}>
      {switcher}
      <div className={cx('text-xs mb-1', t.textMuted)} style={{ fontSize: 12 }}>{mine.length} réplique(s) isolée(s) pour <strong className={t.accent}>{monPersonnage}</strong>, dans l'ordre du texte.</div>
      {mine.map((b, i) => (
        <div key={b.id} className={cx('rounded-xl p-3', t.soft)}>
          <div className={cx('font-bold mb-1', t.accent)} style={{ fontSize: 11 }}>Réplique {i + 1}</div>
          <div className="font-script leading-[1.7]"><MaskableText texte={b.texte} masked={masked} /></div>
          {showNotes && (
            <input value={b.note || ''} onChange={(e) => onNoteChange(b.id, e.target.value)} placeholder="+ note de régie"
              className={cx('mt-2 w-full italic bg-transparent border-0 border-b outline-none pb-1', t.panelBorder, t.textMuted)} style={{ fontSize: 12 }} />
          )}

function TexteCompletView({ blocks, fontSize, showNotes, onNoteChange, onToggleHighlight, surlignagePerso, surlignageCouleur, focusPerso }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (
    <div style={{ fontSize: fontSize + 'px' }}>
      {blocks.map(b => <ScriptLine key={b.id} b={b} t={t} theme={theme} showNote={showNotes} onNoteChange={onNoteChange} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePerso} surlignageCouleur={surlignageCouleur} focusPerso={focusPerso} />)}
    </div>
  );
}

function SceneTimer() {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [ms, setMs] = useState(0);
  const [running, setRunning] = useState(false);
  useEffect(() => {
    if (!running) return;
    const start = Date.now() - ms;
    const id = setInterval(() => setMs(Date.now() - start), 250);
    return () => clearInterval(id);
  }, [running]);
  const totalSec = Math.floor(ms / 1000);
  const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
  const ss = String(totalSec % 60).padStart(2, '0');
  return (
    <div className="flex items-center gap-3">
      <div className={cx('text-2xl font-mono font-bold tabular-nums', t.accent)}>{mm}:{ss}</div>
      <Btn variant={running ? 'danger' : 'primary'} onClick={() => setRunning(r => !r)}>{running ? 'Pause' : 'Démarrer'}</Btn>
      <Btn variant="ghost" onClick={() => { setRunning(false); setMs(0); }}>Reset</Btn>
    </div>
  );
}

// Plein écran en overlay CSS (position fixed) plutôt que l'API Fullscreen native :
// sur mobile (surtout iOS Safari) requestFullscreen() sur un élément quelconque
// ne fonctionne pas ou pas de façon fiable — un overlay maison marche partout et
// garantit un bouton de fermeture toujours visible et accessible d'un tap.
function FullscreenReader({ mode, texte, personnages, monPersonnage, onChangePersonnage, fontSize, setFontSize, masked, setMasked, onNoteChange, onToggleHighlight, surlignagePerso, surlignageCouleur, focusPerso, onClose }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (
    <div className={cx('fixed inset-0 z-50 overflow-y-auto modal-backdrop', t.bg)}>
      <div className={cx('sticky top-0 z-10 flex items-center gap-2 px-3 py-2.5 shadow-sm', t.panel)}>
        <input type="range" min="14" max="32" value={fontSize} onChange={(e) => setFontSize(Number(e.target.value))} className="w-20 shrink-0" />
        {mode !== 'prompteur' && mode !== 'original' && (
          <button onClick={() => setMasked(m => !m)} className={cx('text-xs px-2.5 py-1.5 rounded-full font-medium shrink-0 whitespace-nowrap', masked ? t.btnPrimary : cx(t.soft, t.textMuted))}>Cache-mot</button>
        )}
        <div className="flex-1" />
        <button onClick={onClose} title="Fermer le plein écran" className={cx('p-2.5 rounded-full shrink-0', t.soft)}><Icon name="x" size={20} /></button>
      </div>
      <div className="max-w-xl mx-auto px-4 py-4">
        {mode === 'isoler' && <IsolatedView blocks={texte.blocks} monPersonnage={monPersonnage} personnages={personnages} onChangePersonnage={onChangePersonnage} fontSize={fontSize} masked={masked} showNotes={true} onNoteChange={onNoteChange} />}
        {mode === 'complet' && <TexteCompletView blocks={texte.blocks} fontSize={fontSize} showNotes={true} onNoteChange={onNoteChange} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePerso} surlignageCouleur={surlignageCouleur} focusPerso={focusPerso} />}
        {mode === 'prompteur' && <Teleprompter blocks={texte.blocks} fontSize={fontSize} onToggleHighlight={onToggleHighlight} surlignagePerso={surlignagePerso} surlignageCouleur={surlignageCouleur} focusPerso={focusPerso} />}
        {mode === 'original' && <div className="whitespace-pre-wrap leading-relaxed" style={{ fontSize: fontSize + 'px' }}>{texte.original}</div>}
      </div>
    </div>
  );
}

function TexteDetail({ texte, dossiers, onUpdate, onBack, rate, volume, onRateChange, onVolumeChange }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [mode, setMode] = useState('isoler');
  const [fontSize, setFontSize] = useState(18);
  const [masked, setMasked] = useState(false);
  const [showTimer, setShowTimer] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const [showHighlightPanel, setShowHighlightPanel] = useState(false);
  const [modeFocus, setModeFocus] = useState(false);
  const [newDossier, setNewDossier] = useState('');
  const [fullscreen, setFullscreen] = useState(false);
  const personnages = useMemo(() => Array.from(new Set(texte.blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie'), [texte.blocks]);
  const lecture = useMemo(() => estimerLecture(texte.blocks), [texte.blocks]);

  const reassign = (blockId, newChar) => {
    const blocks = texte.blocks.map(b => b.id === blockId ? { ...b, personnage: newChar } : b);
    const personnages = Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
    onUpdate({ ...texte, blocks, personnages });
  };
  const setNote = (blockId, note) => {
    onUpdate({ ...texte, blocks: texte.blocks.map(b => b.id === blockId ? { ...b, note } : b) });
  };
  const toggleHighlight = (blockId) => {
    onUpdate({ ...texte, blocks: texte.blocks.map(b => b.id === blockId ? { ...b, highlighted: !b.highlighted } : b) });
  };
  // Signets = répliques marquées (icône étiquette) : repères rapides vers une entrée,
  // une réplique clé... Cliquer y saute directement dans le Texte complet.
  const signets = useMemo(() => texte.blocks.filter(b => b.highlighted), [texte.blocks]);
  const jumpToSignet = (blockId) => {
    if (mode !== 'complet' && mode !== 'prompteur') setMode('complet');
    setTimeout(() => {
      const el = document.getElementById('sl-' + blockId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
  };
  // Le texte a été analysé une fois à l'import ; les améliorations du détecteur ne
  // s'appliquent pas rétroactivement aux textes déjà importés tant qu'on ne relance
  // pas l'analyse explicitement (sinon on écraserait en silence des corrections
  // manuelles faites depuis dans l'onglet Corriger).
  const reparse = () => {
    const source = texte.original || texte.contenu;
    if (!window.confirm("Relancer l'analyse automatique avec le moteur actuel ? Les réattributions manuelles, notes de régie et marquages faits dans l'onglet Corriger seront perdus (le surlignage par personnage et \"Mon personnage\" seront réappliqués si le nom existe encore).")) return;
    const blocks = parseScript(source);
    const personnages = Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
    onUpdate({ ...texte, blocks, personnages });
  };

  // Export papier : même distinction visuelle nom / réplique / didascalie qu'à
  // l'écran, mais en noir sur blanc, sans les contrôles interactifs.
  const exportTextePdf = () => {
    const el = document.getElementById('print-root');
    el.innerHTML = '';
    const accent = '#0f766e';
    const meta = [texte.auteur, texte.compagnie].filter(Boolean).join(' · ');
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family: Georgia, "Source Serif 4", serif; color:#1a1a1a; max-width:700px; line-height:1.6; font-size:13.5px;';
    wrap.innerHTML = `
      <div style="text-align:center;border-bottom:2px solid ${accent};padding-bottom:14px;margin-bottom:22px;">
        <div style="font-family:Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;">${texte.titre}</div>
        ${meta ? `<div style="font-family:Helvetica,Arial,sans-serif;font-size:13px;color:${accent};font-weight:600;margin-top:4px;">${meta}</div>` : ''}
        <div style="font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#888;margin-top:6px;">${personnages.join(', ')} — ${lecture.mots} mots</div>
      </div>
      ${texte.blocks.map(b => {
        if (b.personnage === 'Didascalie') {
          return `<div style="text-align:center;font-style:italic;color:#777;font-size:12.5px;margin:20px 0;letter-spacing:0.3px;">${b.texte}</div>`;
        }
        const didascHtml = b.didascalieEntree ? ` <span style="font-style:italic;font-weight:normal;text-transform:none;letter-spacing:0;">${b.didascalieEntree.startsWith('(') ? b.didascalieEntree : ', ' + b.didascalieEntree}</span>` : '';
        return `
          <div style="margin:16px 0;page-break-inside:avoid;">
            <div style="text-align:center;font-family:Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;font-size:12.5px;">${b.personnage}${didascHtml}</div>
            <div style="margin-top:4px;">${b.texte}</div>
          </div>
        `;
      }).join('')}
    `;
    el.appendChild(wrap);
    setTimeout(() => window.print(), 50);
  };

  const readingModes = mode === 'isoler' || mode === 'complet' || mode === 'prompteur' || mode === 'original';

  return (

        <button className={cx('w-full flex items-center justify-between pt-2 border-t', t.panelBorder)} onClick={() => setShowDetails(s => !s)}>

              {mode !== 'complet' && mode !== 'prompteur' && (

        )}

        {mode === 'prompteur' && (
          <Card className="mt-0"><Teleprompter blocks={texte.blocks} fontSize={fontSize} onToggleHighlight={toggleHighlight} surlignagePerso={texte.surlignagePerso} surlignageCouleur={texte.surlignageCouleur} focusPerso={modeFocus ? texte.monPersonnage : ''} /></Card>
        )}

        {mode === 'original' && (
          <Card className="mt-0">
            <div className={cx('text-xs mb-2', t.textMuted)}>Texte tel qu'importé, avant analyse — utile pour vérifier un passage si le découpage automatique s'est trompé.</div>
            <div className={cx('rounded-2xl p-4 h-[32rem] overflow-y-auto leading-relaxed whitespace-pre-wrap shadow-sm', t.panel)} style={{ fontSize: fontSize + 'px' }}>{texte.original}</div>
          </Card>
        )}
      </div>

      {fullscreen && (
        <FullscreenReader mode={mode} texte={texte} personnages={personnages} monPersonnage={texte.monPersonnage}
          onChangePersonnage={(p) => onUpdate({ ...texte, monPersonnage: p })}
          fontSize={fontSize} setFontSize={setFontSize} masked={masked} setMasked={setMasked}
          onNoteChange={setNote} onToggleHighlight={toggleHighlight} surlignagePerso={texte.surlignagePerso} surlignageCouleur={texte.surlignageCouleur} focusPerso={modeFocus ? texte.monPersonnage : ''} onClose={() => setFullscreen(false)} />
      )}

      {mode === 'lecture' && (
        <Card>
          <div className="grid grid-cols-2 gap-3 mb-3">
            <Field label={'Vitesse (' + rate.toFixed(1) + 'x)'}>
              <input type="range" min="0.5" max="2" step="0.1" value={rate} onChange={(e) => onRateChange(Number(e.target.value))} className="w-full" />
            </Field>
            <Field label={'Volume (' + Math.round(volume * 100) + '%)'}>
              <input type="range" min="0" max="1" step="0.1" value={volume} onChange={(e) => onVolumeChange(Number(e.target.value))} className="w-full" />
            </Field>
          </div>
          {texte.monPersonnage ? (
            <RehearsalPlayer blocks={texte.blocks} monPersonnage={texte.monPersonnage} rate={rate} volume={volume} />
          ) : <EmptyState text="Choisis d'abord ton personnage ci-dessus." />}
        </Card>
      )}

      {mode === 'correction' && (
        <Card>
          <div className={cx('text-xs mb-3', t.textMuted)}>Réattribue une réplique si le découpage automatique s'est trompé, ou marque-la comme didascalie (indication de jeu, pas une réplique).</div>
          <div className={cx('flex items-center justify-between gap-2 mb-3 p-2.5 rounded-xl', t.soft)}>
            <div className="text-xs">Texte importé avant une mise à jour du détecteur ? <span className={t.textMuted}>Relance l'analyse pour bénéficier des dernières corrections.</span></div>
            <Btn variant="ghost" className="shrink-0 whitespace-nowrap" onClick={reparse}><Icon name="undo" size={14} />Réanalyser</Btn>
          </div>
          <div className="space-y-2 max-h-96 overflow-y-auto">
            {texte.blocks.map(b => (
              <div key={b.id} className={cx('rounded-lg p-2', t.soft)}>
                <Select value={b.personnage} onChange={(e) => reassign(b.id, e.target.value)} className="mb-1 w-auto text-xs py-1">
                  {personnages.map(p => <option key={p} value={p}>{p}</option>)}
                  <option value="Didascalie">— Didascalie —</option>
                </Select>
                {b.didascalieEntree && <div className={cx('text-xs italic', t.textMuted)}>{b.didascalieEntree}</div>}
                <div className="text-xs">{b.texte || <span className={cx('italic', t.textMuted)}>(vide)</span>}</div>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

const AI_FORMAT_PROMPT = `Tu es un assistant qui reformate des textes de théâtre ou de scénario pour une appli de répétition de comédien (analyse automatique façon protocole CEAD). Reformate le texte que je te donne en suivant ces règles STRICTES, sans jamais changer les dialogues eux-mêmes, sans rien résumer et sans rien couper :

1. Le nom de chaque personnage doit être écrit en MAJUSCULES, seul sur sa propre ligne, juste avant sa réplique (pas de numéro, pas de tiret devant).
2. Laisse une ligne complètement vide entre chaque réplique (donc entre chaque personnage).
3. RÈGLE LA PLUS IMPORTANTE — ne mets JAMAIS la didascalie d'entrée et la réplique sur la même ligne. Si une courte indication de jeu précède une réplique (ex. "s'étirant paresseusement"), mets-la juste après le nom, séparée par une virgule, en minuscules, sans parenthèses — mais la réplique elle-même commence TOUJOURS sur la ou les lignes suivantes, jamais collée après sur la même ligne. Exemple correct :
   MARIE, s'étirant paresseusement
   Quelle heure est-il déjà ?
   Exemple INTERDIT (à ne jamais faire) : "MARIE, s'étirant paresseusement Quelle heure est-il déjà ?" tout sur une ligne.
4. Si le personnage parle hors champ, en aparté, ou avec une précision de ce type, mets-la entre parenthèses juste après le nom (avant les deux-points s'il y en a) : "MARCUS (off) : Lâchez-moi !" ou "MARCUS (à part)".
5. Si une indication de jeu apparaît au milieu d'une réplique, garde-la entre parenthèses à l'intérieur du texte, sur la même ligne que la réplique.
6. Une didascalie qui ne concerne aucun personnage en particulier (bruit, changement de lumière, entrée/sortie d'un personnage racontée à la 3e personne) doit être seule sur sa propre ligne, entre parenthèses, jamais accolée à la réplique d'un personnage avant ou après.
7. Les titres et repères de structure (ACTE, SCÈNE, chapitre, nom de partie, indication technique de lumière/son) doivent être seuls sur leur propre ligne, jamais au début ou à la fin de la ligne d'une réplique.
8. Si deux personnages différents ont le même prénom ou si un même personnage a plusieurs façons d'être nommé, garde un nom UNIQUE et IDENTIQUE à chaque occurrence (ex. toujours "NADYA", pas tantôt "NADYA" tantôt "LA JEUNE FILLE") — un nom composé du type "NOM1/NOM2" est accepté s'il désigne un seul rôle joué indifféremment par plusieurs interprètes (personnage du public, doublure...).
9. Ne mets jamais de numéros de ligne, de mise en page complexe (tableaux, colonnes, puces).
10. Si un titre ou une didascalie ne rentre dans aucun des cas ci-dessus (ex. formulation en minuscules sans parenthèses), préfixe-la avec une balise entre crochets plutôt que de deviner : [TITRE] pour un titre d'acte/scène, [DIDASCALIE] pour une indication de jeu autonome, [REGIE] pour une note technique. Exemple : "[DIDASCALIE] Un silence pesant s'installe".
11. Renvoie uniquement le texte reformaté, sans commentaire ni explication autour.

Voici le texte à reformater :

[COLLE TON TEXTE ICI]`;

async function extractFileText(file) {
  if (file.name.toLowerCase().endsWith('.txt')) return await file.text();
  if (file.name.toLowerCase().endsWith('.docx') && window.mammoth) return (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  if (file.name.toLowerCase().endsWith('.pdf') && window.pdfjsLib) return await extractPdfText(file);
  return null;
}

function TexteImportForm({ onSave, onSaveMultiple, onCancel }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [titre, setTitre] = useState('');
  const [contenu, setContenu] = useState('');
  const [status, setStatus] = useState('');
  const [promptCopied, setPromptCopied] = useState(false);
  const [showAiTip, setShowAiTip] = useState(false);
  const fileRef = useRef(null);
  const textAreaRef = useRef(null);

  const copyText = async (text) => {
    try { await navigator.clipboard.writeText(text); }
    catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
  };

  const copyAiPrompt = async () => {
    await copyText(AI_FORMAT_PROMPT);
    setPromptCopied(true);
    setTimeout(() => setPromptCopied(false), 2500);
  };

  const pasteFromClipboard = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) setContenu(text);
    } catch (err) {
      setStatus("Impossible de lire le presse-papier automatiquement — colle avec un appui long dans le champ ci-dessous.");
    }
  };

  const insertMarker = (marker) => {
    const el = textAreaRef.current;
    if (!el) { setContenu(c => c + ' ' + marker + ' '); return; }
    const start = el.selectionStart, end = el.selectionEnd;
    const next = contenu.slice(0, start) + ' ' + marker + ' ' + contenu.slice(end);
    setContenu(next);
    requestAnimationFrame(() => { el.focus(); const pos = start + marker.length + 2; el.setSelectionRange(pos, pos); });
  };

  const handleFiles = async (e) => {
    const files = [...e.target.files];
    if (!files.length) return;
    if (files.length === 1) {
      const file = files[0];
      setStatus('Lecture du fichier…');
      try {
        const text = await extractFileText(file);
        if (text === null) { setStatus("Format non reconnu ou bibliothèque indisponible — colle le texte manuellement ci-dessous."); return; }
        setContenu(text);
        setStatus('Texte importé, vérifie-le ci-dessous avant d\'enregistrer.');
        if (!titre) setTitre(file.name.replace(/\.[^.]+$/, ''));
      } catch (err) {
        console.error(err);
        setStatus("Échec de l'import automatique — colle le texte manuellement ci-dessous.");
      }
      return;
    }
    setStatus(`Analyse de ${files.length} fichiers…`);
    const entries = [];
    for (const file of files) {
      try {
        const text = await extractFileText(file);
        if (text !== null) entries.push({ titre: file.name.replace(/\.[^.]+$/, ''), contenu: text });
      } catch (err) { console.error(err); }
    }
    if (entries.length) {
      onSaveMultiple(entries);
    } else {
      setStatus("Aucun des fichiers n'a pu être lu — importe-les un par un ou colle le texte manuellement.");
    }
  };

  return (
    <div className="space-y-3">
      <Field label="Titre"><TextInput value={titre} onChange={(e) => setTitre(e.target.value)} placeholder="Nom du texte / spectacle" /></Field>
      <Field label="Importer un ou plusieurs fichiers (.txt, .docx, .pdf) — optionnel">
        <input ref={fileRef} type="file" accept=".txt,.docx,.pdf" multiple onChange={handleFiles} className="text-xs" />
        <div className={cx('text-xs mt-1', t.textMuted)}>Un seul fichier : tu peux vérifier le texte avant d'enregistrer. Plusieurs fichiers : chacun devient directement un texte séparé.</div>
      </Field>
      {status && <div className="text-xs opacity-70">{status}</div>}
      <div className={cx('rounded-xl p-3 text-xs leading-relaxed', t.soft)}>
        <strong className={t.accent}>Astuce :</strong> nom du personnage en MAJUSCULES sur sa propre ligne (ou "NOM : réplique"). Pas grave si ce n'est pas parfait, tu pourras tout corriger ensuite.
      </div>
      {!showAiTip ? (
        <button onClick={() => setShowAiTip(true)} className={cx('text-xs font-medium', t.accent)}>Texte mal formaté ou compliqué ? →</button>
      ) : (
        <div className={cx('rounded-xl p-3 text-xs leading-relaxed', t.soft)}>
          Copie ce prompt, colle-le dans une IA (ChatGPT, Claude…) avec ton texte à la fin, puis colle sa réponse ici.
          <div className="mt-2">
            <Btn variant="ghost" onClick={copyAiPrompt}><Icon name={promptCopied ? 'check' : 'copy'} size={14} />{promptCopied ? 'Copié !' : 'Copier le prompt de formatage'}</Btn>
          </div>
        </div>
      )}
      <Field label="Texte (colle ou vérifie ici)">
        <div className="flex gap-1.5 mb-1.5 flex-wrap">
          <Btn variant="ghost" onClick={pasteFromClipboard} title="Coller depuis le presse-papier"><Icon name="upload" size={14} />Coller</Btn>
          <Btn variant="ghost" onClick={() => insertMarker('/')} title="Marqueur de respiration courte">/ souffle</Btn>
          <Btn variant="ghost" onClick={() => insertMarker('//')} title="Marqueur de pause plus longue">// pause</Btn>
        </div>
        <TextArea ref={textAreaRef} rows={10} value={contenu} onChange={(e) => setContenu(e.target.value)} placeholder={"NOM PERSONNAGE\nSa réplique ici.\n\nAUTRE PERSONNAGE : sa réplique sur la même ligne."} />
      </Field>
      {contenu.trim() && (() => {
        const preview = parseScript(contenu);
        const perso = Array.from(new Set(preview.map(b => b.personnage))).filter(p => p !== 'Didascalie');
        const repliques = preview.filter(b => b.personnage !== 'Didascalie').length;
        const ok = perso.length > 1 || (perso.length === 1 && perso[0] !== 'Non attribué');
        return (
          <div className={cx('rounded-xl p-3 text-xs', ok ? t.soft : 'bg-amber-500/15 text-amber-600')}>
            {ok
              ? <span>✓ {perso.length} personnage(s) détecté(s) : <strong>{perso.join(', ')}</strong> — {repliques} réplique(s).</span>
              : <span>⚠️ Aucun personnage détecté pour l'instant (tout est regroupé sous "Non attribué"). Vérifie le format du texte ci-dessus avant d'enregistrer.</span>}
          </div>
        );
      })()}
      <div className="flex justify-end gap-2 pt-2">
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
        <Btn disabled={!contenu.trim()} onClick={() => onSave(titre.trim() || 'Sans titre', contenu)}><Icon name="check" size={16} />Analyser &amp; enregistrer</Btn>
      </div>
    </div>
  );
}

function TextesTab({ data, setData, openId, setOpenId }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [modal, setModal] = useState(false);
  const [dossierModal, setDossierModal] = useState(false);
  const [search, setSearch] = useState('');
  const [filterType, setFilterType] = useState('Tous');
  const [filterStatut, setFilterStatut] = useState('Tous');
  const [showMoreFilters, setShowMoreFilters] = useState(false);
  const [filterDossier, setFilterDossier] = useState('Tous');
  const [sortMode, setSortMode] = useState('alpha');

  const dossiers = useMemo(() => {
    const fromTextes = data.textes.map(tx => tx.dossier).filter(Boolean);
    return Array.from(new Set([...data.dossiersTextes, ...fromTextes]));
  }, [data.textes, data.dossiersTextes]);

  const activeDossier = filterDossier !== 'Tous' && filterDossier !== 'Sans dossier' ? filterDossier : '';

  const makeTexte = (titre, contenu) => {
    const blocks = parseScript(contenu);
    return { id: uid(), titre, contenu, original: contenu, blocks, personnages: Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie'), monPersonnage: '', statutMemorisation: 'À apprendre', auteur: '', compagnie: '', registre: 'Neutre', type: 'Scène', dossier: activeDossier, dateModif: new Date().toISOString() };
  };
  const addTexte = (titre, contenu) => {
    const nouveau = makeTexte(titre, contenu);
    setData(d => ({ ...d, textes: [...d.textes, nouveau] }));
    setModal(false);
    setOpenId(nouveau.id);
  };
  const addMultipleTextes = (entries) => {
    const nouveaux = entries.map(({ titre, contenu }) => makeTexte(titre, contenu));
    setData(d => ({ ...d, textes: [...d.textes, ...nouveaux] }));
    setModal(false);
  };
  const updateTexte = (updated) => setData(d => ({
    ...d,
    textes: d.textes.map(tx => tx.id === updated.id ? { ...updated, dateModif: new Date().toISOString() } : tx),
    dossiersTextes: updated.dossier && !d.dossiersTextes.includes(updated.dossier) ? [...d.dossiersTextes, updated.dossier] : d.dossiersTextes,
  }));
  const removeTexte = (id) => setData(d => ({ ...d, textes: d.textes.filter(tx => tx.id !== id) }));
  const duplicateTexte = (original) => {
    const copy = { ...original, id: uid(), titre: original.titre + ' (copie)', dateModif: new Date().toISOString() };
    setData(d => ({ ...d, textes: [...d.textes, copy] }));
  };
  // Réanalyse tous les textes avec le détecteur actuel — utile après une mise à jour
  // de l'appli, pour que les textes déjà importés (analysés avec un ancien moteur)
  // profitent des corrections sans devoir être supprimés puis réimportés un par un.
  const reparseAllTextes = () => {
    if (!window.confirm(`Relancer l'analyse automatique sur les ${data.textes.length} texte(s) ? Les réattributions manuelles, notes de régie et marquages faits dans l'onglet Corriger seront perdus pour chacun.`)) return;
    setData(d => ({
      ...d,
      textes: d.textes.map(tx => {
        const blocks = parseScript(tx.original || tx.contenu);
        const personnages = Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
        return { ...tx, blocks, personnages };
      }),
    }));
  };

  const renameDossier = (oldName, newName) => {
    if (!newName || newName === oldName) return;
    setData(d => ({
      ...d,
      dossiersTextes: Array.from(new Set(d.dossiersTextes.map(x => x === oldName ? newName : x))),
      textes: d.textes.map(tx => tx.dossier === oldName ? { ...tx, dossier: newName } : tx),
    }));
    if (filterDossier === oldName) setFilterDossier(newName);
  };
  const deleteDossier = (name) => {
    const count = data.textes.filter(tx => tx.dossier === name).length;
    const msg = count > 0 ? `${count} texte(s) sont dans "${name}" — ils repasseront en "Sans dossier". Continuer ?` : `Supprimer le dossier "${name}" ?`;

    setData(d => ({
      ...d,
      dossiersTextes: d.dossiersTextes.filter(x => x !== name),

  const exportRepertoirePdf = () => {
    const el = document.getElementById('print-root');

    const accent = '#0f766e';

    const p = data.profile;
    const types = ['Monologue', 'Scène', 'Pièce complète'];
    const grouped = types.map(ty => ({ ty, items: data.textes.filter(tx => (tx.type || 'Scène') === ty) })).filter(g => g.items.length);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family: Helvetica, Arial, sans-serif; color:#1a1a1a; max-width:760px; line-height:1.5;';
    wrap.innerHTML = `
      <div style="border-bottom:3px solid ${accent};padding-bottom:16px;">
        <div style="font-size:26px;font-weight:700;letter-spacing:-0.3px;">${p.prenom || ''} ${p.nom || ''}</div>
        <div style="font-size:14px;color:${accent};font-weight:600;margin-top:2px;">Répertoire — ${data.textes.length} texte(s)</div>
      </div>
      ${grouped.map(g => `
        <h2 style="${h2}">${g.ty}</h2>
        ${g.items.map(tx => {
          const lecture = estimerLecture(tx.blocks);
          const details = [tx.auteur, tx.compagnie, tx.registre && tx.registre !== 'Neutre' ? tx.registre : ''].filter(Boolean).join(' · ');
          return `
            <div style="font-size:13px;margin-bottom:7px;">
              <div style="display:flex;justify-content:space-between;gap:12px;">
                <strong>${tx.titre}</strong>
                <span style="color:#888;white-space:nowrap;">~${lecture.normal} min</span>
              </div>
              ${details ? `<div style="color:#666;font-size:12px;">${details}</div>` : ''}
            </div>
          `;
        }).join('')}
      `).join('')}
    `;
    el.appendChild(wrap);
    setTimeout(() => window.print(), 50);
  };

  const openTexte = data.textes.find(tx => tx.id === openId);
  if (openTexte) {
    return <TexteDetail texte={openTexte} dossiers={dossiers} onUpdate={updateTexte} onBack={() => setOpenId(null)}
      rate={data.settings.rate} volume={data.settings.volume}
      onRateChange={(v) => setData(d => ({ ...d, settings: { ...d.settings, rate: v } }))}
      onVolumeChange={(v) => setData(d => ({ ...d, settings: { ...d.settings, volume: v } }))} />;
  }

  let filtered = data.textes.filter(tx => {
    const matchType = filterType === 'Tous' || (tx.type || 'Scène') === filterType;
    const matchStatut = filterStatut === 'Tous' || tx.statutMemorisation === filterStatut;
    const matchDossier = filterDossier === 'Tous' || (filterDossier === 'Sans dossier' ? !tx.dossier : tx.dossier === filterDossier);
    const matchSearch = !search || (tx.titre + ' ' + (tx.auteur || '') + ' ' + (tx.compagnie || '')).toLowerCase().includes(search.toLowerCase());
    return matchType && matchStatut && matchDossier && matchSearch;
  });
  filtered = [...filtered].sort((a, b) => sortMode === 'alpha' ? a.titre.localeCompare(b.titre) : (b.dateModif || '').localeCompare(a.dateModif || ''));

  return (
    <div className="space-y-3 pb-4">
      <Card>
        <SectionTitle right={
          <div className="flex gap-1.5 shrink-0">
            {dossiers.length > 0 && <IconBtn name="settings" title="Gérer les dossiers" onClick={() => setDossierModal(true)} />}
            {data.textes.length > 0 && <IconBtn name="undo" title="Réanalyser tous les textes avec le détecteur actuel" onClick={reparseAllTextes} />}
            {data.textes.length > 0 && <IconBtn name="download" title="Exporter mon répertoire (PDF)" onClick={exportRepertoirePdf} />}
            <Btn onClick={() => setModal(true)}><Icon name="plus" size={16} />Texte</Btn>
          </div>
        }>Mes textes</SectionTitle>
        {dossiers.length > 0 && (
          <div className="flex flex-wrap gap-1.5 mb-2">
            {['Tous', 'Sans dossier', ...dossiers].map(d => (
              <button key={d} onClick={() => setFilterDossier(d)} className={cx('shrink-0 whitespace-nowrap flex items-center gap-1 max-w-[9.5rem] text-xs pl-2.5 pr-3 py-1.5 rounded-full font-medium', filterDossier === d ? t.btnPrimary : cx(t.soft, t.textMuted))}>

              </button>
            ))}
          </div>

              <div className="relative flex-1">

                  <div className={cx('text-[11px] font-semibold uppercase tracking-wide mb-1', t.textMuted)}>Type</div>
                  <div className="flex flex-wrap gap-1.5">
                    {['Tous', 'Monologue', 'Scène', 'Pièce complète'].map(ty => (
                      <button key={ty} onClick={() => setFilterType(ty)} className={cx('shrink-0 whitespace-nowrap text-xs px-3 py-1.5 rounded-full font-medium', filterType === ty ? t.btnPrimary : cx(t.panel, t.textMuted))}>{ty}</button>

                    ))}
                  </div>
                </div>
              </div>
            )}
          </>
        )}
        {filtered.length === 0 ? <EmptyState icon="book" text={data.textes.length === 0 ? "Importe ou colle ton premier texte à répéter." : "Aucun texte ne correspond."} /> : (
          <div className="space-y-2">
            {filtered.map(tx => (
              <div key={tx.id} onClick={() => setOpenId(tx.id)} className={cx('rounded-xl p-3 cursor-pointer', t.soft, t.cardHover)}>
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className="font-medium truncate">{tx.titre}</div>
                    <div className={cx('text-xs', t.textMuted)}>{tx.auteur ? tx.auteur + ' · ' : ''}{tx.personnages.length} personnage(s){tx.monPersonnage ? ' · toi : ' + tx.monPersonnage : ''}</div>

                  <div className="flex gap-0.5 shrink-0">

                    <ConfirmDeleteButton onConfirm={() => removeTexte(tx.id)} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
      {modal && (
        <Modal title="Nouveau texte" onClose={() => setModal(false)}>
          <TexteImportForm onSave={addTexte} onSaveMultiple={addMultipleTextes} onCancel={() => setModal(false)} />
        </Modal>
      )}
      {dossierModal && <DossiersModal dossiers={dossiers} textes={data.textes} onRename={renameDossier} onDelete={deleteDossier} onClose={() => setDossierModal(false)} />}
    </div>
  );
}

function readAndCompressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function SettingsModal({ data, settings, setData, onClose, onGoToProfil, lastBackupAt, onBackup }) {
  const { theme, toggle } = useTheme();
  const t = themeClasses(theme);
  const importRef = useRef(null);
  const mergeRef = useRef(null);
  const [showGuide, setShowGuide] = useState(false);

  const setAccent = (accent) => setData(d => ({ ...d, settings: { ...d.settings, accent } }));
  const setFontScale = (fontScale) => setData(d => ({ ...d, settings: { ...d.settings, fontScale } }));

  const exportJson = () => {
    setData(currentData => {
      const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'comedien-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return currentData;
    });
    onBackup();
  };

  const importJson = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!window.confirm('Restaurer ces données va remplacer toutes les données actuelles. Continuer ?')) return;
        setData(mergeWithDefaults(parsed));
        onClose();
      } catch (err) { alert('Fichier invalide.'); }
    };
    reader.readAsText(file);
  };

  const resetAll = () => {
    if (!window.confirm("Réinitialiser l'appli va supprimer TOUTES tes données (profil, contacts, cachets, textes…). Cette action est irréversible. Continuer ?")) return;
    setData(defaultData());
    onClose();
  };

  // Contrairement à "Restaurer" (remplace tout), ceci AJOUTE le contenu d'un fichier
  // à ce qui existe déjà — utile pour intégrer un lot préparé (par ex. par une IA)
  // sans perdre les données déjà sur le téléphone. Réutilise les mêmes détections de
  // doublon que le reste de l'app (cachets, contacts, employeurs) pour rester sûr.
  const mergeJson = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let incoming;
      try { incoming = JSON.parse(ev.target.result); } catch (err) { alert('Fichier invalide.'); return; }
      // Calculé une seule fois, de façon synchrone, contre `data` (pas via l'updater
      // fonctionnel de setData) : sinon le compte-rendu affiché lirait le rapport avant
      // que React n'ait exécuté la fusion, et afficherait toujours des zéros.
      const d = data;
      const report = { cachets: 0, cachetsIgnores: 0, employeurs: 0, contacts: 0, contactsIgnores: 0, castings: 0, textes: 0, profil: false };
      let employeurs = d.employeurs, cachets = d.cachets, contacts = d.contacts, categories = d.categories,
        castings = d.castings, textes = d.textes, dossiersTextes = d.dossiersTextes, profile = d.profile;
      if (incoming.profile) { profile = applyProfilePatch(profile, incoming.profile, false); report.profil = true; }
      (incoming.employeurs || []).forEach(emp => {
        const idx = employeurs.findIndex(e2 => e2.nom.toLowerCase() === (emp.nom || '').toLowerCase());
        if (idx === -1) { employeurs = [...employeurs, { ...emp, id: uid() }]; report.employeurs++; }
      });
      (incoming.cachets || []).forEach(c => {
        if (findDuplicateCachet(c, cachets)) { report.cachetsIgnores++; return; }
        cachets = [...cachets, { ...c, id: uid() }];
        report.cachets++;
        const nom = (c.employeur || '').trim();
        if (nom) {
          const idx = employeurs.findIndex(e2 => e2.nom.toLowerCase() === nom.toLowerCase());
          employeurs = idx === -1 ? [...employeurs, { id: uid(), nom, typeParDefaut: c.type }] : employeurs;
        }
      });
      (incoming.contacts || []).forEach(c => {
        if (findDuplicateContact(c, contacts)) { report.contactsIgnores++; return; }
        contacts = [...contacts, { ...c, id: uid() }];
        if (c.categorie && !categories.includes(c.categorie)) categories = [...categories, c.categorie];
        report.contacts++;
      });
      (incoming.castings || []).forEach(c => { castings = [...castings, { ...c, id: uid() }]; report.castings++; });
      (incoming.textes || []).forEach(tx => {
        const contenu = tx.contenu || '';
        const blocks = tx.blocks || parseScript(contenu);
        const personnages = tx.personnages || Array.from(new Set(blocks.map(b => b.personnage))).filter(p => p !== 'Didascalie');
        textes = [...textes, {
          monPersonnage: '', statutMemorisation: 'À apprendre', auteur: '', compagnie: '', registre: 'Neutre', type: 'Scène',
          ...tx, id: uid(), contenu, original: tx.original || contenu, blocks, personnages, dateModif: new Date().toISOString(),
        }];
        if (tx.dossier && !dossiersTextes.includes(tx.dossier)) dossiersTextes = [...dossiersTextes, tx.dossier];
        report.textes++;
      });
      setData({ ...d, employeurs, cachets, contacts, categories, castings, textes, dossiersTextes, profile });
      alert(`Ajouté : ${report.cachets} cachet(s), ${report.employeurs} employeur(s), ${report.contacts} contact(s), ${report.castings} casting(s), ${report.textes} texte(s)${report.profil ? ', profil complété' : ''}.` +
        (report.cachetsIgnores || report.contactsIgnores ? `\n${report.cachetsIgnores} cachet(s) et ${report.contactsIgnores} contact(s) déjà présents ont été ignorés (doublons).` : ''));
      if (mergeRef.current) mergeRef.current.value = '';
    };
    reader.readAsText(file);
  };

  return (
    <Modal title="Réglages" onClose={onClose}>
      <div className="space-y-4">
        <div>
          <div className={cx('text-xs font-semibold mb-2', t.textMuted)}>Aide</div>
          <Btn variant="ghost" className="w-full" onClick={() => setShowGuide(true)}><Icon name="help" size={16} />Comment ça marche ?</Btn>
        </div>
        <div>
          <div className={cx('text-xs font-semibold mb-2', t.textMuted)}>Profil</div>
          <Btn variant="ghost" className="w-full" onClick={onGoToProfil}><Icon name="user" size={16} />Modifier mon profil</Btn>
        </div>
        <div>
          <div className={cx('text-xs font-semibold mb-2', t.textMuted)}>Apparence</div>
          <div className="space-y-3">
            <Btn variant="ghost" className="w-full" onClick={toggle}><Icon name={theme === 'sombre' ? 'sun' : 'moon'} size={16} />{theme === 'sombre' ? 'Passer en mode clair' : 'Passer en mode coulisses'}</Btn>
            <div>
              <div className={cx('text-xs mb-1.5', t.textMuted)}>Couleur d'accent</div>
              <div className="flex flex-wrap gap-2">
                {ACCENT_OPTIONS.map(opt => (
                  <button key={opt.id} onClick={() => setAccent(opt.id)}
                    className={cx('shrink-0 whitespace-nowrap flex items-center gap-1.5 text-xs px-3 py-2 rounded-full font-medium border-2',
                      settings.accent === opt.id ? `border-${opt.id}-600` : 'border-transparent', t.soft)}>
                    <span className={`w-3 h-3 rounded-full bg-${opt.id}-600`}></span>{opt.label}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <div className={cx('text-xs mb-1.5', t.textMuted)}>Taille du texte</div>
              <div className="flex gap-2">
                {[['petit', 'Petit'], ['normal', 'Normal'], ['grand', 'Grand']].map(([id, label]) => (
                  <button key={id} onClick={() => setFontScale(id)}
                    className={cx('flex-1 whitespace-nowrap text-sm px-3 py-2 rounded-full font-medium', (settings.fontScale || 'normal') === id ? t.btnPrimary : cx(t.soft, t.textMuted))}>
                    {label}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
        <div>
          <div className={cx('text-xs font-semibold mb-2', t.textMuted)}>Sauvegarde</div>
          <div className={cx('text-xs mb-2', t.textMuted)}>
            {lastBackupAt ? `Dernière sauvegarde : ${fmtDate(lastBackupAt)}` : "Tu n'as jamais exporté tes données"} — le fichier téléchargé contient tout (profil, textes, cachets, contacts…), à garder pour transférer l'appli sur un nouveau téléphone.
          </div>
          <div className="space-y-2">
            <Btn className="w-full" onClick={exportJson}><Icon name="save" size={16} />Sauvegarder toutes mes données</Btn>
            <label className={cx('w-full flex items-center justify-center gap-1.5 rounded-full px-4 py-2.5 text-sm font-medium border cursor-pointer', t.panelBorder)}>
              <Icon name="upload" size={16} />Restaurer mes données
              <input ref={importRef} type="file" accept="application/json" onChange={importJson} className="hidden" />
            </label>
            <label className={cx('w-full flex items-center justify-center gap-1.5 rounded-full px-4 py-2.5 text-sm font-medium border cursor-pointer', t.panelBorder)}>
              <Icon name="download" size={16} />Ajouter des données (fusion)
              <input ref={mergeRef} type="file" accept="application/json" onChange={mergeJson} className="hidden" />
            </label>
            <div className={cx('text-xs', t.textMuted)}>"Ajouter" complète tes données actuelles sans rien effacer (les doublons sont ignorés) — utile pour intégrer un fichier préparé séparément, par ex. avec mon aide.</div>
          </div>
        </div>
        <div>
          <div className={cx('text-xs font-semibold mb-2', t.textMuted)}>Zone de danger</div>
          <Btn variant="danger" className="w-full" onClick={resetAll}><Icon name="trash" size={16} />Réinitialiser toutes les données</Btn>
        </div>
      </div>
      {showGuide && <GuideModal onClose={() => setShowGuide(false)} />}
    </Modal>
  );
}

function ImportProfilModal({ onClose, onApply }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [extracted, setExtracted] = useState('');
  const [structured, setStructured] = useState('');
  const [status, setStatus] = useState('');
  const [promptCopied, setPromptCopied] = useState(false);
  const [forceOverwrite, setForceOverwrite] = useState(false);

  const copyText = async (text) => {
    try { await navigator.clipboard.writeText(text); }
    catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
  };

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setStatus('Lecture du fichier…');
    try {
      if (file.name.toLowerCase().endsWith('.txt')) setExtracted(await file.text());
      else if (file.name.toLowerCase().endsWith('.docx') && window.mammoth) {
        const res = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
        setExtracted(res.value);
      } else if (file.name.toLowerCase().endsWith('.pdf') && window.pdfjsLib) {
        setExtracted(await extractPdfText(file));
      } else {
        setStatus('Format non reconnu — copie le texte de ton CV manuellement.');
        return;
      }
      setStatus('Texte extrait ci-dessous — copie-le pour le coller dans une IA avec le prompt.');
    } catch (err) {
      console.error(err);
      setStatus("Échec de l'extraction — copie le texte de ton CV manuellement.");
    }
  };

  const copyAiPrompt = async () => {
    await copyText(CV_FORMAT_PROMPT);
    setPromptCopied(true);
    setTimeout(() => setPromptCopied(false), 2500);
  };

  const apply = () => {
    const fields = parseCvCanonicalText(structured);
    const patch = cvFieldsToProfilePatch(fields);
    onApply(patch, forceOverwrite);
    onClose();
  };

  return (
    <Modal title="Importer mon profil / CV" onClose={onClose}>
      <div className="space-y-3">
        <div className={cx('rounded-xl p-3 text-xs leading-relaxed', t.soft)}>
          <strong className={t.accent}>1. Importe ton CV (optionnel)</strong> — extrait le texte d'un PDF/DOCX/TXT existant pour le réutiliser à l'étape suivante.
          <div className="mt-2"><input type="file" accept=".txt,.docx,.pdf" onChange={handleFile} className="text-xs" /></div>
          {status && <div className="mt-1.5 opacity-80">{status}</div>}
          {extracted && (
            <div className="mt-2">
              <TextArea rows={4} value={extracted} onChange={(e) => setExtracted(e.target.value)} />
              <Btn variant="ghost" className="mt-1.5" onClick={() => copyText(extracted)}><Icon name="copy" size={14} />Copier ce texte</Btn>
            </div>
          )}
        </div>
        <div className={cx('rounded-xl p-3 text-xs leading-relaxed', t.soft)}>
          <strong className={t.accent}>2. Copie ce prompt</strong> et colle-le dans une IA (ChatGPT, Claude…) suivi de ton CV ou de tes infos en vrac.
          <div className="mt-2"><Btn variant="ghost" onClick={copyAiPrompt}><Icon name={promptCopied ? 'check' : 'copy'} size={14} />{promptCopied ? 'Copié !' : 'Copier le prompt'}</Btn></div>
        </div>
        <Field label="3. Colle ici la réponse structurée de l'IA">
          <TextArea rows={8} value={structured} onChange={(e) => setStructured(e.target.value)} placeholder={"PRENOM: Thomas\nNOM: Maurin\n..."} />
        </Field>
        <label className="flex items-center gap-2 text-xs">
          <input type="checkbox" checked={forceOverwrite} onChange={(e) => setForceOverwrite(e.target.checked)} />
          Remplacer les informations déjà renseignées (sinon, seuls les champs vides sont complétés)
        </label>
        <div className="flex justify-end gap-2 pt-2">
          <Btn variant="ghost" onClick={onClose}>Annuler</Btn>
          <Btn disabled={!structured.trim()} onClick={apply}><Icon name="check" size={16} />Analyser &amp; remplir mon profil</Btn>
        </div>
      </div>
    </Modal>
  );
}

                  <div className={cx('text-xs', t.textMuted)}>{[e.role, e.structure].filter(Boolean).join(', ')}</div>

                <div className="flex gap-0.5 shrink-0">

      {expModal && (

const TABS = [
  { id: 'textes', label: 'Textes', icon: 'book' },
  { id: 'entrainement', label: 'Entraînement', icon: 'dumbbell' },
  { id: 'intermittent', label: 'Intermittent', icon: 'briefcase' },
  { id: 'castings', label: 'Castings', icon: 'film' },
  { id: 'contacts', label: 'Contacts', icon: 'users' },
];

function SearchResultGroup({ label, icon, items, renderLabel, onPick, t }) {
  if (!items.length) return null;
  return (
    <div>
      <div className={cx('text-xs font-semibold mb-1.5', t.textMuted)}>{label}</div>
      <div className="space-y-1.5">
        {items.map(item => (
          <button key={item.id} onClick={() => onPick(item)} className={cx('w-full text-left flex items-center gap-2 rounded-xl p-2.5', t.soft)}>
            <Icon name={icon} size={16} className={cx('shrink-0', t.accent)} />
            <span className="text-sm truncate min-w-0">{renderLabel(item)}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function SearchModal({ data, onClose, onOpenTexte, onGoToTab }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [q, setQ] = useState('');
  const query = q.trim().toLowerCase();

  const textResults = query ? data.textes.filter(tx => (tx.titre + ' ' + (tx.auteur || '') + ' ' + (tx.compagnie || '')).toLowerCase().includes(query)) : [];
  const contactResults = query ? data.contacts.filter(c => (c.nom + ' ' + (c.fonction || '')).toLowerCase().includes(query)) : [];
  const employeurResults = query ? data.employeurs.filter(e => e.nom.toLowerCase().includes(query)) : [];
  const castingResults = query ? data.castings.filter(c => (c.projet + ' ' + (c.structure || '')).toLowerCase().includes(query)) : [];
  const exerciceResults = query ? EXERCICES.filter(ex => ex.titre.toLowerCase().includes(query)) : [];
  const noResults = query && ![textResults, contactResults, employeurResults, castingResults, exerciceResults].some(a => a.length);

  return (
    <Modal title="Rechercher" onClose={onClose}>
      <div className="relative mb-3">
        <Icon name="search" size={16} className={cx('absolute left-3.5 top-3.5', t.textMuted)} />
        <TextInput autoFocus placeholder="Texte, contact, employeur, casting, exercice…" value={q} onChange={(e) => setQ(e.target.value)} className="pl-9" />
      </div>
      {!query && <EmptyState icon="search" text="Tape pour chercher dans tes textes, contacts, employeurs, castings et exercices." />}
      {noResults && <EmptyState icon="search" text="Aucun résultat." />}
      <div className="space-y-3 max-h-96 overflow-y-auto">
        <SearchResultGroup label="Textes" icon="book" items={textResults} renderLabel={(tx) => tx.titre} onPick={(tx) => onOpenTexte(tx.id)} t={t} />
        <SearchResultGroup label="Contacts" icon="users" items={contactResults} renderLabel={(c) => c.nom} onPick={() => onGoToTab('contacts')} t={t} />
        <SearchResultGroup label="Employeurs" icon="briefcase" items={employeurResults} renderLabel={(e) => e.nom} onPick={() => onGoToTab('intermittent')} t={t} />
        <SearchResultGroup label="Castings" icon="film" items={castingResults} renderLabel={(c) => c.projet} onPick={() => onGoToTab('castings')} t={t} />
        <SearchResultGroup label="Exercices" icon="dumbbell" items={exerciceResults} renderLabel={(ex) => ex.titre} onPick={() => onGoToTab('entrainement')} t={t} />
      </div>
    </Modal>
  );
}

const HISTORY_LIMIT = 20;

function App() {
  const [data, setDataRaw] = useState(loadData);
  const [history, setHistory] = useState([]);
  const [tab, setTab] = useState('textes');
  const [showSettings, setShowSettings] = useState(false);
  const [showSearch, setShowSearch] = useState(false);
  const [openTexteId, setOpenTexteId] = useState(null);
  const [lastBackupAt, setLastBackupAt] = useState(getLastBackup);
  const recordBackup = () => { setLastBackup(); setLastBackupAt(new Date()); };

  useEffect(() => { saveData(data); }, [data]);

  // setData passe par ici partout dans l'app (une seule définition, ~30 composants
  // reçoivent ce setData en prop) : chaque vrai changement de contenu est empilé pour
  // pouvoir être annulé — "sauvegarde automatique à chaque action" côté utilisateur.
  const setData = (updater) => {
    setDataRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (hasDataChange(prev, next)) setHistory(h => [...h, prev].slice(-HISTORY_LIMIT));
      return next;
    });
  };
  const undo = () => {
    if (!history.length) return;
    const last = history[history.length - 1];
    setHistory(h => h.slice(0, -1));
    setDataRaw(last);
  };

  const theme = data.settings.theme;
  currentAccent = data.settings.accent || 'teal';
  useEffect(() => {
    const px = { petit: 14, normal: 16, grand: 19 }[data.settings.fontScale] || 16;
    document.documentElement.style.fontSize = px + 'px';
  }, [data.settings.fontScale]);
  const toggle = () => setData(d => ({ ...d, settings: { ...d.settings, theme: d.settings.theme === 'sombre' ? 'clair' : 'sombre' } }));
  const t = themeClasses(theme);

  const activeScreen = [...TABS, { id: 'profil', label: 'Profil', icon: 'user' }].find(s => s.id === tab) || TABS[0];

  return (
    <ThemeContext.Provider value={{ theme, toggle }}>
      <div className={cx('min-h-screen', t.bg, t.text)}>
        <header className={cx('sticky top-0 z-30 shadow-md text-white', t.headerGrad)}>
          <div className="px-4 pt-3 pb-2 flex items-center justify-between">
            <div className="font-bold text-lg tracking-tight flex items-center gap-2 truncate min-w-0"><Icon name={activeScreen.icon} size={19} className="shrink-0" />{activeScreen.label}</div>
            <div className="flex items-center gap-1.5 shrink-0">
              {history.length > 0 && (
                <button onClick={undo} title="Annuler la dernière action" className="p-1.5 rounded-full bg-white/15 hover:bg-white/25 transition active:scale-90">
                  <Icon name="undo" size={16} />
                </button>
              )}
              <button onClick={() => setShowSearch(true)} title="Rechercher" className="p-1.5 rounded-full bg-white/15 hover:bg-white/25 transition active:scale-90">
                <Icon name="search" size={16} />
              </button>
              <button onClick={toggle} title="Changer de thème" className="p-1.5 rounded-full bg-white/15 hover:bg-white/25 transition active:scale-90">
                <Icon name={theme === 'sombre' ? 'sun' : 'moon'} size={16} />
              </button>
              <button onClick={() => setTab('profil')} title="Mon profil" className={cx('p-1.5 rounded-full transition active:scale-90', tab === 'profil' ? 'bg-white text-black' : 'bg-white/15 hover:bg-white/25')}>
                <Icon name="user" size={16} />
              </button>
              <button onClick={() => setShowSettings(true)} title="Réglages" className="p-1.5 rounded-full bg-white/15 hover:bg-white/25 transition active:scale-90">
                <Icon name="settings" size={16} />
              </button>
            </div>
          </div>
          <div className="grid grid-cols-5 gap-1 px-2 pb-2">
            {TABS.map(tb => (
              <button key={tb.id} onClick={() => setTab(tb.id)}
                className={cx('flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-2xl transition min-w-0',
                  tab === tb.id ? (theme === 'sombre' ? `bg-[#0a0f0d] text-${currentAccent}-300` : `bg-white text-${currentAccent}-700`) : 'text-white/75 hover:bg-white/10')}>
                <Icon name={tb.icon} size={17} />
                <span className="text-[9.5px] leading-[11px] font-semibold text-center px-0.5">{tb.label}</span>
              </button>
            ))}
          </div>
        </header>

        <main className="max-w-xl mx-auto px-4 pt-3 pb-8">
          {tab === 'intermittent' && <Dashboard data={data} setData={setData} onOpenSettings={() => setShowSettings(true)} lastBackupAt={lastBackupAt} />}
          {tab === 'castings' && <CastingsTab data={data} setData={setData} />}
          {tab === 'contacts' && <ContactsTab data={data} setData={setData} />}
          {tab === 'textes' && <TextesTab data={data} setData={setData} openId={openTexteId} setOpenId={setOpenTexteId} />}
          {tab === 'entrainement' && <EntrainementTab data={data} setData={setData} />}
          {tab === 'profil' && <ProfilTab data={data} setData={setData} />}
        </main>

        {showSettings && (
          <SettingsModal data={data} settings={data.settings} setData={setData} onClose={() => setShowSettings(false)} onGoToProfil={() => { setTab('profil'); setShowSettings(false); }} lastBackupAt={lastBackupAt} onBackup={recordBackup} />
        )}
        {showSearch && (
          <SearchModal data={data} onClose={() => setShowSearch(false)}
            onOpenTexte={(id) => { setOpenTexteId(id); setTab('textes'); setShowSearch(false); }}
            onGoToTab={(id) => { setTab(id); setShowSearch(false); }} />
        )}
      </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
