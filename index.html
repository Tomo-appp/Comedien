// Formule officielle de l'allocation journalière, Annexe X (artistes) au règlement
// général annexé à la convention d'assurance chômage du 15/11/2024, Article 14 :
// AJ = A + B + C, avec A lié au salaire de référence (SR), B au nombre d'heures
// travaillées (NHT), C une partie fixe — chacune plafonnée par palier. Vérifié sur
// le texte réglementaire Unédic (unedic.org) et recoupé avec plusieurs sources
// spécialisées indépendantes en septembre 2026. Ces paramètres sont réévalués
// périodiquement par l'Unédic — à recaler si un texte plus récent les modifie.
const AJ_MINIMALE = 31.96; // paramètre de base de la formule (pas le plancher payé)
const AJ_PART_A_SEUIL = 13700; // € de SR
const AJ_PART_A_TAUX_BAS = 0.36;
const AJ_PART_A_TAUX_HAUT = 0.05;
const AJ_PART_A_DIVISEUR = 5000;
const AJ_PART_B_SEUIL = 690; // heures de NHT
const AJ_PART_B_TAUX_BAS = 0.26;
const AJ_PART_B_TAUX_HAUT = 0.08;
const AJ_PART_B_DIVISEUR = 507;
const AJ_PART_C_TAUX = 0.70;
const AJ_PLANCHER = 44; // montant minimal réellement versé (Annexe 10)
const AJ_PLAFOND = 174.80; // plafond en vigueur depuis le 01/01/2024
const AJ_TAUX_PRELEVEMENTS = 0.075; // CSG/CRDS (~6,7% net d'abattement) + participation retraite (0,93%) — ordre de grandeur, dépend du revenu fiscal de référence

function computeAllocationAnnexe10(sr, nh) {
  const partA = (AJ_MINIMALE * (AJ_PART_A_TAUX_BAS * Math.min(sr, AJ_PART_A_SEUIL) + AJ_PART_A_TAUX_HAUT * Math.max(0, sr - AJ_PART_A_SEUIL))) / AJ_PART_A_DIVISEUR;
  const partB = (AJ_MINIMALE * (AJ_PART_B_TAUX_BAS * Math.min(nh, AJ_PART_B_SEUIL) + AJ_PART_B_TAUX_HAUT * Math.max(0, nh - AJ_PART_B_SEUIL))) / AJ_PART_B_DIVISEUR;
  const partC = AJ_MINIMALE * AJ_PART_C_TAUX;
  const ajBrute = partA + partB + partC;
  const ajApresPlancher = Math.max(ajBrute, AJ_PLANCHER);
  const ajFinale = Math.min(ajApresPlancher, AJ_PLAFOND);
  const ajNetteEstimee = ajFinale * (1 - AJ_TAUX_PRELEVEMENTS);
  return { partA, partB, partC, ajBrute, ajFinale, ajNetteEstimee, plancherApplique: ajBrute < AJ_PLANCHER, plafondApplique: ajApresPlancher > AJ_PLAFOND };
}

let _uidCounter = 0;
function uid() { return 'id-' + Date.now().toString(36) + '-' + (_uidCounter++).toString(36); }

// Fusion en profondeur avec les valeurs par défaut : un JSON restauré (ou une ancienne
// sauvegarde) peut ne pas avoir tous les champs actuels — sans ça, un champ manquant
// (ex. profile.cvPro) devient undefined et fait planter l'appli à l'affichage.
function mergeWithDefaults(parsed) {
  const base = defaultData();
  const p = parsed || {};
  const oldProfile = p.profile || {};
  const oldCvPro = oldProfile.cvPro || {};
  // Migration : une ancienne sauvegarde avait "filmographie" (texte libre) au lieu
  // d'"experiences" (liste structurée) — on la convertit plutôt que de la perdre.
  const migratedExperiences = Array.isArray(oldCvPro.experiences) ? oldCvPro.experiences
    : (oldCvPro.filmographie && oldCvPro.filmographie.trim() ? [{ id: uid(), titre: oldCvPro.filmographie.trim(), role: '', annee: '', type: 'Autre' }] : base.profile.cvPro.experiences);
  // Migration : "formation" était un unique bloc de texte libre, remplacé par une liste
  // structurée (une entrée par formation/stage) pour éviter un pavé de texte illisible.
  const migratedFormation = Array.isArray(oldCvPro.formation) ? oldCvPro.formation
    : (typeof oldCvPro.formation === 'string' && oldCvPro.formation.trim() ? [{ id: uid(), intitule: oldCvPro.formation.trim(), annee: '' }] : base.profile.cvPro.formation);
  // Migration : "demoLink" (un seul lien) remplacé par "liens" (plusieurs, avec libellé).
  const migratedLiens = Array.isArray(oldProfile.liens) ? oldProfile.liens
    : (oldProfile.demoLink && oldProfile.demoLink.trim() ? [{ id: uid(), label: 'Démo', url: oldProfile.demoLink.trim() }] : base.profile.liens);
  return {
    ...base, ...p,
    profile: {
      ...base.profile, ...oldProfile,
      liens: migratedLiens,
      mensurations: { ...base.profile.mensurations, ...(oldProfile.mensurations || {}) },
      logistique: { ...base.profile.logistique, ...(oldProfile.logistique || {}) },
      cvPro: { ...base.profile.cvPro, ...oldCvPro, experiences: migratedExperiences, formation: migratedFormation },
    },
    settings: { ...base.settings, ...(p.settings || {}) },
    contacts: Array.isArray(p.contacts) ? p.contacts : base.contacts,
    categories: Array.isArray(p.categories) ? p.categories : base.categories,
    employeurs: Array.isArray(p.employeurs) ? p.employeurs : base.employeurs,
    cachets: Array.isArray(p.cachets) ? p.cachets : base.cachets,
    castings: Array.isArray(p.castings) ? p.castings : base.castings,
    representations: Array.isArray(p.representations) ? p.representations : base.representations,
    textes: Array.isArray(p.textes) ? p.textes : base.textes,
    dossiersTextes: Array.isArray(p.dossiersTextes) ? p.dossiersTextes : base.dossiersTextes,
    favorisExercices: Array.isArray(p.favorisExercices) ? p.favorisExercices : base.favorisExercices,
    dateFinDroits: p.dateFinDroits || base.dateFinDroits,
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    return mergeWithDefaults(JSON.parse(raw));
  } catch (e) { return defaultData(); }
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.warn('Sauvegarde impossible', e); }
}

// Stocké hors de `data` (clé séparée) : la date du dernier export JSON manuel n'est pas
// une donnée de l'utilisateur à transférer/annuler, juste un repère pour lui rappeler
// de sauvegarder — un reset ou une restauration ne doit pas y toucher.
const BACKUP_KEY = 'comedien-last-backup-v1';
function getLastBackup() {
  try { const raw = localStorage.getItem(BACKUP_KEY); return raw ? new Date(raw) : null; } catch (e) { return null; }
}
function setLastBackup() {
  try { localStorage.setItem(BACKUP_KEY, new Date().toISOString()); } catch (e) {}

// N'ajoute à l'historique d'annulation que les vrais changements de contenu (cachets,
// contacts, textes, profil…), pas les réglages d'apparence — un curseur de volume/vitesse
// déclenche un setData à chaque tick de glissement et inonderait l'historique pour rien.
function hasDataChange(prev, next) {
  return Object.keys(next).some(k => k !== 'settings' && prev[k] !== next[k]);
}

function cx(...parts) { return parts.filter(Boolean).join(' '); }


function fmtEuros(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}

function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('fr-FR'); } catch (e) { return d; }
}

function fmtMoisAnnee(ym) {
  const [y, m] = ym.split('-').map(Number);
  const label = new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

function computeAge(dateNaissance) {
  if (!dateNaissance) return null;
  const birth = new Date(dateNaissance);
  if (isNaN(birth.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const hadBirthdayThisYear = now.getMonth() > birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
  if (!hadBirthdayThisYear) age--;
  return age;
}

function normalizeUrl(url) {
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : 'https://' + url;
}

// Extrait le texte d'un PDF en reconstruisant les lignes par position verticale
// (sans ça pdf.js renvoie un seul bloc de texte illisible et non analysable).
async function extractPdfText(file) {
  if (!window.pdfjsLib) throw new Error('pdfjsLib indisponible');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let lastY = null, line = '';
    content.items.forEach(item => {
      const y = item.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) { text += line.trim() + '\n'; line = ''; }
      line += item.str + ' ';
      lastY = y;
    });
    text += line.trim() + '\n\n';
  }
  return text;
}

// Heuristiques best-effort pour pré-remplir un cachet à partir du texte d'un bulletin
// (uniquement les PDF avec une vraie couche de texte — pas les scans/photos, pas d'OCR).
// Ne jamais faire confiance aveuglément : sert uniquement à pré-remplir un brouillon
// que l'utilisateur doit vérifier avant d'enregistrer.
// Libellés officiels d'une AEM (Attestation Employeur Mensuelle, modèle Unédic DAJ 110) :
// "SALAIRES BRUTS", "Nombre de CACHETS", "Date d'embauche", "Raison Sociale". Une vraie
// AEM (GUSO ou logiciel de paie) respecte ce gabarit, donc ces libellés sont prioritaires
// sur des motifs génériques de bulletin de paie classique.
// Détection de doublon de cachet : même employeur + même date de début + même montant.
// Volontairement strict sur les 3 critères à la fois pour éviter les faux positifs
// (deux cachets distincts chez le même employeur le même jour, à des tarifs différents,
// ne seront pas signalés) tout en bloquant le cas réel à risque : réimporter deux fois
// la même AEM. Un mauvais comptage de cachets fausse directement le suivi des 507h.
function findDuplicateCachet(candidate, existingCachets, excludeId) {
  const norm = (s) => (s || '').trim().toLowerCase();
  const empN = norm(candidate.employeur);
  if (!empN || !candidate.dateDebut) return null;
  return existingCachets.find(c =>
    c.id !== excludeId &&
    norm(c.employeur) === empN &&
    c.dateDebut === candidate.dateDebut &&
    Number(c.montantBrut || 0) === Number(candidate.montantBrut || 0)
  ) || null;
}

function findDuplicateContact(candidate, existingContacts, excludeId) {
  const norm = (s) => (s || '').replace(/\s+/g, '').toLowerCase();
  return (existingContacts || []).find(c => c.id !== excludeId && (
    (candidate.nom && candidate.nom.trim() && norm(c.nom) === norm(candidate.nom)) ||
    (candidate.telephone && candidate.telephone.trim() && norm(c.telephone) === norm(candidate.telephone)) ||
    (candidate.email && candidate.email.trim() && norm(c.email) === norm(candidate.email))
  )) || null;
}

function findDuplicateLien(candidate, existingLiens) {
  const norm = (s) => (s || '').trim().toLowerCase().replace(/\/+$/, '');
  return (existingLiens || []).find(l => norm(l.url) === norm(candidate.url)) || null;
}

function findDuplicateExperience(candidate, existingExperiences) {
  const norm = (s) => (s || '').trim().toLowerCase();
  return (existingExperiences || []).find(e => norm(e.titre) === norm(candidate.titre) && norm(e.annee) === norm(candidate.annee)) || null;
}

function findDuplicateFormation(candidate, existingFormation) {
  const norm = (s) => (s || '').trim().toLowerCase();
  return (existingFormation || []).find(f => norm(f.intitule) === norm(candidate.intitule) && norm(f.annee) === norm(candidate.annee)) || null;
}

function parseYearForSort(str) {
  const m = (str || '').match(/\d{4}/);
  return m ? parseInt(m[0], 10) : -1;
}

function sortByYearDesc(list, key) {
  return (list || []).slice().sort((a, b) => parseYearForSort(b[key]) - parseYearForSort(a[key]));
}

function scanBulletinText(text, employeursConnus) {
  const draft = { type: 'Tournage', projet: '', employeur: '', dateDebut: '', nbCachets: 1, montantBrut: '', statut: 'Déclaré', aem: 'Reçue', notes: '' };

  const montantMatch = text.match(/salaires?\s+bruts?[^0-9]{0,20}(\d{1,6}[.,]\d{2})/i) || text.match(/(?:brut|total brut)[^0-9]{0,15}(\d{1,6}[.,]\d{2})/i);
  if (montantMatch) draft.montantBrut = montantMatch[1].replace(',', '.');

  const cachetMatch = text.match(/nombre\s+de\s+cachets?[^0-9]{0,15}(\d{1,3}(?:[.,]\d+)?)/i) || text.match(/(\d{1,3}(?:[.,]\d+)?)\s*cachets?/i) || text.match(/cachets?[^0-9]{0,15}(\d{1,3}(?:[.,]\d+)?)/i);
  if (cachetMatch) draft.nbCachets = cachetMatch[1].replace(',', '.');

  const dateEmbaucheMatch = text.match(/date\s+d['’]embauche[^0-9]{0,20}(\d{2})[\/.](\d{2})[\/.](\d{4})/i);
  const dateMatch = dateEmbaucheMatch || text.match(/(\d{2})[\/.](\d{2})[\/.](\d{4})/);
  if (dateMatch) draft.dateDebut = `${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`;

  const found = (employeursConnus || []).find(emp => text.toLowerCase().includes(emp.nom.toLowerCase()));
  if (found) {
    draft.employeur = found.nom;
    draft.type = found.typeParDefaut || draft.type;
  } else {
    const raisonMatch = text.match(/raison\s+sociale\s*:?\s*\n?\s*([A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜŸÇ][^\n]{1,60})/i);
    if (raisonMatch) draft.employeur = raisonMatch[1].trim();
  }

  return draft;
}

const CV_FIELD_LIST = ['PRENOM', 'NOM', 'DATE_NAISSANCE', 'METIER', 'EMAIL', 'TELEPHONE', 'DEMO', 'TAILLE', 'POIDS', 'VESTE', 'PANTALON', 'POINTURE', 'TETE', 'COU', 'POITRINE', 'TOUR_DE_TAILLE', 'PERMIS', 'TATOUAGE', 'FORMATION', 'LANGUES', 'COMPETENCES', 'FILMOGRAPHIE'];

const CV_FORMAT_PROMPT = `Tu es un assistant qui aide un comédien à structurer les informations de son profil professionnel (CV / fiche technique) dans un format précis, à partir de n'importe quelle source (CV existant, texte libre, notes en vrac).

- Réponds UNIQUEMENT avec le bloc structuré ci-dessous rempli, sans aucun commentaire ni explication autour.

Format exact à respecter (garde les libellés en MAJUSCULES tels quels, un champ par ligne — FORMATION, LANGUES et COMPETENCES peuvent tenir sur plusieurs lignes jusqu'au champ suivant) :

Voici les informations à partir desquelles remplir ce format (CV, texte libre, etc.) :

function parseCvCanonicalText(text) {
  const fieldRegex = new RegExp('^(' + CV_FIELD_LIST.join('|') + ')\\s*:\\s*(.*)$');
  const result = {};
  let currentField = null;
  for (const rawLine of (text || '').split(/\r?\n/)) {
    const line = rawLine.trim();
    const m = line.match(fieldRegex);
    if (m) { currentField = m[1]; result[currentField] = m[2] || ''; }
    else if (currentField && line) { result[currentField] = (result[currentField] ? result[currentField] + '\n' : '') + line; }
  }
  Object.keys(result).forEach(k => { result[k] = result[k].trim(); });
  return result;
}

function cvFieldsToProfilePatch(result) {
  const patch = { mensurations: {}, logistique: {}, cvPro: {} };
  if (result.PRENOM) patch.prenom = result.PRENOM;
  if (result.NOM) patch.nom = result.NOM;
  if (result.DATE_NAISSANCE) {
    const m = result.DATE_NAISSANCE.match(/(\d{2})[\/.](\d{2})[\/.](\d{4})/);
    if (m) patch.dateNaissance = `${m[3]}-${m[2]}-${m[1]}`;
  }
  if (result.METIER) patch.metier = result.METIER;
  if (result.EMAIL) patch.email = result.EMAIL;
  if (result.TELEPHONE) patch.telephone = result.TELEPHONE;
  if (result.DEMO) patch.liens = [{ id: uid(), label: 'Démo', url: result.DEMO }];
  [['TAILLE', 'taille'], ['POIDS', 'poids'], ['VESTE', 'veste'], ['PANTALON', 'pantalon'], ['POINTURE', 'pointure'], ['TETE', 'tete'], ['COU', 'cou'], ['POITRINE', 'poitrine'], ['TOUR_DE_TAILLE', 'tourTaille']].forEach(([key, field]) => {
    if (result[key]) patch.mensurations[field] = result[key];
  });
  if (result.PERMIS) patch.logistique.permis = /oui/i.test(result.PERMIS);
  if (result.TATOUAGE) patch.logistique.tatouage = /oui/i.test(result.TATOUAGE);
  if (result.FORMATION) {
    patch.cvPro.formation = result.FORMATION.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const parts = line.replace(/^[-•]\s*/, '').split('|').map(s => s.trim());
      return { id: uid(), intitule: parts[0] || '', annee: parts[1] || '' };
    });
  }
  if (result.LANGUES) patch.cvPro.langues = result.LANGUES;
  if (result.COMPETENCES) patch.cvPro.competences = result.COMPETENCES;
  if (result.FILMOGRAPHIE) {
    patch.cvPro.experiences = result.FILMOGRAPHIE.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const parts = line.replace(/^[-•]\s*/, '').split('|').map(s => s.trim());
      return { id: uid(), titre: parts[0] || '', role: parts[1] || '', annee: parts[2] || '', type: parts[3] || 'Autre' };
    });
  }
  return patch;
}

function applyProfilePatch(profile, patch, forceOverwrite) {
  const next = { ...profile, mensurations: { ...profile.mensurations }, logistique: { ...profile.logistique }, cvPro: { ...profile.cvPro } };
  ['prenom', 'nom', 'dateNaissance', 'metier', 'email', 'telephone'].forEach(k => {
    if (patch[k] !== undefined && patch[k] !== '' && (forceOverwrite || !next[k])) next[k] = patch[k];
  });
  if (patch.liens && patch.liens.length) {
    if (forceOverwrite) next.liens = patch.liens;
    else {
      const nouveaux = patch.liens.filter(l => !findDuplicateLien(l, next.liens));
      next.liens = [...(next.liens || []), ...nouveaux];
    }
  }
  Object.keys(patch.mensurations || {}).forEach(k => {
    if (forceOverwrite || !next.mensurations[k]) next.mensurations[k] = patch.mensurations[k];
  });
  ['permis', 'tatouage'].forEach(k => {
    if (patch.logistique && patch.logistique[k] !== undefined && (forceOverwrite || !next.logistique[k])) next.logistique[k] = patch.logistique[k];
  });
  if (patch.logistique && patch.logistique.notes && (forceOverwrite || !next.logistique.notes)) next.logistique.notes = patch.logistique.notes;
  ['langues', 'competences'].forEach(k => {
    if (patch.cvPro && patch.cvPro[k] && (forceOverwrite || !next.cvPro[k])) next.cvPro[k] = patch.cvPro[k];
  });
  if (patch.cvPro && patch.cvPro.formation && patch.cvPro.formation.length) {
    if (forceOverwrite) next.cvPro.formation = patch.cvPro.formation;
    else {
      const nouvelles = patch.cvPro.formation.filter(f => !findDuplicateFormation(f, next.cvPro.formation));
      next.cvPro.formation = [...(next.cvPro.formation || []), ...nouvelles];
    }
  }
  if (patch.cvPro && patch.cvPro.experiences && patch.cvPro.experiences.length) {
    if (forceOverwrite) next.cvPro.experiences = patch.cvPro.experiences;
    else {
      const nouvelles = patch.cvPro.experiences.filter(exp => !findDuplicateExperience(exp, next.cvPro.experiences));
      next.cvPro.experiences = [...(next.cvPro.experiences || []), ...nouvelles];
    }
  }
  return next;
}

const ThemeContext = createContext({ theme: 'clair', toggle: () => {} });
function useTheme() { return useContext(ThemeContext); }

const ACCENT_OPTIONS = [
  { id: 'teal', label: 'Teal' },
  { id: 'violet', label: 'Violet' },
  { id: 'blue', label: 'Bleu' },
  { id: 'amber', label: 'Ambre' },
  { id: 'emerald', label: 'Émeraude' },
];

// Variable de module plutôt qu'un paramètre : themeClasses(theme) est appelé à ~30
// endroits dans le fichier, refaire passer un accent partout serait risqué. App()
// met à jour cette variable en tout début de rendu, avant que le moindre enfant
// n'appelle themeClasses — React rendant toujours le parent avant ses enfants dans
// une même passe synchrone, la valeur est garantie à jour partout où elle est lue.
let currentAccent = 'teal';

function themeClasses(theme) {
  const c = currentAccent;
  if (theme === 'sombre') {
    return {
      bg: 'bg-[#0a0a0a]', panel: 'bg-[#161616]', panelBorder: 'border-[#2a2a2a]',
      text: 'text-[#f0efec]', textMuted: 'text-[#9a9894]', accent: `text-${c}-400`,
      input: 'bg-[#161616] border-[#2a2a2a] text-[#f0efec] placeholder-[#666]',
      btnPrimary: `bg-${c}-500 hover:bg-${c}-400 text-[#0a0a0a] font-semibold`,
      btnGhost: `hover:bg-[#1e1e1e] text-[#e2e0dc]`,
      cardHover: `hover:bg-[#1a1a1a]`,
      soft: `!bg-[#1a1a1a]`,
      headerGrad: `!bg-${c}-800`,
      ring: `focus:ring-${c}-400/50`,
    };
  }
  return {
    bg: 'bg-[#FAF9F5]', panel: 'bg-white', panelBorder: `border-${c}-100`,
    text: 'text-stone-900', textMuted: 'text-stone-500', accent: `text-${c}-700`,
    input: 'bg-white border-stone-200 text-stone-900 placeholder-stone-400',
    btnPrimary: `bg-${c}-700 hover:bg-${c}-600 text-white font-semibold`,
    btnGhost: `hover:bg-${c}-50 text-stone-700`,
    cardHover: `hover:bg-${c}-50/60`,
    soft: `!bg-${c}-50/70`,
    headerGrad: `!bg-${c}-700`,
    ring: `focus:ring-${c}-400/50`,
  };
}

/* ================= Composants UI génériques ================= */

function Btn({ variant = 'primary', onClick, children, className = '', type = 'button', title, disabled }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const base = 'inline-flex items-center justify-center gap-1.5 rounded-full px-4 py-2.5 text-sm font-medium transition active:scale-95';
  const styles = variant === 'primary' ? t.btnPrimary : variant === 'danger' ? 'bg-red-600 hover:bg-red-500 text-white' : t.btnGhost;
  return <button type={type} title={title} onClick={onClick} disabled={disabled} className={cx(base, styles, disabled ? 'opacity-40 pointer-events-none' : '', className)}>{children}</button>;
}

function IconBtn({ name, onClick, title, className = '', danger, active }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (
    <button type="button" title={title} onClick={onClick}
      className={cx('p-2.5 rounded-full transition active:scale-90', active ? 'text-amber-500 hover:bg-amber-500/10' : danger ? 'text-red-500 hover:bg-red-500/10' : t.btnGhost, className)}>
      <Icon name={name} size={18} />
    </button>
  );
}

function ConfirmDeleteButton({ onConfirm, title = 'Supprimer' }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [confirming, setConfirming] = useState(false);
  useEffect(() => {
    if (!confirming) return;
    const timer = setTimeout(() => setConfirming(false), 6000);
    return () => clearTimeout(timer);
  }, [confirming]);
  if (confirming) {
    return (
      <div className="flex items-center gap-1">
        <button type="button" title="Confirmer la suppression" onClick={(e) => { e.stopPropagation(); onConfirm(); setConfirming(false); }}
          className="p-2.5 rounded-full bg-red-600 hover:bg-red-500 text-white transition active:scale-90">
          <Icon name="check" size={16} />
        </button>
        <button type="button" title="Annuler" onClick={(e) => { e.stopPropagation(); setConfirming(false); }}
          className={cx('p-2.5 rounded-full transition active:scale-90', t.btnGhost)}>
          <Icon name="x" size={16} />
        </button>
      </div>
    );
  }
  return <IconBtn name="trash" danger title={title} onClick={(e) => { e.stopPropagation(); setConfirming(true); }} />;
}

function Field({ label, children, className = '' }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  return (

/* ================= Calculs intermittence ================= */

function computeStats(cachets) {
  const now = new Date();
  const yearAgo = new Date(now); yearAgo.setDate(yearAgo.getDate() - 365);
  const recent = cachets.filter(cc => cc.dateDebut && new Date(cc.dateDebut) >= yearAgo && new Date(cc.dateDebut) <= now);

  const byMonth = {};
  recent.forEach(cc => {
    const key = cc.dateDebut.slice(0, 7);
    byMonth[key] = (byMonth[key] || 0) + (Number(cc.nbCachets) || 0);
  });
  // Plafond de 28 cachets/mois (Annexe X, art. 3§1) : quand le mois n'est que
  // partiellement compris dans la fenêtre glissante de 12 mois (le plus ancien et le
  // mois en cours), le plafond est proratisé au nombre de jours réellement compris,
  // au prorata de 28/20,8 — sinon on plafonnerait un mois partiel comme un mois plein.
  let cachetsComptes = 0;
  Object.entries(byMonth).forEach(([key, n]) => {
    const [y, m] = key.split('-').map(Number);
    const monthStart = new Date(y, m - 1, 1);
    const monthEnd = new Date(y, m, 0);
    const totalJoursMois = monthEnd.getDate();
    const debutFenetre = monthStart < yearAgo ? yearAgo : monthStart;
    const finFenetre = monthEnd > now ? now : monthEnd;
    const joursInclus = Math.max(0, Math.round((finFenetre - debutFenetre) / 86400000) + 1);
    const plafond = joursInclus >= totalJoursMois ? MAX_CACHETS_MOIS : Math.floor((MAX_CACHETS_MOIS / 20.8) * joursInclus);
    cachetsComptes += Math.min(n, plafond);
  });

  // Certains contrats sont déclarés en heures directes plutôt qu'en cachets (ex.
  // technicien, ou AEM qui ne renseigne que les heures) — elles comptent aussi
  // pour les 507h, sans passer par la conversion cachet -> 12h ni le plafond mensuel.
  const heuresDirectes = recent.reduce((s, cc) => s + (Number(cc.heures) || 0), 0);
  const heures = cachetsComptes * CACHET_HOURS + heuresDirectes;
  const cumulBrut = recent.reduce((s, cc) => s + (Number(cc.montantBrut) || 0), 0);
  const tauxHoraire = heures > 0 ? cumulBrut / heures : 0;
  const cachetsManquants = Math.max(0, Math.ceil((SEUIL_HEURES - heures) / CACHET_HOURS));
  const sjrEstime = cumulBrut / 365;

  let joursAvantSortie = null, dateSortie = null;
  const datesTriees = recent.map(cc => cc.dateDebut).filter(Boolean).sort();
  if (datesTriees.length) {
    const oldest = datesTriees[0];
    const exitDate = new Date(oldest); exitDate.setDate(exitDate.getDate() + 365);
    dateSortie = exitDate;
    joursAvantSortie = Math.ceil((exitDate - now) / 86400000);
  }
  const moisCourant = now.toISOString().slice(0, 7);
  const cachetsMoisCourant = byMonth[moisCourant] || 0;
  return { heures, heuresDirectes, cachetsComptes, cumulBrut, tauxHoraire, cachetsManquants, sjrEstime, joursAvantSortie, dateSortie, cachetsMoisCourant };
}

// Récap par année civile (déclaration/impôts) — indépendant des 12 mois glissants
// utilisés pour les 507h, qui ne couvrent qu'une fenêtre récente.
function computeRecapAnnuel(cachets) {
  const byYear = {};
  cachets.forEach(cc => {
    if (!cc.dateDebut) return;
    const year = cc.dateDebut.slice(0, 4);
    if (!byYear[year]) byYear[year] = { nbCachets: 0, brut: 0 };
    byYear[year].nbCachets += Number(cc.nbCachets) || 0;
    byYear[year].brut += Number(cc.montantBrut) || 0;
  });
  return Object.entries(byYear).map(([year, v]) => ({ year, ...v })).sort((a, b) => b.year.localeCompare(a.year));
}

/* ================= Parsing de texte théâtral ================= */

// Parsing inspiré du protocole CEAD (noms de personnages en capitales, didascalies
// attachées après une virgule ou entre parenthèses). Traite le texte paragraphe par
// paragraphe (séparés par une ligne vide) : un paragraphe qui commence par un nom
// détecté ouvre une nouvelle réplique, sinon il prolonge le personnage courant.
function parseScript(raw) {
  const NAME = "A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜŸÇ";
  const LOWER = "a-zàâäéèêëîïôöùûüÿç";
  // Nom de personnage : capitales, chiffres, apostrophe, tiret, espaces, et "/" pour
  // les libellés combinés type "NADYA/SPECTATRICE" (personnages du public, doublons...).
  const NAMECHARS = `[${NAME}][${NAME}0-9'’\\-\\/\\s]{0,40}?`;
  // Annotation parenthésée optionnelle juste après le nom : (off), (voix off), (à part)...
  const ANNOT = `(?:\\s*\\(([^()]{1,30})\\))?`;
  const cueOwnLine = new RegExp(`^(${NAMECHARS})${ANNOT}\\s*[:.]?\\s*$`);
  const cueWithDidascalie = new RegExp(`^(${NAMECHARS}),\\s*([${LOWER}][^${NAME}]*)(?:\\s+([${NAME}].*))?$`);
  const inlineColonRegex = new RegExp(`^(${NAMECHARS})${ANNOT}\\s*:\\s*(.+)$`);
  const inlineDashRegex = new RegExp(`^(${NAMECHARS})${ANNOT}\\s+[-–]\\s+(.+)$`);
  const spacedRegex = new RegExp(`^(${NAMECHARS})${ANNOT}\\s{2,}(\\S.*)$`);

  // Une ligne entièrement entre parenthèses, ou entièrement en capitales (sans
  // minuscule), qui n'a pas matché de réplique : c'est une didascalie autonome ou un
  // titre/en-tête (ACTE, SCÈNE, "Lancer T1"...), pas la suite de la réplique en cours.
  const isFullyParenLine = (line) => /^\([^()]*\)$/.test(line);
  const isHeadingLine = (line) => {
    if (new RegExp(`[${LOWER}]`).test(line)) return false;
    if (!new RegExp(`[${NAME}]`).test(line)) return false;
    return line.length <= 70;
  };
  // Indications techniques courtes qui ne sont ni en capitales ni entre parenthèses
  // (repères de lumière, sections d'un même script) : "Lancer T1", "Présentation"...
  const STAGE_MARKERS = /^(présentation|distribution|note de mise en scène|lancer\s+t\d+|baisser\s+t\d+|remonter\s+(puis\s+)?baisser\s+t\d+|noir\.?|fin\.?)$/i;
  // Aucun personnage ne s'appelle "Acte", "Scène"... — un nom qui commence par un de
  // ces mots est toujours un repère de structure ("ACTE I - OUVERTURE", "Scène 3"),
  // même court, jamais une réplique — quel que soit le motif qui a matché la ligne.
  const STRUCTURE_WORD = /^(acte|scène|scene|chapitre|partie|prologue|épilogue|epilogue|tableau|entracte)\b/i;
  // Balises explicites facultatives : quand les heuristiques ne suffisent pas (ex. une
  // didascalie en minuscules, sans parenthèses), l'utilisateur peut forcer le résultat
  // en préfixant la ligne. Prioritaire sur tout le reste, casse indifférente.
  const BRACKET_TAG = /^\[(titre|régie|regie|didascalie|note)\]\s*(.*)$/i;

  // Détecte si une ligne est une "réplique" (nom de personnage + éventuellement le
  // début de son texte). Appelé sur CHAQUE ligne (pas juste la 1re d'un paragraphe) :
  // beaucoup de scripts collent "NOM : réplique" ligne par ligne sans ligne vide entre
  // deux personnages, et s'arrêter à la 1re ligne fusionnait la 2e réplique dans la 1re.
  const matchCue = (line) => {
    const r = matchCueRaw(line);
    return (r && STRUCTURE_WORD.test(r.personnage)) ? null : r;
  };
  const matchCueRaw = (line) => {
    let m = line.match(inlineColonRegex);
    if (m) return { personnage: m[1].trim(), annotation: m[2] || '', reste: m[3].trim() };
    m = line.match(inlineDashRegex);
    // La suite doit contenir au moins une minuscule (vraie réplique), sinon on risque de
    // confondre un titre du style "ACTE I - LA FABRIQUE DES FANTÔMES" avec une réplique.
    if (m && new RegExp(`[${LOWER}]`).test(m[3])) return { personnage: m[1].trim(), annotation: m[2] || '', reste: m[3].trim() };
    m = line.match(cueWithDidascalie);
    if (m) {
      let didasc = m[2].trim();
      let reste = m[3] ? m[3].trim() : '';
      // Un seul mot court après la didascalie (ex. un nom propre cité dedans, "regardant
      // Léna.") ressemble plus à la fin de la didascalie qu'à une réplique : on ne le
      // détache pas. On ne coupe que quand la suite a plusieurs mots (vraie phrase).
      if (reste && !/\s/.test(reste) && reste.length <= 15) {
        didasc = (didasc + ' ' + reste).trim();
        reste = '';
      }
      return { personnage: m[1].trim(), annotation: '', didascalieEntree: didasc, reste };
    }
    m = line.match(cueOwnLine);
    // Un nom de personnage tient en peu de mots ; au-delà, une ligne toute en capitales
    // est bien plus probablement un titre/en-tête ("ACTE I - LA FABRIQUE DES FANTÔMES")
    // qu'un nom de personnage — on la laisse retomber sur la détection de titre.
    if (m && m[1].trim().split(/\s+/).length <= 5) return { personnage: m[1].trim(), annotation: m[2] || '', reste: '' };
    m = line.match(spacedRegex);
    if (m) return { personnage: m[1].trim(), annotation: m[2] || '', reste: m[3].trim() };
    return null;
  };

  const paragraphs = (raw || '').split(/\n\s*\n/);
  const blocks = [];
  let currentChar = null;

  for (const para of paragraphs) {
    const lines = para.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;

    let pending = null;
    const flush = () => {
      if (!pending) return;
      blocks.push({ id: uid(), personnage: pending.personnage, didascalieEntree: pending.didascalieEntree, texte: pending.texteParts.filter(Boolean).join(' ').trim(), note: '' });
      currentChar = pending.personnage;
      pending = null;
    };

    for (const line of lines) {
      const tagged = line.match(BRACKET_TAG);
      if (tagged) {
        flush();
        if (tagged[2]) blocks.push({ id: uid(), personnage: 'Didascalie', didascalieEntree: '', texte: tagged[2], note: '' });
        continue;
      }
      const cue = matchCue(line);
      if (cue) {
        flush();
        const didascalieEntree = cue.annotation ? `(${cue.annotation})` : (cue.didascalieEntree || '');
        pending = { personnage: cue.personnage, didascalieEntree, texteParts: cue.reste ? [cue.reste] : [] };
      } else if (isFullyParenLine(line) || isHeadingLine(line) || STAGE_MARKERS.test(line) || (STRUCTURE_WORD.test(line) && line.length <= 70)) {
        flush();
        blocks.push({ id: uid(), personnage: 'Didascalie', didascalieEntree: '', texte: line, note: '' });
      } else if (pending) {
        pending.texteParts.push(line);
      } else {
        pending = { personnage: currentChar || 'Non attribué', didascalieEntree: '', texteParts: [line] };
      }
    }
    flush();
  }
  return blocks;
}

// Découpe un texte en segments pour l'affichage : les passages entre parenthèses
// (didascalies CEAD dans la réplique) ressortent en italique.
function renderTexteAvecDidascalies(texte) {
  const parts = (texte || '').split(/(\([^)]*\))/g);
  return parts.map((part, i) => /^\(.*\)$/.test(part) ? <em key={i}>{part}</em> : <React.Fragment key={i}>{part}</React.Fragment>);
}

// "(off)" vient d'une annotation entre parenthèses : on l'affiche telle quelle.
// "entrant" vient d'une didascalie CEAD après virgule : on rétablit la virgule.
function didascalieSeparator(text) {
  return text.startsWith('(') ? ' ' : ' , ';
}

// Couleurs de surlignage auto des répliques d'un personnage : fonds pastel clairs
// + texte forcé en gris très foncé, pour rester lisible quel que soit le thème
// (clair ou sombre) de l'appli — jamais de texte clair sur fond clair.
const HIGHLIGHT_COLORS = [
  { key: 'jaune', label: 'Jaune', bg: '#fde68a' },
  { key: 'vert', label: 'Vert', bg: '#bbf7d0' },
  { key: 'bleu', label: 'Bleu', bg: '#bae6fd' },
  { key: 'rose', label: 'Rose', bg: '#fbcfe8' },
  { key: 'violet', label: 'Violet', bg: '#ddd6fe' },
  { key: 'orange', label: 'Orange', bg: '#fed7aa' },
];
function highlightColorBg(key) {
  return (HIGHLIGHT_COLORS.find(c => c.key === key) || HIGHLIGHT_COLORS[0]).bg;
}
const HIGHLIGHT_TEXT_COLOR = '#1e293b';

// Onglets de lecture d'un texte : largeur égale pour tous (grid 4 colonnes), quel que
// soit la longueur du libellé — évite l'effet "tailles au hasard" de boutons empilés.
const READING_MODE_TABS = [
  { key: 'isoler', label: 'Isoler', icon: 'tag' },
  { key: 'lecture', label: 'Répéter', icon: 'mic' },
  { key: 'complet', label: 'Texte', icon: 'book' },
  { key: 'prompteur', label: 'Prompteur', icon: 'film' },
];

function estimerLecture(blocks) {
  const texteComplet = blocks.filter(b => b.personnage !== 'Didascalie').map(b => b.texte).join(' ');
  const mots = texteComplet.trim() ? texteComplet.trim().split(/\s+/).length : 0;
  return { mots, lent: Math.ceil(mots / 110), normal: Math.ceil(mots / 140), rapide: Math.ceil(mots / 170) };
}

  const [searchCachet, setSearchCachet] = useState('');
  const scanRef = useRef(null);
  const stats = useMemo(() => computeStats(data.cachets), [data.cachets]);
  const recapAnnuel = useMemo(() => computeRecapAnnuel(data.cachets), [data.cachets]);
  const age = computeAge(data.profile.dateNaissance);

  const scanBulletins = async (e) => {
    const files = [...e.target.files];
    if (!files.length) return;
    setScanStatus(`Analyse de ${files.length} fichier(s)…`);
    const drafts = [];
    for (const file of files) {
      try {
        const text = await extractPdfText(file);
        const draft = scanBulletinText(text, data.employeurs);
        const isDuplicate = !!findDuplicateCachet(draft, [...data.cachets, ...drafts]);
        drafts.push({ ...draft, fileName: file.name, selected: !isDuplicate, isDuplicate });
      } catch (err) {
        console.error(err);
        drafts.push({ type: 'Tournage', projet: '', employeur: '', dateDebut: '', nbCachets: 1, montantBrut: '', statut: 'Déclaré', aem: 'Reçue', notes: '', fileName: file.name, selected: false, isDuplicate: false, error: true });
      }
    }
    setScanStatus('');
    setBulkDrafts(drafts);
    if (scanRef.current) scanRef.current.value = '';
  };

  const toggleBulkDraft = (i) => setBulkDrafts(prev => prev.map((d, idx) => idx === i ? { ...d, selected: !d.selected } : d));

  const confirmBulkImport = () => {
    const toAdd = bulkDrafts.filter(d => d.selected && !d.error);
    setData(d => {
      let cachets = d.cachets, employeurs = d.employeurs;
      toAdd.forEach(({ fileName, selected, isDuplicate, error, ...cachetFields }) => {
        cachets = [...cachets, { id: uid(), ...cachetFields }];
        const nom = (cachetFields.employeur || '').trim();
        if (nom) {
          const idx = employeurs.findIndex(emp => emp.nom.toLowerCase() === nom.toLowerCase());
          employeurs = idx === -1
            ? [...employeurs, { id: uid(), nom, typeParDefaut: cachetFields.type }]
            : employeurs.map((emp, i) => i === idx ? { ...emp, typeParDefaut: cachetFields.type } : emp);
        }
      });
      return { ...d, cachets, employeurs };
    });
    setBulkDrafts(null);
  };

  const upsertEmployeur = (v) => {
    setData(d => {
      if (empModal.editingId) {
        return { ...d, employeurs: d.employeurs.map(e => e.id === empModal.editingId ? { ...e, ...v } : e) };
      }
      const nom = v.nom.trim();
      const dupIdx = d.employeurs.findIndex(e => e.nom.trim().toLowerCase() === nom.toLowerCase());
      const employeurs = dupIdx === -1
        ? [...d.employeurs, { id: uid(), ...v, nom }]
        : d.employeurs.map((e, i) => i === dupIdx ? { ...e, ...v, nom: e.nom } : e);
      return { ...d, employeurs };
    });
    setEmpModal(null);
  };
  const removeEmployeur = (id) => setData(d => ({ ...d, employeurs: d.employeurs.filter(e => e.id !== id) }));

  const upsertCachet = (v) => {
    if (!modal.editingId) {
      const dup = findDuplicateCachet(v, data.cachets);
      if (dup) {
        const proceed = window.confirm(`⚠️ Un cachet quasi identique existe déjà : "${dup.employeur}" le ${fmtDate(dup.dateDebut)} pour ${fmtEuros(dup.montantBrut)}. Ajouter quand même ce nouveau cachet (risque de doublon) ?`);
        if (!proceed) return;
      }
    }
    setData(d => {
      const cachets = modal.editingId
        ? d.cachets.map(c => c.id === modal.editingId ? { ...c, ...v } : c)
        : [...d.cachets, { id: uid(), ...v }];
      let employeurs = d.employeurs;
      if (v.employeur && v.employeur.trim()) {
        const nom = v.employeur.trim();
        const idx = employeurs.findIndex(emp => emp.nom.toLowerCase() === nom.toLowerCase());
        employeurs = idx === -1
          ? [...employeurs, { id: uid(), nom, typeParDefaut: v.type }]
          : employeurs.map((emp, i) => i === idx ? { ...emp, typeParDefaut: v.type } : emp);
      }
      return { ...d, cachets, employeurs };
    });
    setModal(null);
  };
  const removeCachet = (id) => {
    setData(d => ({ ...d, cachets: d.cachets.filter(c => c.id !== id) }));
  };

  const sorted = [...data.cachets].sort((a, b) => (b.dateDebut || '').localeCompare(a.dateDebut || ''));
  const moisDisponibles = Array.from(new Set(data.cachets.filter(c => c.dateDebut).map(c => c.dateDebut.slice(0, 7)))).sort().reverse();
  const sortedFiltered = sorted.filter(cc => {
    const matchMois = filterMois === 'Tous' || (cc.dateDebut && cc.dateDebut.slice(0, 7) === filterMois);
    const q = searchCachet.trim().toLowerCase();
    const matchSearch = !q || (cc.employeur || '').toLowerCase().includes(q) || (cc.projet || '').toLowerCase().includes(q);
    return matchMois && matchSearch;
  });
  const pct = Math.min(100, (stats.heures / SEUIL_HEURES) * 100);

  const now = new Date();
  const next15 = new Date(now.getFullYear(), now.getMonth(), 15);
  if (now.getDate() >= 15) next15.setMonth(next15.getMonth() + 1);
  const joursActualisation = Math.ceil((next15 - now) / 86400000);

  const exportCachetsPdf = () => {
    const el = document.getElementById('print-root');
    el.innerHTML = '';
    const accent = '#0f766e';
    const h2 = `font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:${accent};font-weight:700;border-bottom:1.5px solid ${accent};padding-bottom:4px;margin:22px 0 10px;`;
    const parYear = recapAnnuel.map(r => ({ ...r, items: sorted.filter(cc => (cc.dateDebut || '').slice(0, 4) === r.year) }));
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family: Helvetica, Arial, sans-serif; color:#1a1a1a; max-width:760px; line-height:1.5;';
    wrap.innerHTML = `
      <div style="border-bottom:3px solid ${accent};padding-bottom:16px;">
        <div style="font-size:26px;font-weight:700;letter-spacing:-0.3px;">${data.profile.prenom || ''} ${data.profile.nom || ''}</div>
        <div style="font-size:14px;color:${accent};font-weight:600;margin-top:2px;">Cachets &amp; contrats — ${data.cachets.length} au total</div>
      </div>
      ${parYear.map(y => `
        <h2 style="${h2}">${y.year} — ${fmtEuros(y.brut)} brut · ${y.nbCachets} cachet(s)</h2>
        <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
          <thead><tr style="text-align:left;color:#888;font-size:11px;text-transform:uppercase;">
            <th style="padding:4px 6px 4px 0;">Date</th><th style="padding:4px 6px;">Employeur / Projet</th><th style="padding:4px 6px;">Type</th><th style="padding:4px 6px;text-align:right;">Montant</th><th style="padding:4px 0 4px 6px;">Statut</th>
          </tr></thead>
          <tbody>
            ${y.items.map(cc => `
              <tr style="border-top:1px solid #eee;">
                <td style="padding:5px 6px 5px 0;white-space:nowrap;">${fmtDate(cc.dateDebut)}</td>
                <td style="padding:5px 6px;">${[cc.employeur, cc.projet].filter(Boolean).join(' — ') || '—'}</td>
                <td style="padding:5px 6px;">${cc.type}${Number(cc.nbCachets) > 0 ? ` · ${cc.nbCachets} cachet(s)` : ''}${Number(cc.heures) > 0 ? ` · ${cc.heures}h` : ''}</td>
                <td style="padding:5px 6px;text-align:right;white-space:nowrap;">${fmtEuros(cc.montantBrut)}</td>
                <td style="padding:5px 0 5px 6px;">${cc.statut} · AEM ${cc.aem}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `).join('')}
    `;
    el.appendChild(wrap);
    setTimeout(() => window.print(), 50);
  };

  const hasRealData = data.cachets.length > 0 || data.textes.length > 0;
  const joursDepuisSauvegarde = lastBackupAt ? Math.floor((now - lastBackupAt) / 86400000) : null;
  const shouldRemindBackup = hasRealData && (joursDepuisSauvegarde === null || joursDepuisSauvegarde > 30);

  return (
    <div className="space-y-3 pb-4">
      {shouldRemindBackup && (
        <Card className={cx('flex items-center gap-3', t.soft)}>
          <Icon name="download" size={20} className={t.accent} />
          <div className="text-xs flex-1">
            <strong className={t.accent}>Sauvegarde</strong> — {joursDepuisSauvegarde === null ? "tu n'as jamais exporté tes données" : `dernière sauvegarde il y a ${joursDepuisSauvegarde} jour(s)`}, pense à en faire une pour ne rien perdre en cas de changement de téléphone.
          </div>
          <Btn variant="ghost" onClick={onOpenSettings} className="shrink-0">Réglages</Btn>
        </Card>
      )}
      {joursActualisation <= 5 && (
        <Card className={cx('flex items-center gap-3', t.soft)}>
          <Icon name="clock" size={20} className={t.accent} />
          <div className="text-xs">
            <strong className={t.accent}>Actualisation France Travail</strong> — plus que {joursActualisation} jour(s) avant le 15, pense à actualiser ta situation.
          </div>
        </Card>
      )}
      <Card className={cx('text-white overflow-hidden relative', t.headerGrad)}>
        <div className="text-sm font-medium opacity-90 mb-1">Les 507 heures</div>
        <div className="w-full h-3 rounded-full overflow-hidden mb-2 bg-black/20">
          <div className="h-full bg-white" style={{ width: pct + '%' }} />
        </div>
        <div className="text-sm opacity-90">{stats.heures}h / {SEUIL_HEURES}h sur les 12 derniers mois glissants</div>
        {stats.heuresDirectes > 0 && (
          <div className="text-xs opacity-75 mt-0.5">dont {stats.heuresDirectes}h déclarées directement en heures (hors cachets)</div>
        )}
        <div className="grid grid-cols-2 gap-3 mt-4">
          <div>
            <div className="text-xs opacity-80">Cachets manquants</div>
            <div className="text-3xl font-bold">{stats.cachetsManquants}</div>
          </div>
          <div>
            <div className="text-xs opacity-80">Taux horaire moyen</div>
            <div className="text-3xl font-bold">{fmtEuros(stats.tauxHoraire)}</div>
          </div>
        </div>
        {stats.joursAvantSortie !== null && (
          <div className="mt-3 text-xs rounded-lg p-2 bg-black/20">
            Dans {stats.joursAvantSortie} jour(s) ({fmtDate(stats.dateSortie)}), ton cachet le plus ancien sortira de la période de calcul des 507h.
          </div>
        )}
        {stats.cachetsMoisCourant >= MAX_CACHETS_MOIS - 3 && (
          <div className="mt-2 text-xs rounded-lg p-2 bg-black/20">
            ⚠️ {stats.cachetsMoisCourant} cachet(s) ce mois-ci — le plafond pris en compte est de {MAX_CACHETS_MOIS}/mois, les suivants ne compteront plus dans le calcul des heures.
          </div>
        )}
        <div className="mt-2 text-xs rounded-lg p-2.5 bg-black/20">
          <div className="flex items-center justify-between gap-2">
            <span className="opacity-90">Ma date de fin de droits</span>
            <input type="date" value={data.dateFinDroits || ''} onChange={(e) => setData(d => ({ ...d, dateFinDroits: e.target.value }))} className="bg-white text-stone-900 rounded-lg px-2 py-1 text-xs shrink-0" />
          </div>
          {data.dateFinDroits && (
            <div className="opacity-80 mt-1">
              {(() => {
                const jours = Math.ceil((new Date(data.dateFinDroits) - new Date()) / 86400000);
                return jours >= 0 ? `Dans ${jours} jour(s) — pense à renouveler tes droits avant cette date.` : "Date dépassée — pense à la mettre à jour après ton renouvellement.";
              })()}
            </div>
          )}
        </div>
      </Card>

      <Card>
        <button className="w-full flex items-center justify-between" onClick={() => setShowAllocation(s => !s)}>
          <span className="text-sm font-semibold flex items-center gap-1.5">Estimation allocation <span className={cx('text-xs font-normal', t.textMuted)}>(indicative)</span></span>
          <Icon name={showAllocation ? 'chevronUp' : 'chevronDown'} size={16} className={t.textMuted} />
        </button>
        {showAllocation && (() => {
          const alloc = computeAllocationAnnexe10(stats.cumulBrut, stats.heures);
          return (
          <div className="mt-3">
            <div className="grid grid-cols-2 gap-3 text-center mb-3">
              <div className={cx('rounded-xl p-3', t.soft)}>
                <div className={cx('text-xs', t.textMuted)}>Estimée brute</div>
                <div className="text-2xl font-bold">{fmtEuros(alloc.ajFinale)}</div>
                <div className={cx('text-xs', t.textMuted)}>par jour</div>
              </div>
              <div className={cx('rounded-xl p-3', t.soft)}>
                <div className={cx('text-xs', t.textMuted)}>Estimée nette</div>
                <div className={cx('text-2xl font-bold', t.accent)}>{fmtEuros(alloc.ajNetteEstimee)}</div>
                <div className={cx('text-xs', t.textMuted)}>par jour</div>
              </div>
            </div>
            {alloc.plancherApplique && <div className={cx('text-xs mb-2', t.textMuted)}>Plancher annexe 10 appliqué (44 €/j minimum garanti).</div>}
            {alloc.plafondApplique && <div className={cx('text-xs mb-2', t.textMuted)}>Plafond appliqué (174,80 €/j).</div>}
            <button onClick={() => setShowAllocDetail(s => !s)} className={cx('text-xs font-medium flex items-center gap-1', t.accent)}>
              {showAllocDetail ? 'Masquer le détail du calcul' : 'Voir le détail du calcul'}
              <Icon name={showAllocDetail ? 'chevronUp' : 'chevronDown'} size={13} />
            </button>
            {showAllocDetail && (
              <div className="mt-2 space-y-2">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <div className={cx('text-xs', t.textMuted)}>Salaire de référence (SR)</div>
                    <div className="font-semibold">{fmtEuros(stats.cumulBrut)}</div>
                  </div>
                  <div>
                    <div className={cx('text-xs', t.textMuted)}>Heures travaillées (NH)</div>
                    <div className="font-semibold">{stats.heures} h</div>
                  </div>
                </div>
                <div className={cx('rounded-xl p-3 space-y-1.5 text-sm', t.soft)}>
                  <div className="flex justify-between"><span className={t.textMuted}>Partie A (liée au SR)</span><span>{fmtEuros(alloc.partA)}</span></div>
                  <div className="flex justify-between"><span className={t.textMuted}>Partie B (liée aux heures)</span><span>{fmtEuros(alloc.partB)}</span></div>
                  <div className="flex justify-between"><span className={t.textMuted}>Partie C (part fixe)</span><span>{fmtEuros(alloc.partC)}</span></div>
                  <div className={cx('flex justify-between pt-1.5 border-t font-semibold', t.panelBorder)}><span>= AJ brute</span><span>{fmtEuros(alloc.ajBrute)}</span></div>
                </div>
                <div className={cx('text-xs rounded-lg p-2.5', t.soft, t.textMuted)}>
                  Formule officielle Annexe 10 (art. 14) : AJ = A + B + C, avec A = [31,96 × (0,36 × SR≤13 700 € + 0,05 × SR&gt;13 700 €)] ÷ 5 000, B = [31,96 × (0,26 × NH≤690 h + 0,08 × NH&gt;690 h)] ÷ 507, C = 31,96 × 0,70. Le net déduit ~7,5 % (CSG/CRDS + participation retraite) — variable selon ton revenu fiscal de référence, peut être réduit ou nul. Ces paramètres évoluent : vérifie avec le simulateur officiel France Travail si un doute.
                </div>
              </div>
            )}
            {age === null ? (
              <div className="mt-2">
                <Field label="Ta date de naissance (pour le repère allongement senior)">
                  <TextInput type="date" value={data.profile.dateNaissance || ''} onChange={(e) => setData(d => ({ ...d, profile: { ...d.profile, dateNaissance: e.target.value } }))} />
                </Field>
              </div>
            ) : age >= 53 ? (
              <div className={cx('text-xs rounded-lg p-2.5 mt-2', t.soft, t.textMuted)}>
                Tu as <strong className={t.text}>{age} ans</strong> — à partir de 53 ans, la durée d'indemnisation peut être allongée (dispositif senior). Les seuils d'âge et la durée exacte de l'allongement dépendent de ta situation et changent régulièrement : vérifie les modalités précises avec France Travail plutôt que de te fier à un chiffre ici.
              </div>
            ) : null}
          </div>
          );
        })()}
      </Card>

      {recapAnnuel.length > 0 && (
        <Card>
          <button className="w-full flex items-center justify-between" onClick={() => setShowRecap(s => !s)}>
            <span className={cx('text-sm font-semibold flex items-center gap-1.5', t.textMuted)}><Icon name="calendar" size={16} />Récapitulatif annuel</span>
            <Icon name={showRecap ? 'chevronUp' : 'chevronDown'} size={16} className={t.textMuted} />
          </button>
          {showRecap && (
            <div className="mt-3 space-y-2">
              {recapAnnuel.map(r => (
                <div key={r.year} className={cx('flex items-center justify-between rounded-lg p-2.5', t.soft)}>
                  <div className="text-sm font-medium">{r.year}</div>
                  <div className="text-right">
                    <div className="text-sm font-semibold">{fmtEuros(r.brut)}</div>
                    <div className={cx('text-xs', t.textMuted)}>{r.nbCachets} cachet(s)</div>
                  </div>
                </div>
              ))}
              <div className={cx('text-xs rounded-lg p-2.5', t.soft, t.textMuted)}>Total brut par année civile, pour t'aider à préparer ta déclaration — indicatif, à recouper avec tes AEM.</div>
            </div>
          )}
        </Card>
      )}

      <Card>
        <button className="w-full flex items-center justify-between" onClick={() => setShowEmployeurs(s => !s)}>
          <span className={cx('text-sm font-semibold flex items-center gap-1.5', t.textMuted)}><Icon name="briefcase" size={16} />Employeurs ({data.employeurs.length})</span>
          <Icon name={showEmployeurs ? 'chevronUp' : 'chevronDown'} size={16} />
        </button>
        {showEmployeurs && (
          <div className="mt-3 space-y-2">
            {data.employeurs.length === 0 && <EmptyState text="Aucun employeur enregistré — ils s'ajoutent automatiquement quand tu crées un cachet, ou ajoute-en un ici." />}
            {data.employeurs.map(emp => {
              const nbCachetsEmp = data.cachets.filter(cc => cc.employeur === emp.nom).length;
              const expanded = expandedEmpId === emp.id;
              return (
              <div key={emp.id} className={cx('rounded-lg p-2', t.soft)}>
                <div className="flex items-center gap-3 justify-between cursor-pointer" onClick={() => setExpandedEmpId(expanded ? null : emp.id)}>
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div className={cx('w-8 h-8 rounded-full flex items-center justify-center shrink-0', theme === 'sombre' ? `bg-${currentAccent}-500/20 text-${currentAccent}-300` : `bg-${currentAccent}-100 text-${currentAccent}-700`)}>
                      <Icon name={{ Tournage: 'film', 'Théâtre': 'book', 'Voix off': 'mic' }[emp.typeParDefaut] || 'tag'} size={14} />
                    </div>
                    <div className="min-w-0">
                      <div className="text-sm font-medium truncate">{emp.nom}</div>
                      <div className={cx('text-xs', t.textMuted)}>{emp.typeParDefaut} · {nbCachetsEmp} cachet{nbCachetsEmp !== 1 ? 's' : ''}</div>
                    </div>
                  </div>
                  <div className="flex items-center gap-0.5 shrink-0">
                    <IconBtn name="edit" onClick={(e) => { e.stopPropagation(); setEmpModal({ editingId: emp.id }); }} />
                    <span onClick={(e) => e.stopPropagation()}><ConfirmDeleteButton onConfirm={() => removeEmployeur(emp.id)} /></span>
                    {emp.notes && <Icon name={expanded ? 'chevronUp' : 'chevronDown'} size={16} className={t.textMuted} />}
                  </div>
                </div>
                {expanded && emp.notes && (
                  <div className={cx('text-xs mt-2 pt-2 border-t', t.panelBorder, t.textMuted)}>{emp.notes}</div>
                )}
              </div>
              );
            })}
            <Btn variant="ghost" className="w-full" onClick={() => setEmpModal({ editingId: null })}><Icon name="plus" size={16} />Ajouter un employeur</Btn>
          </div>
        )}
      </Card>

      <Card>
        <SectionTitle right={
          <div className="flex gap-1.5 shrink-0">
            {sorted.length > 0 && <IconBtn name="download" title="Exporter la liste des cachets (PDF)" onClick={exportCachetsPdf} />}
            <Btn onClick={() => setModal({ editingId: null })}><Icon name="plus" size={16} />Cachet</Btn>
          </div>
        }>Cachets &amp; contrats</SectionTitle>
        <label className={cx('flex items-center justify-center gap-1.5 rounded-full px-4 py-2.5 text-sm font-medium cursor-pointer mb-3 text-center', t.soft, t.accent)}>
          <Icon name="upload" size={16} />Importer une ou plusieurs AEM (PDF) — pré-remplissage à vérifier
          <input ref={scanRef} type="file" accept=".pdf" multiple onChange={scanBulletins} className="hidden" />
        </label>
        {scanStatus && <div className={cx('text-xs mb-2', t.textMuted)}>{scanStatus}</div>}
        {sorted.length > 3 && (
          <>
            <div className="relative mb-2">
              <Icon name="search" size={16} className={cx('absolute left-2.5 top-2.5', t.textMuted)} />
              <TextInput placeholder="Rechercher un employeur, un projet…" value={searchCachet} onChange={(e) => setSearchCachet(e.target.value)} className="pl-8" />
            </div>
            {moisDisponibles.length > 1 && (
              <Select value={filterMois} onChange={(e) => setFilterMois(e.target.value)} className="mb-2">
                <option value="Tous">Tous les mois</option>
                {moisDisponibles.map(m => <option key={m} value={m}>{fmtMoisAnnee(m)}</option>)}
              </Select>
            )}
          </>
        )}
        {sorted.length === 0 ? <EmptyState icon="briefcase" text="Aucun cachet enregistré pour l'instant." /> : sortedFiltered.length === 0 ? (
          <EmptyState icon="briefcase" text="Aucun cachet ne correspond." />
        ) : (
          <div className="space-y-2">
            {sortedFiltered.map(cc => (
              <div key={cc.id} className={cx('rounded-xl p-3', t.soft, t.cardHover)}>
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className="font-medium truncate">{cc.projet || '(sans titre)'} <span className={cx('text-xs font-normal', t.textMuted)}>· {cc.type}</span></div>
                    <div className={cx('text-xs', t.textMuted)}>{[cc.employeur, fmtDate(cc.dateDebut)].filter(Boolean).join(' — ')}</div>
                    <div className="flex gap-1.5 mt-1.5 flex-wrap">
                      <Pill>{cc.statut}</Pill>
                      <Pill>AEM : {cc.aem}</Pill>
                      {Number(cc.nbCachets) > 0 && <Pill>{cc.nbCachets} cachet(s)</Pill>}
                      {Number(cc.heures) > 0 && <Pill>{cc.heures} h</Pill>}
                    </div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="font-semibold">{fmtEuros(cc.montantBrut)}</div>
                    <div className="flex gap-0.5 mt-1">
                      <IconBtn name="edit" title="Modifier" onClick={() => setModal({ editingId: cc.id })} />
                      <IconBtn name="copy" title="Dupliquer" onClick={() => { const { id, ...rest } = cc; setModal({ editingId: null, draft: rest }); }} />
                      <ConfirmDeleteButton onConfirm={() => removeCachet(cc.id)} />
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      {modal && (

function CastingsTab({ data, setData }) {
  const { theme } = useTheme();

  const upsert = (v) => {
    const prev = modal.editingId ? data.castings.find(c => c.id === modal.editingId) : null;
    const becameObtenu = v.statut === 'Obtenu' && (!prev || prev.statut !== 'Obtenu');
    setData(d => ({ ...d, castings: modal.editingId ? d.castings.map(c => c.id === modal.editingId ? { ...c, ...v } : c) : [...d.castings, { id: uid(), ...v }] }));
    setModal(null);
    if (becameObtenu) setRepModal({ editingId: null, draft: { titre: v.projet, lieu: v.structure || '', date: '', heure: '' } });
  };
  const remove = (id) => setData(d => ({ ...d, castings: d.castings.filter(c => c.id !== id) }));

  const upsertRep = (v) => {
    setData(d => ({ ...d, representations: repModal.editingId ? d.representations.map(r => r.id === repModal.editingId ? { ...r, ...v } : r) : [...d.representations, { id: uid(), ...v }] }));

  const today = new Date().toISOString().slice(0, 10);
  const sorted = [...data.castings].sort((a, b) => (b.dateEnvoi || '').localeCompare(a.dateEnvoi || ''));

          <Icon name={showReps ? 'chevronUp' : 'chevronDown'} size={16} />
        </button>

          <div className="mt-3 space-y-2">
            {upcomingReps.length === 0 && <EmptyState text="Aucune date pour l'instant." />}
            {upcomingReps.map(r => (
              <div key={r.id} className="flex items-center justify-between text-sm">
                <div><span className="font-medium">{r.titre}</span> <span className={t.textMuted}>— {r.lieu} · {fmtDate(r.date)} {r.heure}</span></div>
                <div className="flex gap-0.5">
                  <IconBtn name="edit" onClick={() => setRepModal({ editingId: r.id })} />

          </div>

      <Card>
        <SectionTitle right={<Btn onClick={() => setModal({ editingId: null })}><Icon name="plus" size={16} />Casting</Btn>}>Castings &amp; auto-candidatures</SectionTitle>
        {sorted.length === 0 ? <EmptyState icon="film" text="Aucun casting enregistré." /> : (
          <div className="space-y-2">
            {sorted.map(c => (
              <div key={c.id} className={cx('rounded-xl p-3', t.soft, t.cardHover)}>
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className="font-medium truncate">{c.projet}</div>
                    {(c.role || c.structure) && <div className={cx('text-xs', t.textMuted)}>{[c.role, c.structure].filter(Boolean).join(' — ')}</div>}
                    <div className="flex gap-1.5 mt-1.5 flex-wrap items-center">
                      <Pill>{c.statut}</Pill>
                      <span className={cx('text-xs', t.textMuted)}>{fmtDate(c.dateEnvoi)}</span>
                      {c.dateRelance && c.dateRelance <= today && <Pill>🔔 Relancer</Pill>}
                    </div>
                  </div>
                  <div className="flex gap-0.5 shrink-0">
                    <IconBtn name="edit" onClick={() => setModal({ editingId: c.id })} />
                    <ConfirmDeleteButton onConfirm={() => remove(c.id)} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      {modal && (
        <Modal title={modal.editingId ? 'Modifier le casting' : 'Nouveau casting'} onClose={() => setModal(null)}>
          <CastingForm initial={modal.editingId ? data.castings.find(c => c.id === modal.editingId) : null} structures={structures} onSave={upsert} onCancel={() => setModal(null)} />
        </Modal>
      )}
      {repModal && (
        <Modal title={repModal.editingId ? 'Modifier la date' : 'Nouvelle date'} onClose={() => setRepModal(null)}>
          {repModal.draft && <div className={cx('rounded-lg p-2 text-xs mb-3', t.soft, t.accent)}>🎉 Casting obtenu — ajoute une première date de représentation (tu pourras en ajouter d'autres ensuite).</div>}
          <RepresentationForm initial={repModal.draft || (repModal.editingId ? data.representations.find(r => r.id === repModal.editingId) : null)} onSave={upsertRep} onCancel={() => setRepModal(null)} />
        </Modal>
      )}
    </div>
  );
}

function ContactsTab({ data, setData }) {
  const { theme } = useTheme();
  const t = themeClasses(theme);
  const [modal, setModal] = useState(null);
  const [catModal, setCatModal] = useState(false);
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('Toutes');
  const [sortAlpha, setSortAlpha] = useState(true);
  const [importDrafts, setImportDrafts] = useState(null);
  const importSupported = typeof navigator !== 'undefined' && !!navigator.contacts && !!navigator.contacts.select;

  const importFromPhone = async () => {
    try {
      const props = await navigator.contacts.getProperties();
      const wanted = ['name', 'tel', 'email'].filter(p => props.includes(p));
      const picked = await navigator.contacts.select(wanted, { multiple: true });
      if (!picked || !picked.length) return;
      const drafts = picked.map(p => {
        const candidate = {
          nom: (p.name && p.name[0]) || '',
          telephone: (p.tel && p.tel[0]) || '',
          email: (p.email && p.email[0]) || '',
          fonction: '', categorie: 'Perso', site: '', notes: '',
        };
        const isDuplicate = !!findDuplicateContact(candidate, data.contacts);
        return { ...candidate, selected: !isDuplicate, isDuplicate };
      });
      setImportDrafts(drafts);
    } catch (err) {
      // Sélecteur annulé par l'utilisateur ou permission refusée — rien à faire.
    }
  };
  const toggleImportDraft = (i) => setImportDrafts(prev => prev.map((d, idx) => idx === i ? { ...d, selected: !d.selected } : d));
  const confirmImport = () => {
    setData(d => {
      let contacts = d.contacts;
      let categories = d.categories;
      importDrafts.filter(dr => dr.selected).forEach(({ selected, isDuplicate, ...contactFields }) => {
        contacts = [...contacts, { id: uid(), ...contactFields }];
        if (!categories.includes(contactFields.categorie)) categories = [...categories, contactFields.categorie];
      });
      return { ...d, contacts, categories };
    });
    setImportDrafts(null);
  };

  const categories = useMemo(() => {
    const fromContacts = data.contacts.map(c => c.categorie).filter(Boolean);
    return Array.from(new Set([...data.categories, ...fromContacts]));
  }, [data.contacts, data.categories]);

  const renameCategory = (oldName, newName) => {
    if (!newName || newName === oldName) return;
    setData(d => ({
      ...d,
      categories: Array.from(new Set(d.categories.map(c => c === oldName ? newName : c))),
      contacts: d.contacts.map(c => c.categorie === oldName ? { ...c, categorie: newName } : c),
    }));
    if (catFilter === oldName) setCatFilter(newName);
  };
  const deleteCategory = (name) => {
    const count = data.contacts.filter(c => c.categorie === name).length;
    const msg = count > 0 ? `${count} contact(s) utilisent "${name}" — ils repasseront en "Perso". Continuer ?` : `Supprimer la catégorie "${name}" ?`;
    if (!window.confirm(msg)) return;
    setData(d => ({
      ...d,
      categories: d.categories.filter(c => c !== name),
      contacts: d.contacts.map(c => c.categorie === name ? { ...c, categorie: 'Perso' } : c),
    }));
    if (catFilter === name) setCatFilter('Toutes');
  };

  const upsert = (v) => {
    setData(d => {
      const categories = d.categories.includes(v.categorie) ? d.categories : [...d.categories, v.categorie];
      const contacts = modal.editingId ? d.contacts.map(c => c.id === modal.editingId ? { ...c, ...v } : c) : [...d.contacts, { id: uid(), ...v }];
      return { ...d, contacts, categories };
    });
    setModal(null);
  };
  const remove = (id) => setData(d => ({ ...d, contacts: d.contacts.filter(c => c.id !== id) }));
  const toggleFavori = (id) => setData(d => ({ ...d, contacts: d.contacts.map(c => c.id === id ? { ...c, favori: !c.favori } : c) }));

  let filtered = data.contacts.filter(c => {
    const matchSearch = !search || (c.nom + ' ' + c.fonction + ' ' + c.notes).toLowerCase().includes(search.toLowerCase());
    const matchCat = catFilter === 'Toutes' || c.categorie === catFilter;
    return matchSearch && matchCat;
  });
  filtered = filtered.sort((a, b) => {
    if (!!b.favori !== !!a.favori) return b.favori ? 1 : -1;
    return sortAlpha ? a.nom.localeCompare(b.nom) : (a.categorie || '').localeCompare(b.categorie || '');
  });

  return (
    <div className="space-y-3 pb-4">
      <Card>
        <div className="flex gap-2 mb-3">
          <div className="relative flex-1">
            <Icon name="search" size={16} className={cx('absolute left-2.5 top-2.5', t.textMuted)} />
            <TextInput placeholder="Rechercher…" value={search} onChange={(e) => setSearch(e.target.value)} className="pl-8" />
          </div>
          <IconBtn name="filter" title="Trier alphabétique / par catégorie" onClick={() => setSortAlpha(s => !s)} />
          <IconBtn name="settings" title="Gérer les catégories" onClick={() => setCatModal(true)} />
        </div>
        <div className="flex flex-wrap gap-1.5">
          {['Toutes', ...categories].map(cat => (
            <button key={cat} onClick={() => setCatFilter(cat)}
              className={cx('shrink-0 max-w-[9rem] truncate text-xs px-3 py-1.5 rounded-full font-medium', catFilter === cat ? t.btnPrimary : cx(t.soft, t.textMuted))}>
              {cat}
            </button>
          ))}
        </div>
      </Card>

      <Card>
        <SectionTitle right={
          <div className="flex gap-1.5 shrink-0">
            {importSupported && <IconBtn name="phone" title="Importer depuis les contacts du téléphone" onClick={importFromPhone} />}
            <Btn onClick={() => setModal({ editingId: null })}><Icon name="plus" size={16} />Contact</Btn>
          </div>
        }>Mes contacts ({filtered.length})</SectionTitle>
        {filtered.length === 0 ? <EmptyState icon="users" text="Aucun contact ne correspond." /> : (
          <div className="space-y-2">
            {filtered.map(c => (
              <div key={c.id} className={cx('rounded-xl p-3', t.soft, t.cardHover)}>
                <div className="flex items-start justify-between gap-2">
                  <div className="flex items-start gap-3 min-w-0">
                    <div className={cx('w-9 h-9 rounded-full flex items-center justify-center shrink-0 font-bold text-sm', theme === 'sombre' ? `bg-${currentAccent}-500/20 text-${currentAccent}-300` : `bg-${currentAccent}-100 text-${currentAccent}-700`)}>
                      {(c.nom || '?').trim().charAt(0).toUpperCase()}
                    </div>
                    <div className="min-w-0">
                    <div className="font-medium truncate">{c.nom}</div>
                    {c.fonction && <div className={cx('text-xs', t.textMuted)}>{c.fonction}</div>}
                    {c.categorie && <div className="mt-1.5"><Pill>{c.categorie}</Pill></div>}
                    {(c.telephone || c.email || c.site) && (
                      <div className="flex gap-1.5 mt-1.5 flex-wrap">
                        {c.telephone && <a href={'tel:' + c.telephone.replace(/\s+/g, '')} onClick={(e) => e.stopPropagation()} className={cx('text-xs flex items-center gap-1 px-2 py-1 rounded-full font-medium max-w-full', t.panel, t.accent)}><Icon name="phone" size={12} className="shrink-0" /><span className="truncate min-w-0">{c.telephone}</span></a>}

                      </div>

        <CategoriesModal categories={categories} contacts={data.contacts} onRename={renameCategory} onDelete={deleteCategory} onClose={() => setCatModal(false)} />
